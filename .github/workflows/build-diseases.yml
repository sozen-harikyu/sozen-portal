name: Build Disease Pages from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: スプレッドシートCSVから疾患ページを自動生成
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          ALLOW_INDEXING: 'true'
          INCLUDE_DRAFTS: 'true'
          SITE_BASE_URL: 'https://sozen-harikyu.github.io/sozen-portal'
          PORTAL_URL: 'https://sozen-harikyu.github.io/sozen-portal/'
        run: python3 scripts/build_diseases.py

      - name: 変更があれば自動でコミット＆反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disease/ sitemap.xml
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "auto: スプレッドシートから疾患ページを更新"
            git push
          fi
