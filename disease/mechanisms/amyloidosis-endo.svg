<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="アミロイドーシスにおける鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#16284c" />
  <rect x="0" y="28" width="780" height="20" fill="#16284c" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 アミロイドーシスにおける鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#b68d40" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">全身の経穴による体質・</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">緊張バランス評価</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">内科専門医の薬物・食事管理</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">を前提に、足三里・三陰交・</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">背部経穴へ安全にアプロー…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#16284c" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">視床下部・自律神経を介</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">した代謝環境調整</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ストレス由来の交感神経過緊</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">張を鎮め、ホルモン分泌や血</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">糖・尿酸管理を乱す疲労要…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#16284c" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">末梢微小循環と胃腸・神</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">経機能のサポート</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">手足や内臓の血流を促し、合</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">併しやすいしびれ・胃もたれ</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・倦怠感・関節痛の負担を…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#b68d40" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">専門医管理と協調した長</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">期コンディション維持</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">皮膚衛生や低刺激を徹底し、</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">日々の生活習慣改善を続けや</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">すい安定した体調づくりを…</text>
</svg>
