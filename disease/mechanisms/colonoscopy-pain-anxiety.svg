  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 大腸内視鏡検査時の腹痛・不安軽減における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c49342" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">足三里・内関・天枢への</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">経穴刺激</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">胃腸機能と深く結びつく四肢</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・腹部の経穴を刺激し、体性</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">感覚神経から中枢へ信号を…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c49342" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#21423a" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">迷走神経遠心路の活性化</text><text x="226" y="138" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">脳幹を経由した体性-内臓反</text><text x="226" y="155" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">射により、副交感神経（迷走</text><text x="226" y="172" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">神経）経由で胃腸の働きを…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c49342" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#21423a" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">胃排出・腸管蠕動と内臓</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">知覚の正常化</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">弱まったぜん動を促す一方、</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">下痢型の過剰な収縮や内臓知</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">覚過敏は穏やかに鎮静しま…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c49342" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c49342" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">脳腸相関の安定と食後・</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#21423a">排便リズム回復</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ストレスで乱れにくい胃腸の</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">土台を整え、胃もたれ・便通</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">異常・吐き気の軽減を目指…</text>
</svg>
