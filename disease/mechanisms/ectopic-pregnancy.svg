<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="異所性妊娠における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#4a2545" />
  <rect x="0" y="28" width="780" height="20" fill="#4a2545" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 異所性妊娠における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c98b5b" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">三陰交・腰仙部（八髎穴</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">）への優しい刺激</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">骨盤内臓器と同じ脊髄分節を</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">共有する腰仙部や下肢経穴へ</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、体質に合わせた刺激を行…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c98b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#4a2545" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">骨盤内微小循環と冷えの</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">改善</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">骨盤周囲の自律神経反射を介</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">して子宮・卵巣周囲の血流を</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">促し、冷えやうっ血を和ら…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c98b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#4a2545" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">視床下部（自律神経・体</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">温中枢）の安定</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ホルモン変動で過敏になった</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">視床下部を鎮静し、ほてり・</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">発汗・気分の揺らぎを穏や…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c98b5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c98b5b" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">周期・ライフステージに</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4a2545">寄り添う体調維持</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">婦人科治療とも協調しながら</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、月経・妊娠・更年期それぞ</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">れの負担を軽くする土台を…</text>
</svg>
