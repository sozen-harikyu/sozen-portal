<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="腓骨筋腱脱臼における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#1b3a4b" />
  <rect x="0" y="28" width="780" height="20" fill="#1b3a4b" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 腓骨筋腱脱臼における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c58b3c" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">深層筋の硬結へ直接アプ</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">ローチ</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">手技では届きにくい深層筋の</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">硬結（トリガーポイント）へ</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">繊細な鍼で直接刺激を届け…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c58b3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#1b3a4b" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">軸索反射による局所血流</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">改善</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">CGRPや一酸化窒素の放出</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">により微小血管が拡張し、滞</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">っていた発痛物質の洗い流…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c58b3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#1b3a4b" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">脊髄ゲート制御＋下行性</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">疼痛抑制</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">脊髄後角で痛み信号を遮断し</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、脳幹からの内因性鎮痛物質</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">（エンドルフィン等）の働…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c58b3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c58b3c" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">筋柔軟性の回復と再発予</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3a4b">防</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">防御性の筋スパズムが解け、</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">関節可動域と本来の動きやす</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">さが段階的に回復します。</text>
</svg>
