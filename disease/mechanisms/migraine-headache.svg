<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="片頭痛における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#1e2a4a" />
  <rect x="0" y="28" width="780" height="20" fill="#1e2a4a" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 片頭痛における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c48f45" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">頭部・後頸部・四肢経穴</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">への刺激</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">百会・風池・合谷などの経穴</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">刺激が三叉神経や大後頭神経</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・体性感覚路へ穏やかに作…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c48f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#1e2a4a" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">脳幹・視床下部の神経伝</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">達調整</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">脳幹の自律神経中枢やセロト</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ニン・GABA系のバランス</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">を整え、神経の過敏発火を…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c48f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#1e2a4a" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">頭頸部の微小循環と筋緊</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">張緩和</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">後頭下筋群や首深部のこわば</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">りを解き、頭部・内耳・顔面</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">周囲の血流環境をサポート…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c48f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c48f45" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">標準治療・リハビリ効果</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1e2a4a">の後押し</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">神経回路の再学習（可塑性）</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">と睡眠の質を高め、専門医の</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">治療やリハビリの土台を支…</text>
</svg>
