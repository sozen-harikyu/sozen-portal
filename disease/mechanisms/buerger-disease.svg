<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="パージャー病における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#272643" />
  <rect x="0" y="28" width="780" height="20" fill="#272643" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 パージャー病における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#b88a44" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">該当神経走行・遠位経穴</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">の調整</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">過敏な皮膚への過剰刺激を避</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">けつつ、神経の走行に沿った</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">安全な部位と遠位穴を刺激…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#b88a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#272643" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">神経周囲の微小血流・栄</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">養促進</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">神経を圧迫する周囲筋の過緊</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">張を緩め、神経線維の修復に</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">必要な酸素と血流環境を整…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#b88a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#272643" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">脊髄・脳の疼痛過敏（中</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">枢性感作）抑制</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">微細な刺激で過敏化した痛み</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">伝達回路を鎮静し、ピリピリ</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">感や放散痛の波を和らげま…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#b88a44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#b88a44" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#272643">感覚と生活機能の安定化</text><text x="602" y="138" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">睡眠不足や自律神経の緊張も</text><text x="602" y="155" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">同時に整え、しびれ・神経痛</text><text x="602" y="172" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">による生活支障度を軽減し…</text>
</svg>
