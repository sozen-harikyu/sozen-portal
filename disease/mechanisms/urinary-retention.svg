<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="尿閉における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#223c4e" />
  <rect x="0" y="28" width="780" height="20" fill="#223c4e" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 尿閉における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#b58b45" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">腰仙部（八髎穴周囲）と</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">下肢経穴の調整</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">膀胱・尿道括約筋を支配する</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">仙髄神経（S2〜S4）領域</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">の経穴へ的確にアプローチ…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#b58b45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#223c4e" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">陰部神経・骨盤神経の反</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">射機能調整</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">弱まった骨盤底筋の収縮サポ</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ートと、過敏になった膀胱排</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">尿筋の鎮静をバランスよく…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#b58b45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#223c4e" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">骨盤内血流改善と冷え・</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">緊張の緩和</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">腰殿部と下腹部の血流を高め</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、冷えや過緊張による頻尿・</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">違和感・痛みを和らげます。</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#b58b45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#b58b45" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">骨盤底筋訓練・標準治療</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#223c4e">との相乗サポート</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">泌尿器科の評価やセルフエク</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ササイズと併用し、安心して</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">外出できる日常の回復を支…</text>
</svg>
