<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="睡眠相前進症候群における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#1d3557" />
  <rect x="0" y="28" width="780" height="20" fill="#1d3557" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 睡眠相前進症候群における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#a9844f" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">体表の緊張サイン評価と</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">低刺激刺鍼</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">首肩・みぞおち・手足の過緊</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">張ポイントへ、交感神経を刺</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">激しすぎない優しい刺激を…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#a9844f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#1d3557" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">迷走神経（副交感神経）</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">の活性化</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">体性-自律神経反射を通じて</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">脳幹の迷走神経核へ働きかけ</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、心拍変動（HF/SDN…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#a9844f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#1d3557" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">ストレス応答系（HPA</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">軸）の鎮静</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">過剰なコルチゾール分泌や過</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">覚醒状態を落ち着かせ、深い</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">呼吸と入眠スイッチを引き…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#a9844f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#a9844f" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">自律神経の自然な切り替</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1d3557">え回復</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">「活動（昼）」と「休息（夜</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">）」のメリハリが戻り、動悸</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・不眠・倦怠感の波が穏や…</text>
</svg>
