  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#b68d40" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">安全領域（遠位経穴）へ</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">の低刺激アプローチ</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">手術創・リンパ節郭清側・患</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">部を厳格に避け、内関・足三</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">里・合谷など安全な経穴を…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#16284c" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">中枢性鎮痛・制吐経路の</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">活性化</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">内因性鎮痛系や延髄嘔吐中枢</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">の抑制経路へ働きかけ、痛み</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・吐き気・しびれの軽減を…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#16284c" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">迷走神経抗炎症反射と自</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">律神経調整</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">治療に伴う炎症性サイトカイ</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ン反応や過覚醒を穏やかに整</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">え、倦怠感や不眠の負担を…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#b68d40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#b68d40" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">標準がん治療を完遂しや</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#16284c">すいQOL維持</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">主治医の治療計画を最優先に</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、体力と生活の質を保ちなが</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ら治療を続けられる環境を…</text>
</svg>
