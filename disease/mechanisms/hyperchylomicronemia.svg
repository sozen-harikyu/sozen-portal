<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="高カイロミクロン血症における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#4b2230" />
  <rect x="0" y="28" width="780" height="20" fill="#4b2230" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 高カイロミクロン血症における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c48a47" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">内関（PC6）・神門な</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">ど心包経・心経の調整</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">循環器専門医の標準治療を絶</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">対前提とし、手首や背部の安</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">全な経穴へ低刺激でアプロ…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c48a47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#4b2230" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">交感神経過剰興奮の抑制</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">と迷走神経調整</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">心臓への過剰な交感神経刺激</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">を穏やかに鎮め、心拍リズム</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">と血管緊張の急変を抑えま…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c48a47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#4b2230" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">胸郭・背部の筋緊張緩和</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">と深い呼吸</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ストレスで固まりやすい胸郭</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">や横隔膜の緊張を解き、酸素</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">摂取とリラックス反応を促…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c48a47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c48a47" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">標準治療下での発作不安</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#4b2230">・睡眠の質改善</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">内服管理を厳守しながら、疲</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">労やストレスが引き金となる</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">症状不安の軽減を支えます。</text>
</svg>
