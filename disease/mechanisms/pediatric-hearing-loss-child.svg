<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="小児難聴における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#244b5a" />
  <rect x="0" y="28" width="780" height="20" fill="#244b5a" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 小児難聴における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#d19344" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">皮膚を優しく撫でる無痛</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">アプローチ</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">刺さない専用の「小児はり（</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">てい鍼）」で、背中や手足の</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">皮膚をリズミカルに優しく…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#d19344" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#244b5a" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">C触覚線維を介した心地</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">よい神経伝達</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">皮膚への穏やかな触覚刺激が</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">脳へ伝わり、安心ホルモン（</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">オキシトシン等）と副交感…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#d19344" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#244b5a" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">未熟な自律神経・睡眠・</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">胃腸リズムの安定</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">興奮しやすい子どもの神経バ</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ランスを落ち着かせ、夜泣き</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・おねしょ・起立不調の土…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#d19344" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#d19344" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">小児科・療育と連携した</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#244b5a">健やかな成長支援</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">保護者の方と寄り添いながら</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">、お子さまの体調と成長ペー</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">スに合わせた無理のないケ…</text>
</svg>
