<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="耳鳴りにおける鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#1f3c58" />
  <rect x="0" y="28" width="780" height="20" fill="#1f3c58" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 耳鳴りにおける鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c28b3b" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">耳周囲・後頸部・遠位経</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">穴の調整</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">翳風・風池・合谷など、耳鼻</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">咽喉領域の神経・血管と連動</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">する経穴へ繊細にアプロー…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c28b3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#1f3c58" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">内耳・鼻咽腔の微小循環</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">サポート</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">首・顎まわりの深層筋緊張を</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">緩め、内耳や粘膜周囲の滞っ</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">た血流とリンパ循環を促し…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c28b3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#1f3c58" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">自律神経と聴覚・粘膜過</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">敏の鎮静</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">ストレスや睡眠不足で高ぶっ</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">た交感神経を鎮め、音への過</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">敏反応や粘膜の過剰反応を…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c28b3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c28b3b" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">耳鼻科治療と併用した回</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1f3c58">復促進</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">標準治療を妨げない設計で、</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">生活支障度（THI等）の軽</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">減と再発しにくい体調づく…</text>
</svg>
