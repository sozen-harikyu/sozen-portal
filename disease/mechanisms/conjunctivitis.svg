<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="結膜炎における鍼灸の作用機序（4ステップ）">
  <rect width="780" height="250" rx="20" fill="#faf8f4" />
  <rect x="0" y="0" width="780" height="48" rx="20" fill="#1b3b5c" />
  <rect x="0" y="28" width="780" height="20" fill="#1b3b5c" />
  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 結膜炎における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#4f86b8" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">後頸部・側頭部・遠位経</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">穴への安全アプローチ</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">眼球周囲の危険な深刺しを避</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">け、風池・天柱・合谷・太衝</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">など安全な経穴へ繊細に施…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#4f86b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#1b3b5c" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">頭頸部・眼周囲の血流と</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">筋緊張緩和</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">PC・スマホ作業や緊張で固</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">まった首深層筋と眼輪筋周囲</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">の血流を促し、重だるさを…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#4f86b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#1b3b5c" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">副交感神経の調整とピン</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">ト疲労ケア</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">交感神経優位による目の乾き</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">・ピント調節疲労を鎮め、涙</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">液分泌とリラックス反応を…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#4f86b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#4f86b8" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">眼科標準治療を前提とし</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#1b3b5c">た視覚負担軽減</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">眼科の点眼・定期検査を最優</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">先としつつ、日々の眼精疲労</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">や頭痛・肩こりの連鎖を整…</text>
</svg>
