  <text x="24" y="31" font-family="Noto Serif JP, serif" font-size="15.5" font-weight="700" fill="#ffffff">🔬 蜂窩織炎における鍼灸の作用機序（4ステップ）</text>
  <text x="756" y="30" text-anchor="end" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#e2e8f0">銀座そうぜん鍼灸院</text>
  <rect x="24" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="38" y="80" width="56" height="20" rx="10" fill="#c28f45" /><text x="66" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 1</text><text x="38" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">皮疹を避けた安全な経穴</text><text x="38" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">刺激</text><text x="38" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">湿疹・傷口への直接刺激を避</text><text x="38" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">け、曲池・血海・築賓・三陰</text><text x="38" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">交など全身の調整穴へアプ…</text><path d="M197 146 L207 146 M203 141 L208 146 L203 151" stroke="#c28f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="226" y="80" width="56" height="20" rx="10" fill="#3c3a2a" /><text x="254" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 2</text><text x="226" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">末梢・中枢の掻痒（かゆ</text><text x="226" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">み）シグナル抑制</text><text x="226" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">痒み感覚を伝える神経経路の</text><text x="226" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">過敏性を鎮め、「かゆい→掻</text><text x="226" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">く→悪化」の悪循環を断ち…</text><path d="M385 146 L395 146 M391 141 L396 146 L391 151" stroke="#c28f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="400" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="414" y="80" width="56" height="20" rx="10" fill="#3c3a2a" /><text x="442" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 3</text><text x="414" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">自律神経と末梢循環・皮</text><text x="414" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">膚バリアの支援</text><text x="414" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">交感神経の過緊張や夜間覚醒</text><text x="414" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">を和らげ、皮膚の修復が進み</text><text x="414" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">やすい血流と睡眠環境を整…</text><path d="M573 146 L583 146 M579 141 L584 146 L579 151" stroke="#c28f45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="588" y="68" width="168" height="156" rx="16" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.5" /><rect x="602" y="80" width="56" height="20" rx="10" fill="#c28f45" /><text x="630" y="94" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">STEP 4</text><text x="602" y="114" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">皮膚科治療と併用した再</text><text x="602" y="132" font-family="Noto Serif JP, serif" font-size="13.5" font-weight="700" fill="#3c3a2a">燃しにくい体質へ</text><text x="602" y="152" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">標準の保湿・外用・内服治療</text><text x="602" y="169" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">と協調し、ストレスや季節変</text><text x="602" y="186" font-family="Noto Sans JP, sans-serif" font-size="11" fill="#475569">化で悪化しにくい土台を支…</text>
</svg>
