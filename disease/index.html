": false}, {"id": "D170", "name": "肝性脳症", "category": "消化器のお悩み", "keywords": "肝性脳症 肝硬変 アンモニア 意識障害 羽ばたき振戦 補完ケア", "slug": "hepatic-encephalopathy", "summary": "肝機能の低下で有害物質が脳へ達し、昼夜逆転や手の震え、意識障害を引き起こす状態です。", "symptoms": "昼夜逆転や強い倦怠感、集中力低下が続いている / 手首を反らすと小刻みに震える（羽ばたき振戦） / 気分の変動や混乱、言葉が出にくいなどの異変がある / かび臭く甘い口臭や意識がぼんやりする症状がある", "image_file": "cat_digestive.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D171", "name": "胆石症", "category": "消化器のお悩み", "keywords": "胆石症 胆のう結石 胆石発作 みぞおち痛 右肋骨下痛 鍼灸", "slug": "gallstones", "summary": "胆のうや胆管に結石が生じ、脂っこい食後の右肋骨下やみぞおちの強い痛みを引き起こします。", "symptoms": "脂っこい食事の後や夜間に右肋骨下やみぞおちが強く痛む / 痛みが右肩や背中へ広がり、数十分から数時間続く / 発熱や悪寒、吐き気・嘔吐、黄疸などの症状がある / 健診で胆石を指摘され、再発や悪化が気になっている", "image_file": "cat_digestive.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D172", "name": "ネフロン癆", "category": "消化器のお悩み", "keywords": "ネフロン癆 遺伝性腎疾患 多尿 口渇 腎機能低下 補完ケア", "slug": "nephronophthisis", "summary": "腎臓に嚢胞が生じ進行性に腎機能が低下する遺伝性腎疾患で、多尿や口渇、倦怠感を伴います。", "symptoms": "むくみは少ないのに多尿や頻尿、強い口渇が続いている / 夜尿や昼間の尿失禁、軽度の貧血やだるさがある / 食欲不振や吐き気、体重減少、成長の遅れがみられる / 専門医で腎機能や神経・目の合併症を含め経過観察中である", "image_file": "cat_digestive.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D173", "name": "ペットボトル症候群", "category": "消化器のお悩み", "keywords": "ペットボトル症候群 ソフトドリンクケトーシス 清涼飲料水 高血糖 喉の渇き 生活習慣", "slug": "pet-bottle-syndrome", "summary": "甘い清涼飲料水の多飲で急激な高血糖と脱水を起こす急性の糖尿病（ソフトドリンクケトーシス）です。", "symptoms": "ジュースやスポーツドリンクを毎日大量に飲んでいる / 強い喉の渇きや頻尿・多尿、倦怠感やイライラがある / 急激な体重減少や腹痛、吐き気が出てきた / 呼吸の異常や意識がぼんやりする症状がある", "image_file": "cat_digestive.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D174", "name": "偽膜性大腸炎", "category": "消化器のお悩み", "keywords": "偽膜性大腸炎 抗生物質 下痢 水様便 腹痛 発熱", "slug": "pseudomembranous-colitis", "summary": "抗生物質による腸内細菌の乱れから毒素が生じ、頻回な下痢や腹痛、発熱を起こす大腸炎です。", "symptoms": "抗生物質の服用中または中止後に頻回な水様便・粘液便が出る / 腹痛や腹部膨満感、吐き気が続いている / 38℃を超える発熱や強いだるさを伴う / 血便が出ていたり症状が急に悪化したりしている", "image_file": "cat_digestive.png", "image_exists": true, " 281", "name": "ベーチェット病", "category": "皮膚のお悩み", "keywords": "ベーチェット病, 指定難病, 口腔アフタ, 結節性紅斑, ぶどう膜炎, 全身性炎症性疾患, 鍼灸, 銀座", "slug": "behcet-disease", "summary": "口腔粘膜や皮膚・眼・外陰部などに慢性の炎症を繰り返す指定難病です。専門医での診療・管理を最優先とし、保温とストレス緩和を補完的に支えます。", "symptoms": "口の中に痛みを伴うアフタ性口内炎が何度も繰り返しできる / すねの結節性紅斑やニキビ様の皮疹など皮膚症状が出やすい / 目の充血やかすみ・視力低下など眼症状（ぶどう膜炎）が心配 / 外陰部の潰瘍や全身の倦怠感・関節痛があり体調の波が大きい", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D282", "name": "ジベル薔薇色粃糠疹", "category": "皮膚のお悩み", "keywords": "ジベル薔薇色粃糠疹, ジベルばら色粃糠疹, 楕円形の赤い発疹, 主疹, クリスマスツリー状, 皮膚科, 鍼灸, 銀座", "slug": "pityriasis-rosea", "summary": "体幹や腕に楕円形の赤い発疹が広がり1〜2か月で自然軽快することが多い疾患です。他疾患との鑑別のため皮膚科受診を最優先とし、体調面を支えます。", "symptoms": "軽い風邪症状の1〜2週間後に胸や背中・お腹へ赤い発疹が出てきた / 最初に2〜10cmほどの大きな楕円形の発疹（主疹）が現れた / 背中や胴体に小さな発疹がクリスマスツリー状に広がっている / かゆみは軽いが薬疹やカビなど別の皮膚病ではないか不安", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D283", "name": "伝染性紅斑", "category": "皮膚のお悩み", "keywords": "伝染性紅斑, りんご病, ヒトパルボウイルスB19, 頬の赤み, 大人の関節痛, ウイルス感染, 鍼灸, 銀座", "slug": "erythema-infectiosum", "summary": "ヒトパルボウイルスB19の感染により頬がりんごのように赤くなり手足に発疹が出る感染症です。医療機関での診療と感染予防が最優先となります。", "symptoms": "風邪のような発熱・咳・だるさの約1週間後に両頬が赤くなった / 腕や太ももにまだら模様（レース状）の赤い発疹が広がっている / 大人になってから感染し手指や膝の関節痛・こわばりがつらい / 妊娠中または貧血の持病があり周囲の流行で感染が心配", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D284", "name": "日光角化症", "category": "皮膚のお悩み", "keywords": "日光角化症, 老人性角化症, 前がん病変, 紫外線ダメージ, 顔のざらざら, 皮膚科, 鍼灸, 銀座", "slug": "actinic-keratosis", "summary": "長年の紫外線蓄積で顔や手の甲にざらざらした斑が生じる前がん病変です。皮膚がん移行を防ぐため皮膚科専門医での早期診断・治療が絶対最優先です。", "symptoms": "顔・うなじ・手の甲・頭部など日に当たる場所に赤〜褐色の斑がある / シミや湿疹に似ているが表面がざらざら・かさかさして治らない / 斑点が徐々に大きくなったり色が濃くなったり出血・かさぶたがある / 屋外での仕事やスポーツ歴が長く皮膚がんへの進行が心配", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D285", "name": "ストロフルス", "category": "皮膚のお悩み", "keywords": "ストロフルス, 小児ストロフルス, 虫刺されアレルギー, 硬い発疹, 強いかゆみ, 鍼灸, 銀座", "slug": "strop 心身負担を和らげたい", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D307", "name": "特発性後天性全身性無汗症", "category": "皮膚のお悩み", "keywords": "特発性後天性全身性無汗症, AIGA, 無汗症, 熱中症リスク, コリン性蕁麻疹, ステロイドパルス, 指定難病, 鍼灸, 銀座", "slug": "acquired-idiopathic-generalized-anhidrosis", "summary": "明らかな原因なく後天的に全身の汗が出なくなり、体温調節が困難になる指定難病です。皮膚科での治療と冷却対策を最優先とします。", "symptoms": "暑い環境や運動時でも汗が出ず、全身のほてりや体温上昇が起きる / 脱力感や疲労感、めまい、動悸、吐き気など熱中症様の症状が出やすい / 体が温まるとチクチクした痛みやコリン性蕁麻疹が現れやすい / 冷却対策と専門治療を続けながら自律神経の乱れや疲労を整えたい", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D308", "name": "弾性線維性仮性黄色腫", "category": "皮膚のお悩み", "keywords": "弾性線維性仮性黄色腫, PXE, 指定難病, 皮膚のたるみ, 眼底変化, 鍼灸, 銀座", "slug": "pseudoxanthoma-elasticum", "summary": "弾性線維の変性により皮膚・眼・血管に障害が生じる指定難病です。専門医の定期管理を最優先に、安定期の体調維持を補完的に支えます。", "symptoms": "首やわき、肘・膝の屈曲部に黄色いブツブツや皮膚のたるみがある / 視野のゆがみや視力低下など眼の症状を指摘されている / 血管の石灰化による手足の冷えや疲れやすさが気になる / 難病と向き合う中で肩こりや全身の緊張、ストレスが溜まっている", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D309", "name": "薬剤性過敏症症候群", "category": "皮膚のお悩み", "keywords": "薬剤性過敏症症候群, DIHS, DRESS症候群, 重症薬疹, 抗けいれん薬, 鍼灸, 銀座", "slug": "drug-induced-hypersensitivity-syndrome", "summary": "薬剤を契機に高熱・全身発疹・臓器障害を起こす重症薬疹です。入院治療が必須で急性期は鍼灸禁忌、退院後の安定期ケアに対応します。", "symptoms": "新しい薬の服用後2〜6週間で38度以上の高熱と全身の赤い発疹が出た / 首やわきなど全身のリンパ節が腫れ、強い倦怠感がある / 血液検査で肝機能障害や好酸球の増加を指摘された / 入院治療で落ち着いた後も疲労感や自律神経の乱れが残っている", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D310", "name": "スティーヴンス・ジョンソン症候群", "category": "皮膚のお悩み", "keywords": "スティーヴンス・ジョンソン症候群, SJS, 重症薬疹, 指定難病, 粘膜びらん, 鍼灸, 銀座", "slug": "stevens-johnson-syndrome", "summary": "高熱とともに全身の皮膚や粘膜にびらん・水疱が生じる重症薬疹（指定難病）です。緊急入院が必須で、退院後の安定期ケアのみ対応します。", "symptoms": "高熱や喉の痛み、強い倦怠感とともに全身に紅斑や水疱が広がっている / 唇や口の中、目の充血・目やになど粘膜のただれと痛みが強い / 風邪薬や鎮痛薬、抗菌薬、抗けいれん薬の服用後に急激に症状が出た / 退院後の回復期に体力低下や自律神経の乱れ、目の疲れが続いている", "image_file": "cat_skin.png", "image_exists": true, "has_y e": true, "has_rich": false}, {"id": "D324", "name": "天疱瘡", "category": "皮膚のお悩み", "keywords": "天疱瘡, 尋常性天疱瘡, 落葉状天疱瘡, 自己免疫性水疱症, 指定難病, 鍼灸, 銀座", "slug": "pemphigus", "summary": "自己抗体により皮膚や粘膜に水疱・びらんが生じる指定難病です。専門医の免疫抑制療法を最優先に、安定期の体調ケアを補完的に行います。", "symptoms": "皮膚に破れやすい水疱ができ、強い痛みやびらん・潰瘍になっている / 口の中や舌に水疱やただれができ、食事や会話が辛い / 40〜60代で発症し、尋常性天疱瘡や落葉状天疱瘡と診断されている / ステロイド治療を継続する中で疲労感や睡眠の乱れ、ストレスが強い", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D325", "name": "多発性筋炎", "category": "皮膚のお悩み", "keywords": "多発性筋炎, 皮膚筋炎, 膠原病, 指定難病, 筋力低下, 鍼灸, 銀座", "slug": "polymyositis", "summary": "自己免疫が筋肉や皮膚を攻撃し筋力低下や倦怠感を起こす膠原病（指定難病）です。専門医治療を最優先に、安定期の体調維持を支えます。", "symptoms": "両腕や太ももなど体幹に近い筋肉が徐々に弱くなり、立ち上がりや階段が辛い / 日常の動作で強い疲労感や倦怠感、筋肉痛、関節痛が続いている / 食べ物の飲み込みにくさ（嚥下障害）や息切れを感じることがある / 皮膚の赤みや発疹（皮膚筋炎）があり、専門医で経過観察を受けている", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D326", "name": "膿皮症", "category": "皮膚のお悩み", "keywords": "膿皮症, 慢性膿皮症, 臀部膿皮症, 化膿, 太淵, 肩髃, 曲池, 鍼灸, 銀座", "slug": "pyoderma", "summary": "黄色ブドウ球菌などの細菌感染で皮膚や皮下に膿が溜まる感染症です。抗菌薬や外科処置を最優先に、安定期の体質ケアを支えます。", "symptoms": "お尻（臀部）やわき、首などに赤く硬い腫れや熱感、かゆみがある / 皮膚の下がブヨブヨして膿が溜まり、座るだけでも強い痛みが出る / 皮膚に穴が開いて排膿を繰り返し、黒ずみや硬いしこりが広がっている / 繰り返す炎症や痔瘻の合併がないか、悪化が不安になっている", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D327", "name": "花粉症皮膚炎", "category": "皮膚のお悩み", "keywords": "花粉症皮膚炎, 花粉肌荒れ, まぶたのかゆみ, 大椎, 合谷, 曲池, 太淵, 鍼灸, 銀座", "slug": "pollen-dermatitis", "summary": "花粉が肌に付着することでまぶたや頬、首に乾燥・赤み・かゆみが起きる皮膚炎です。保湿と避粉に加え、4つのツボで体質を整えます。", "symptoms": "スギやヒノキなど花粉の季節になるとまぶた・頬・首がかゆくて赤くなる / 鼻水やくしゃみは少ないのに、露出部の肌がカサカサ乾燥して腫れぼったい / 夜間に顔や首のかゆみが強くなり、掻きむしってヒリヒリしている / 毎年同じ時期に肌荒れを繰り返し、ストレスや睡眠不足になっている", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D328", "name": "リベド血管症", "category": "皮膚のお悩み", "keywords": "リベド血管症, リベド血管炎, 夏期潰瘍, コケット静脈群, 三陰交, 百会, 足三里, 鍼灸, 銀座", "slug": "livedoid-vasculopathy", "summary": "膝から下や足関節周囲に網状の皮斑と強い痛みを伴う潰瘍を繰り返す難治性疾患です。皮膚科管理と併用し、潰瘍予防と回復を支えます。", "symptoms": "膝から下やくるぶし周囲に網目状の紫斑や白い萎縮痕ができている / 特に夏場を中心に強い痛みを伴う皮膚潰瘍（夏期潰瘍）を繰り返している / 潰瘍の痛みで夜眠れなかったり、歩くのが辛かったりして外出を控えている / 病院の薬や軟膏を続けても新たな潰瘍やうっ血が出て悩んでいる", "image_file": "cat_skin.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D329", "name": "正中神経障害", "category": "神経のお悩み", "keywords": "正中神経障害, 手根管症候群, 指のしびれ, 親指の痛み, 握力低下, 鍼灸, 銀座", "slug": "median-nerve-disorder", "summary": "手首から手のひらを通る正中神経が圧迫・損傷され、親指〜薬指のしびれや痛み、握力低下などを引き起こす末梢神経障害です。", "symptoms": "親指から薬指の親指側にかけてしびれや痛みがある / 夜間や明け方に手のしびれ・痛みが強くなり目が覚める / 物をよく落とす・細かい作業がしにくいなど握力低下を感じる / 親指の付け根が痩せてきたり、親指と小指を合わせにくい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D330", "name": "橈骨神経障害", "category": "神経のお悩み", "keywords": "橈骨神経障害, 橈骨神経麻痺, 下垂手, サタデーナイト症候群, 手首が上がらない, 鍼灸, 銀座", "slug": "radial-nerve-disorder", "summary": "上腕から前腕を通る橈骨神経が圧迫・損傷され、手首や指を反らせにくくなる下垂手や手の甲側のしびれを生じる神経障害です。", "symptoms": "手首が垂れ下がり、自力で反らせない（下垂手） / 指の付け根を伸ばしにくく、物をつかみにくい / 親指・人差し指・中指の手の甲側にしびれや感覚の鈍さがある / 飲酒後のうたた寝や腕枕のあとから急に手が動きにくくなった", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D331", "name": "モートン病", "category": "神経のお悩み", "keywords": "モートン病, 足指の痛み, 足裏のしびれ, 第3第4趾間, ハイヒール, 鍼灸, 銀座", "slug": "mortons-neuroma", "summary": "足の指の付け根を通る神経が靱帯と地面に挟まれて圧迫され、主に第3〜4趾間に鋭い痛みやしびれを起こす絞扼性神経障害です。", "symptoms": "足の第3〜4趾（または第2〜3趾）の付け根から指先にピリピリ・チクチクした痛みがある / ヒールや先が細い靴を履くと痛み、靴を脱ぐと症状が和らぐ / 点字ブロックや小さな段差を踏んだときに強い痛みが走る / 足裏に硬いしこりのような違和感があり、ふくらはぎまで響くことがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D332", "name": "家族性地中海熱", "category": "神経のお悩み", "keywords": "家族性地中海熱, 指定難病, 自己炎症性疾患, 繰り返す発熱, 腹膜炎, 鍼灸, 銀座", "slug": "familial-mediterranean-fever", "summary": "MEFV遺伝子の変異により発熱や腹痛・胸痛・関節炎の発作を繰り返す指定難病で、専門医の標準治療が最優先となる自己炎症性疾患です。", "symptoms": "38℃以上の発熱が12〜72時間ほど続き、周期的に繰り返す / 発熱に伴って強い腹痛（腹膜炎）や深呼吸で悪化する胸痛（胸膜炎）が出る / 膝や足首など下肢の関節が腫れて熱感や痛みが生じる / ストレスや疲労、月経、冷えなどをきっかけに体調を崩しやすい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D333", "name": "むずむず脚症候群", "category": "神経のお悩み", "keywords": "むずむず脚症候群, レストレスレッグス症候群, 足の違和感, 不眠, 陰陵泉, 陽陵泉, 鍼灸, 銀座", "slug": "restless-legs-syndrome", "summary": "安静時や夕方〜夜間に脚の奥にむずむずした不快感が生じ、脚を動かさずにはいられなくなって不眠などを招く神経疾患です。", "symptoms": "夕方から夜にかけて脚の奥がむずむず・ジリジリしてじっとしていられない / 脚を動かしたり歩いたりすると一時的に不快感が和らぐ / 皮膚のかゆみとは違い、かいても解消せず寝つきが悪い・夜中に目が覚める / 睡眠中に足首が無意識にピクッと動く（周期性四肢運動）と言われたことがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D334", "name": "高安動脈炎", "category": "神経のお悩み", "keywords": "高安動脈炎, 大動脈炎症候群, 指定難病, 血管炎, めまい, 腕のだるさ, 鍼灸, 銀座", "slug": "takayasu-arteritis", "summary": "大動脈やその主要な分枝に炎症が起き、血管の狭窄や閉塞からめまい・腕のだるさ・発熱などを生じる指定難病の大型血管炎です。", "symptoms": "原因不明の発熱や強い倦怠感、食欲低下、体重減少が続いている / 立ちくらみ・めまい・失神や、目のかすみなど視力の変化がある / 少し作業しただけで腕がだるくしびれる、または歩くと脚が疲れやすい / 首の痛みや高血圧、耳鳴り・難聴などの症状が気になっている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D335", "name": "骨髄繊維症", "category": "神経のお悩み", "keywords": "骨髄繊維症, 骨髄線維症, 指定難病, 血液疾患, 貧血, 脾腫, 倦怠感, 鍼灸, 銀座", "slug": "myelofibrosis", "summary": "骨髄が線維化して正常な造血が妨げられ、貧血・強い倦怠感・脾臓の腫れ・出血傾向などを生じる指定難病の血液疾患です。", "symptoms": "強い倦怠感や脱力感、息切れなど貧血に伴う症状が続いている / 左上腹部の張りや痛み、少し食べただけで満腹になる感じ（脾臓の腫れ）がある / あざができやすい・歯ぐきから出血しやすいなど血小板低下のサインがある / 原因のわからない体重減少や体調不良が長引いている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D336", "name": "大腿神経痛", "category": "神経のお悩み", "keywords": "大腿神経痛, 太ももの痛み, 鼠径部のしびれ, 大腰筋, 骨盤の歪み, 鍼灸, 銀座", "slug": "femoral-neuralgia", "summary": "腰から鼠径部・太もも前側へ伸びる大腿神経が圧迫・刺激され、太ももや下腿内側の痛み・しびれ・感覚低下を引き起こす神経痛です。", "symptoms": "太ももの前側や鼠径部（足の付け根）、すねの内側に痛みやピリピリしたしびれがある / うつ伏せに寝ると太ももや腰の痛み・しびれが強くなる / 長時間の立ち仕事・デスクワーク・歩行や夜間に症状が悪化しやすい / 足を組む癖や反り腰があり、きついベルトやズボンで違和感が出やすい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D337", "name": "温度覚障害", "category": "神経のお悩み", "keywords": "温度覚障害, 知覚異常, 熱い冷たいがわからない, 神経障害, 火傷予防, 鍼灸, 銀座", "slug": "thermal-sensory-disorder", "summary": "脳・脊髄・末梢神経の障害により熱い・冷たいという温度感覚が鈍くなる表在知覚異常で、重度の火傷予防と原因精査が重要です。", "symptoms": "お風呂のお湯や熱い鍋・フライパンに触れても熱さを感じにくい / 気づかないうちに手足に低温火傷や水ぶくれができていたことがある / 手足の一部で冷たさや温かさの左右差を感じる / しびれや脱力感、首・腰の痛みなどを伴って温度感覚が鈍くなってきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D338", "name": "強皮症", "category": "神経のお悩み", "keywords": "強皮症, 全身性硬化症, 指定難病, レイノー現象, 皮膚硬化, 冷え, 鍼灸, 銀座", "slug": "scleroderma", "summary": "線維化・血管障害・自己免疫異常により手指などの皮膚や内臓が硬くなる指定難病で、レイノー現象を初発症状とすることが多い疾患です。", "symptoms": "冷たいものに触れると指先が白・紫・赤に変化する（レイノー現象） / 手指や顔の皮膚が張って硬くなり、指の曲げ伸ばしや口が開けにくい / 食べ物の飲み込みにくさや胸やけ（食道症状）、息切れが気になる / 関節のこわばりや筋力低下、目や口の乾燥感が続いている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D339", "name": "下肢静脈瘤", "category": "神経のお悩み", "keywords": "下肢静脈瘤, 足のむくみ, こむら返り, 静脈うっ滞, ふくらはぎのだるさ, 鍼灸, 銀座", "slug": "varicose-veins", "summary": "脚の静脈弁が壊れて血液が逆流・うっ滞し、ふくらはぎの血管のふくらみ、むくみ、だるさ、こむら返りなどを引き起こす血管疾患です。", "symptoms": "ふくらはぎの血管がコブ状に浮き出たり、くねくねと膨らんでいる / 立ち仕事のあとや午後〜夕方に脚の重だるさ・むくみ・痛みが強くなる / 夜中や明け方にこむら返り（足がつる症状）を繰り返す / すねや足首の皮膚にかゆみ・湿疹・茶色い色素沈着が出てきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D340", "name": "馬尾腫瘍", "category": "神経のお悩み", "keywords": "馬尾腫瘍, 脊髄腫瘍, 神経鞘腫, 排尿障害, 下肢麻痺, 腰痛, 鍼灸, 銀座", "slug": "cauda-equina-tumor", "summary": "腰椎内の馬尾神経に腫瘍が生じ、腰痛・下肢のしびれや麻痺・排尿排便障害を引き起こす疾患で、専門医の精査と外科治療が最優先です。", "symptoms": "腰やお尻の痛みが続き、特に夜間や横になると痛みが強くなる / 太ももから足先にかけて痛みやしびれ、感覚の鈍さがある / 足首や足指が上がりにくい・力が入らないなど下肢の麻痺を感じる / 尿が出にくい・尿漏れ・便失禁・会陰部（股の周囲）のしびれがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D341", "name": "遠位型ミオパチー", "category": "神経のお悩み", "keywords": "遠位型ミオパチー, 縁取り空胞, 三好型ミオパチー, 筋力低下, 手足の脱力, 指定難病, 補完ケア, 鍼灸, 銀座", "slug": "distal-myopathy", "summary": "体幹から遠い手足の筋肉から筋力低下が進む指定難病です。専門医の治療・リハビリを最優先に、安定期の疲労やこりを補完的にケアします。", "symptoms": "足首やふくらはぎに力が入りにくくつまずきやすい / 握力低下でボタン留めや筆記など細かい作業がつらい / 日常動作で筋肉が疲れやすく夕方にだるさが増す / 進行や転倒への不安から心身の緊張が抜けない", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D342", "name": "発作性夜間ヘモグロビン尿症", "category": "神経のお悩み", "keywords": "発作性夜間ヘモグロビン尿症, PNH, 溶血性貧血, ヘモグロビン尿, 倦怠感, 指定難病, 補完ケア, 鍼灸, 銀座", "slug": "paroxysmal-nocturnal-hemoglobinuria", "summary": "血管内で赤血球が壊れやすくなる指定難病（PNH）です。血液内科での治療を最優先に、安定期の倦怠感や自律神経を穏やかに支えます。", "symptoms": "早朝にコーラ色などの濃い尿（ヘモグロビン尿）が出ることがある / 貧血による強い倦怠感や息切れ、頭痛が続きやすい / 感染症をきっかけに体調や溶血発作が悪化しないか不安がある / 治療を続けながら日常の疲労や睡眠の乱れを整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D343", "name": "シャルコー・マリー・トゥース病", "category": "神経のお悩み", "keywords": "シャルコー・マリー・トゥース病, CMT, 末梢神経障害, 筋力低下, 足首の下垂, 指定難病, 補完ケア, 鍼灸, 銀座", "slug": "charcot-marie-tooth-disease", "summary": "遺伝子変異により末梢神経が障害される指定難病（CMT）です。専門医の診療・リハビリを最優先に、安定期の筋疲労や血流を補完的に整えます。", "symptoms": "足首や足裏の筋力低下でつまずきやすく歩行が不安定になる / 手足の先端に感覚の鈍さや冷え、しびれを感じやすい / 筋肉のつっぱりやけいれん、疲れやすさが気になる / リハビリや装具と併用して体のこわばりをケアしたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D344", "name": "慢性炎症性脱髄性多発神経炎病", "category": "神経のお悩み", "keywords": "慢性炎症性脱髄性多発神経炎病, CIDP, 脱髄性神経炎, 手足のしびれ, 筋力低下, 指定難病, 補完ケア, 鍼灸, 銀座", "slug": "cidp", "summary": "自己免疫により末梢神経の髄鞘が傷つく指定難病（CIDP）です。専門医の継続治療を最優先に、安定期の筋緊張や自律神経を補完的に整えます。", "symptoms": "両手や両足に2か月以上続くしびれや感覚異常がある / 立ち上がりや階段の昇降など下肢の筋力低下を感じる / 歩行の不安定さや筋肉のけいれん、疲れやすさがつらい / 再発と寛解を繰り返す中で体調や自律神経を整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D345", "name": "神経因性疼痛", "category": "神経のお悩み", "keywords": "神経因性疼痛, 神経障害性疼痛, アロディニア, 灼熱痛, 電撃痛, 慢性疼痛, ツボ, 内関, 鍼灸, 銀座", "slug": "neuropathic-pain", "summary": "神経の損傷や機能異常で起こる慢性の強い痛みです。医療機関での原因治療と並行し、深層筋・自律神経・ツボケアで痛みの悪循環を和らげます。", "symptoms": "焼けるような痛みや電撃が走るような鋭い痛みが続く / 衣服が触れる・風が当たるなど軽い刺激でも痛む（アロディニア） / 夜間に痛みが強くなり睡眠不足や強い疲労感がある / 続く痛みから不安や気分の落ち込みが強くなっている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D346", "name": "糖尿病神経障害", "category": "神経のお悩み", "keywords": "糖尿病神経障害, 糖尿病性ニューロパチー, 足のしびれ, 感覚低下, フットケア, 血糖コントロール, 鍼灸, 銀座", "slug": "diabetic-neuropathy", "summary": "高血糖による末梢神経・血流障害で足先のしびれや痛みが起こります。血糖管理と足病変予防を最優先に、循環・自律神経を安全に補完ケアします。", "symptoms": "足裏で砂利を踏む・薄皮が張ったような違和感やしびれがある / 手足の先端に刺すような痛みや焼けつく痛み、冷えを感じる / 温度や傷の感覚が鈍くなり小さな傷や乾燥・ひび割れが心配 / 便秘・下痢・発汗異常・立ちくらみなど自律神経症状も出ている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D347", "name": "舌咽神経痛", "category": "神経のお悩み", "keywords": "舌咽神経痛, 喉の奥の激痛, 耳の痛み, 飲み込み時の痛み, 神経圧迫, 自律神経, 補完ケア, 鍼灸, 銀座", "slug": "glossopharyngeal-neuralgia", "summary": "嚥下や会話時に喉の奥・舌根・耳周囲に突発的な激痛が生じる疾患です。脳神経外科等の診療を最優先に、首肩の緊張や自律神経を補完ケアします。", "symptoms": "噛む・飲み込む・話す瞬間に喉の奥や舌の付け根に激痛が走る / 普段はしびれがないのに突然、耳の奥や喉に刺すような痛みが出る / 歯磨きやうがい、冷たい・辛い飲食で痛みが誘発されやすい / 痛みの発作への恐怖から強いストレスや睡眠不足を抱えている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D348", "name": "帯状疱疹後神経痛", "category": "神経のお悩み", "keywords": "帯状疱疹後神経痛, PHN, 焼けるような痛み, アロディニア, 皮膚の過敏, 神経痛, 補完ケア, 鍼灸, 銀座", "slug": "postherpetic-neuralgia", "summary": "帯状疱疹の皮膚症状治癒後も3か月以上続く神経痛（PHN）です。医療機関の治療と併用し、血流・自律神経・生活の工夫で痛みの軽減を支えます。", "symptoms": "発疹が治った後も3か月以上、片側の体幹などに焼ける・刺す痛みが続く / 衣服が擦れる・風が当たるだけで強く痛む（アロディニア） / 皮膚のピリピリ感や強いかゆみ、しびれがなかなか抜けない / 痛みで夜眠れず、疲労感やストレスがたまりやすい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": true}, {"id": "D349", "name": "遺伝性けい性対麻痺", "category": "神経のお悩み", "keywords": "遺伝性けい性対麻痺, 遺伝性痙性対麻痺, HSP, 下肢のつっぱり, 痙縮, 歩行困難, 指定難病, 鍼灸, 銀座", "slug": "hereditary-spastic-paraplegia", "summary": "両足にゆっくりとつっぱり（痙縮）と筋力低下が進む指定難病（HSP）です。専門医の診療・リハビリを最優先に、安定期の筋緊張を穏やかにケアします。", "symptoms": "両足に徐々につっぱり（痙縮）やこわばりが出て歩きにくい / 足が引っかかる、つまずきやすいなど歩行バランスの低下を感じる / 足のけいれんや過剰な反射、ふくらはぎ・腰の疲労が強い / 薬やリハビリと併用して下肢の張りや冷えを和らげたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D350", "name": "複合性局所疼痛症候群", "category": "神経のお悩み", "keywords": "複合性局所疼痛症候群, CRPS, RSD, カウザルギー, 焼ける痛み, アロディニア, リハビリ, 補完ケア, 鍼灸, 銀座", "slug": "crps-nerve", "summary": "けがや手術後に損傷の程度を超える激しい痛みと自律神経症状が続く疾患（CRPS）です。専門医の治療・リハビリと並行し、低刺激で補完ケアします。", "symptoms": "けがや手術・ギプス固定の後に焼ける・うずくような強い痛みが続く / 軽く触れただけや気温変化、ストレスで痛みが激しく悪化する / 患部のむくみ、皮膚の色や温度の変化、発汗異常が見られる / 痛みで手足を動かせず関節のこわばりや強い不安がある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D351", "name": "パージャー病", "category": "神経のお悩み", "keywords": "パージャー病, バージャー病, 閉塞性血栓血管炎, 間欠性跛行, 手足の冷え, 禁煙, 指定難病, 鍼灸, 銀座", "slug": "buerger-disease", "summary": "手足の動脈が炎症・血栓で詰まる指定難病（閉塞性血栓血管炎）です。専門医の診療と完全禁煙を最優先に、安定期の血流と自律神経を支えます。", "symptoms": "手足の指先に強い冷えやしびれ、青白さ（チアノーゼ）が出る / 歩くと足が痛くなり休むとまた歩ける（間欠性跛行）がある / 安静にしていても指先がズキズキとうずくように痛む / 禁煙や生活改善に取り組む中で強いストレスを感じている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D352", "name": "片側顔面痙攣", "category": "神経のお悩み", "keywords": "片側顔面痙攣, 目のピクピク, 顔の引きつり, 顔面神経, 翳風, 下関, 顴髎, 鍼灸, 銀座", "slug": "hemifacial-spasm", "summary": "顔面神経への血管圧迫などで顔の片側が無意識に痙攣する疾患です。専門医の診断を前提に、筋緊張緩和・自律神経調整・ツボケアで支えます。", "symptoms": "自分の意思とは関係なく片側の目の周りが繰り返しピクピク動く / 痙攣が頬や口角、あごなど顔の片側全体に広がってきた / 人前で話す時や緊張した時に顔の引きつりが強くなりつらい / 痙攣の繰り返しで顔の筋肉の疲労感やストレスを感じている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D353", "name": "貧血", "category": "循環器のお悩み", "keywords": "貧血, 鉄欠乏性貧血, 立ちくらみ, めまい, 血海, 三陰交, 手心, 鍼灸, 銀座", "slug": "anemia", "summary": "血液中のヘモグロビンが不足して全身が酸欠状態になる症状です。医療機関での検査と食事改善を基本に、鍼灸で血行と自律神経を整えます。", "symptoms": "強い疲労感や倦怠感が抜けない / 少し動くだけで息切れや動悸がする / 立ちくらみやめまい、顔色の悪さが気になる / 手足の冷えやしびれ、爪の変形・抜け毛がある", "image_file": "cat_circulatory.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D354", "name": "ファンコニ貧血", "category": "循環器のお悩み", "keywords": "ファンコニ貧血, 指定難病, 遺伝性貧血, : "眼のお悩み", "keywords": "上強膜炎, 白目の赤み, 白目の腫れ, 強膜炎 違い, 眼精疲労, 鍼灸, 銀座", "slug": "episcleritis", "summary": "白目の表層（上強膜）に赤みや刺激感が生じる炎症です。眼科での鑑別と治療を優先し、落ち着いた時期に疲労や自律神経を整えます。", "symptoms": "白目の一部が赤く充血し、少し盛り上がって見える / 目にゴロゴロした刺激感や押したときの軽い痛みがある / 涙目や軽い光のまぶしさを感じることがある / 再発を繰り返しやすく、目の疲れやストレスが溜まっている", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D458", "name": "弱視", "category": "眼のお悩み", "keywords": "弱視, 小児弱視, 眼鏡矯正, アイパッチ訓練, 視覚発達, 眼精疲労, 鍼灸, 銀座", "slug": "amblyopia", "summary": "視覚発達期の障害で矯正視力が十分に育たない状態です。特に小児は眼科での早期治療を最優先とし、主治医許可下で疲労ケアを行います。", "symptoms": "お子さまが目を細めて見たり、片目を覆ったりする仕草がある / 3歳児健診や就学時健診で視力の左右差を指摘された / 眼鏡をかけても十分な視力が出ず、眼科で訓練を続けている / 見えにくさを補う負担から眼精疲労や首肩の疲れを感じやすい", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D459", "name": "斜視", "category": "眼のお悩み", "keywords": "斜視, 内斜視, 外斜視, 複視, 両眼視機能, 眼精疲労, 鍼灸, 銀座", "slug": "strabismus", "summary": "片眼が対象を見る際に他眼が違う方向を向く状態です。眼科での眼鏡矯正や手術を最優先とし、安定期の眼精疲労や首肩の負担を支えます。", "symptoms": "左右の黒目の向きがずれて見える（内斜視・外斜視・上下斜視） / 両目で見ると物が二重に見え、片目を閉じると一つに見える / 見る際に首を傾げたり、横目で見たりする癖がある / 立体感のつかみにくさや強い眼精疲労・首肩こりがある", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D460", "name": "上下斜視", "category": "眼のお悩み", "keywords": "上下斜視, 上斜筋麻痺, 下斜筋過動, 複視, 頭位異常, 眼精疲労, 鍼灸, 銀座", "slug": "vertical-strabismus", "summary": "左右どちらかの視線が上下にずれる状態です。眼科治療を基本とし、頭の傾きに伴う首肩こりや眼精疲労を鍼灸でケアします。", "symptoms": "物が上下に二重に見える（複視） / 無意識に首や頭を傾けて見てしまう / 左右の黒目の高さがずれている気がする / 読書や運転で目が極端に疲れやすく肩こりがつらい", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D461", "name": "近視", "category": "眼のお悩み", "keywords": "近視, 視力低下, 眼軸長, 毛様体筋, 調節緊張, 眼精疲労, 鍼灸, 銀座", "slug": "myopia", "summary": "遠くの物がぼやけて見える屈折異常です。眼科での適切な矯正と生活習慣の見直しに加え、鍼灸で眼精疲労や緊張を和らげます。", "symptoms": "遠くの看板や黒板の文字がぼやけて見えにくい / 遠くを見るとき無意識に目を細めてしまう / パソコンやスマホ作業の後に前頭部の頭痛や目の疲れが出る / 夜間のライトがギラついて運転しにくい", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D462", "name": "遠視", "category": "眼のお悩み", "keywords": "遠視, 屈折異常, 眼精疲労, ピント調節, 太陽, 和髎, 鍼灸, 銀座", "slug": "hyperopia", "summary": "網膜の後方で焦点が結ばれる屈折異常です。眼科での矯正を基本とし、太陽や和髎などのツボを活用した鍼灸で眼精疲労をケアします。", "symptoms": "読書やスマホなど近くの文字がぼんやりして見づらい / 常にピントを合わせようとして目が重だるく疲れやすい / 長時間のデスクワーク後に頭痛や肩こり・吐き気が出る / 夕方になると視界がかすみ目の不快感が強まる", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D463", "name": "角膜ヘルペス", "category": "眼のお悩み", "keywords": "角膜ヘルペス, 単純ヘルペスウイルス, 上皮型, 実質型, 瞳子髎, 承泣, 四白, 鍼灸, 銀座", "slug": "herpes-simplex-keratitis", "summary": "単純ヘルペスウイルスによる角膜の感染症です。急性期は眼科治療を最優先とし、安定期の免疫・体調管理を鍼灸でサポートします。", "symptoms": "片目だけに充血やゴロゴロ感、鋭い痛みが出た / 光を強くまぶしく感じ、涙が止まらない / 視界がぼやけたりかすんだりして見えにくい / 疲労やストレスが溜まると同じ目に何度も再発する", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D464", "name": "角膜炎", "category": "眼のお悩み", "keywords": "角膜炎, 感染性角膜炎, アカントアメーバ, コンタクトレンズ, 二間, 液門, 地五会, 鍼灸, 銀座", "slug": "keratitis", "summary": "感染やコンタクト障害等で角膜に炎症が起きる疾患です。急性期は眼科治療を最優先とし、安定期に遠隔のツボ等で体調を整えます。", "symptoms": "目に強い痛みやゴロゴロした異物感がある / 白目が強く充血し、涙や目やにが増えている / 光を見ると痛みが増しまぶしく感じる / コンタクトレンズ装用後から視界がかすむ", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D465", "name": "角膜潰瘍", "category": "眼のお悩み", "keywords": "角膜潰瘍, 角膜穿孔, 細菌性角膜潰瘍, コンタクトレンズ障害, 失明予防, 眼科優先, 鍼灸, 銀座", "slug": "corneal-ulcer", "summary": "角膜上皮から実質まで欠損する重症の眼疾患です。急性期・感染期は眼科治療が最優先で鍼灸禁忌、治癒後の安定期ケアに限ります。", "symptoms": "刺すような激しい目の痛みや強い圧迫感がある / 視界が白く濁り、視力が急に落ちてきた / 強い充血とともに黄色や緑色の目やに・まぶたの腫れがある / 強い光を見ると目が痛く、開けていられない", "image_file": "cat_eye.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D466", "name": "角膜内皮障害", "category": "眼のお悩み", "keywords": "角膜内皮障害, 水疱性角膜症, 角膜浮腫, 角膜内皮細胞, 霧視, 眼科連携, 鍼灸, 銀座", "slug": "corneal-endothelial-dysfunction", "summary": "角膜内皮細胞の減少で角膜がむくみ濁る疾患です。眼科での専門治療を最優先とし、主治医許可下の安定期に全身疲労をケアします。", "symptoms": "朝起きたときに特に視界が白くかすんで見えにくい / 以前より視力が低下し、光がにじんでまぶしく感 gory": "耳鼻咽喉のお悩み", "keywords": "蓄膿症, 慢性副鼻腔炎, 黄色い鼻水, 後鼻漏, 巨髎, 印堂, 天突, 鍼灸, 銀座", "slug": "chronic-sinusitis", "summary": "急性副鼻腔炎が2〜3ヶ月以上長引き副鼻腔に膿が溜まった状態です。耳鼻科治療と並行し、鼻通りと全身の巡りを整えます。", "symptoms": "ドロドロした黄色や黄緑色の鼻水が長く続いている / 鼻水が喉に垂れ込む後鼻漏や口呼吸がつらい / 鼻や口から不快なにおいを感じることがある / 頭重感や集中力低下、疲れやすさで日常に支障がある", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D505", "name": "口腔乾燥症", "category": "耳鼻咽喉のお悩み", "keywords": "口腔乾燥症, ドライマウス, 口の渇き, 唾液分泌, 湧泉, 頬車, 内関, 鍼灸, 銀座", "slug": "xerostomia", "summary": "唾液の分泌が減り口の中が乾燥して粘つきや飲み込みにくさを生じる状態です。ツボ施術と自律神経調整で潤いを支えます。", "symptoms": "口の中が常に乾き、ネバネバ感やヒリつきがある / パンなど水分の少ない食べ物が飲み込みにくい / 口臭が強くなったり味覚が鈍くなった気がする / 夜間や緊張時に口や喉の渇きが悪化する", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D506", "name": "びまん性汎細気管支炎", "category": "耳鼻咽喉のお悩み", "keywords": "びまん性汎細気管支炎, DPB, 慢性咳嗽, 痰, 肺兪, 天突, 大椎, 鍼灸, 銀座", "slug": "diffuse-panbronchiolitis", "summary": "気管の末端である呼吸細気管支に慢性炎症が起こる病気です。呼吸器専門医の標準治療を最優先に、安定期の呼吸を支えます。", "symptoms": "長期間にわたって咳や多量の痰が続いている / 階段の上り下りや動作時に息苦しさを感じる / 慢性的な副鼻腔炎（鼻詰まり・鼻汁）を合併している / 風邪をひくと呼吸器症状が悪化しやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D507", "name": "線毛機能不全症候群", "category": "耳鼻咽喉のお悩み", "keywords": "線毛機能不全症候群, PCD, カルタゲナー症候群, 指定難病, 天突, 肺兪, 完骨, 鍼灸, 銀座", "slug": "primary-ciliary-dyskinesia", "summary": "先天的な遺伝子異常で気道線毛の動きが障害される指定難病です。専門医管理と排痰ケアを最優先に安定期の体調を支えます。", "symptoms": "幼少期から慢性的な鼻汁や湿った咳・粘稠な痰が続く / 気管支炎や肺炎、副鼻腔炎、中耳炎を繰り返しやすい / 息切れや喘鳴、耳の詰まり感で日常に負担がある / 毎日の排痰ケアと体調管理で心身の疲れが溜まりやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D508", "name": "鼻茸", "category": "耳鼻咽喉のお悩み", "keywords": "鼻茸, 鼻ポリープ, 慢性副鼻腔炎, 嗅覚障害, 迎香, 鼻通, 印堂, 鍼灸, 銀座", "slug": "nasal-polyps", "summary": "鼻や副鼻腔の慢性炎症で粘膜がきのこ状に腫れて垂れ下がる状態です。耳鼻科治療を基本に鼻周囲の巡りと不快感をケアします。", "symptoms": "片側または両側の鼻が常に強く詰まっている / 食べ物の香りや周囲のにおいが感じにくくなった / 鼻詰まりに伴って頭痛や頭重感、息苦しさがある / 慢性副鼻腔炎やアレルギー性鼻炎を長く抱えている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D509", "name": "鼻中隔弯曲症", "category": "耳鼻咽喉のお悩み", "keywords": "鼻中隔弯曲症, 鼻詰まり, いびき, 口呼吸, 印堂, 鼻通, 迎香, 鍼灸, 銀座", "slug": "deviated-nasal-septum", "summary": "鼻の左右を分ける鼻中隔が大きく曲がり鼻詰まりや口呼吸を起こす状態です。粘膜の腫れや頭痛などの付随症状を和らげます。", "symptoms": "いつも決まった側の鼻が詰まって息苦しい / 口呼吸になりやすく、いびきや朝の喉の乾燥がつらい / 鼻血が出やすく、前頭部や眉間に痛み・頭重感がある / アレルギー性鼻炎や慢性副鼻腔炎が悪化しやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D510", "name": "気管支拡張症", "category": "耳鼻咽喉のお悩み", "keywords": "気管支拡張症, 慢性咳嗽, 痰, 肺兪, 孔最, 中府, 尺沢, 雲門, 鍼灸, 銀座", "slug": "bronchiectasis", "summary": "気道壁の損傷により気管支が広がり慢性の咳や痰が生じる病気です。専門医管理を最優先に安定期の呼吸と体力を支えます。", "symptoms": "慢性的な咳や多量の痰が毎日続いて体力を消耗する / 呼吸が浅く息苦しさや胸・背中の張りを感じやすい / 風邪や感染症をきっかけに肺炎を起こしやすい / 急な咳き込みで夜間の睡眠や外出に不安がある", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D511", "name": "ロングコビット", "category": "耳鼻咽喉のお悩み", "keywords": "ロングコビット, コロナ後遺症, Long COVID, 倦怠感, 嗅覚障害, ブレインフォグ, 鍼灸, 銀座", "slug": "long-covid", "summary": "新型コロナ感染後に倦怠感・咳・嗅覚障害・ブレインフォグなどが長引く状態です。専門医受診を前提に回復力を支えます。", "symptoms": "強い倦怠感や疲れやすさが2ヶ月以上続いている / 嗅覚障害や味覚障害、長引く咳・息切れが取れない / 頭に霧がかかったようなブレインフォグや集中力低下がある / 眠れない・寝すぎるなど睡眠リズムや自律神経が乱れている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D512", "name": "空気嚥下症", "category": "耳鼻咽喉のお悩み", "keywords": "空気嚥下症, 呑気症, げっぷ, お腹の張り, 噛み締め癖, 天枢, 自律神経, 鍼灸, 銀座", "slug": "aerophagia", "summary": "ストレスや噛み締め癖などで無意識に空気を過剰に飲み込み、げっぷや腹部膨満を起こす状態です。自律神経と胃腸を整えます。", "symptoms": "頻繁にげっぷが出て人前で気になってしまう / 上腹部の膨満感や圧迫感、おならが多くつらい / ストレス時に無意識に歯を噛み締める癖がある / お腹の張りに加えて吐き気や頭痛、睡眠障害がある", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D513", "name": "咽喉頭炎", "category": "耳鼻咽喉のお悩み", "keywords": "咽喉頭炎, 喉の痛み, 咳, 声がれ, 魚際, 少商, 鍼灸, 銀座", "slug": "pharyngolaryngitis", "summary": "咽頭や喉頭の粘膜に炎症が起き、喉の痛みや咳、声がれを生じる病気です。重症化の兆候に注意しつつ回復と予防を支えます。", "symptoms": "喉の痛みやイガイガ感、飲み込む時の痛みがある / 乾いた咳や痰、声がれがなかなか治まらない / 喉の乾燥感や異物感、後鼻漏による不快感が続く / 風邪をひくと喉の炎症が長引き慢性化しやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D514", "name": "気管支炎", "category": "耳鼻咽喉のお悩み", "keywords": "気管支炎, 急性気管支炎, 慢性気管支炎, 長引く咳, 痰, 孔最, 肺兪, 鍼灸, 銀座", "slug": "bronchitis", "summary": "ウイルスや細菌感染、刺激物質などで気管支に炎症が起き咳や痰が続く病気です。安静と医療管理を基本に回復を支えます。", "symptoms": "風邪のような症状の後から咳や痰が長引いている / 咳の繰り返しで胸や背中に圧迫感や痛みがある / 呼吸時にヒューヒューと音がしたり息苦しさを感じる / 倦怠感や体力の低下で回復に時間がかかっている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D515", "name": "非結核性抗酸菌症", "category": "耳鼻咽喉のお悩み", "keywords": "非結核性抗酸菌症, NTM, MAC症, 肺マック症, 咳, 痰, 血痰, 鍼灸, 銀座", "slug": "nontuberculous-mycobacterial-disease", "summary": "結核菌以外の抗酸菌（多くはMAC菌）による感染症で人から人へはうつりません。専門医の長期治療を最優先に体力を支えます。", "symptoms": "長引く咳や緑・黄色の痰、時に血痰がみられる / 微熱や全身のだるさ、夜間の発汗が気になっている / 食欲不振や体力の消耗で体重が減ってきた / 長期間の服薬管理の中で疲労やストレスが溜まりやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D516", "name": "痙攣性発声障害", "category": "耳鼻咽喉のお悩み", "keywords": "痙攣性発声障害, 発声困難, 声の詰まり, 声の震え, 天突, 合谷, 上廉泉, 鍼灸, 銀座", "slug": "spasmodic-dysphonia", "summary": "発声時に自分の意思とは無関係に声帯が痙攣し、声が詰まる・震える病気です。専門治療と併用し喉の過緊張を和らげます。", "symptoms": "話そうとすると声が詰まり絞り出すような声になる / 声が途切れたり震えたりして電話や人前で話しづらい / 声がかすれやすく、少し話すだけで喉がひどく疲れる / 発声時の緊張やストレスで喉の違和感が強くなる", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D517", "name": "急性上気道炎", "category": "耳鼻咽喉のお悩み", "keywords": "急性上気道炎, かぜ症候群, 喉の痛み, 鼻水, 鼻詰まり, 咳, 鍼灸, 銀座", "slug": "acute-upper-respiratory-infection", "summary": "鼻や喉に起こる急性の炎症（かぜ症候群）です。発熱時は受診と安静を優先し、回復期の長引く不調や体力回復を鍼灸でサポートします。", "symptoms": "鼻水や鼻詰まり、くしゃみが続いてつらい / 喉の痛みやイガイガ感、乾いた咳から痰を伴う咳が出る / 声のかすれや出しにくさを感じる / 風邪の後に倦怠感や頭重感がなかなか抜けない", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D518", "name": "百日咳", "category": "耳鼻咽喉のお悩み", "keywords": "百日咳, けいれん性の咳, 咳発作, 長引く咳, 回復期ケア, 鍼灸, 銀座", "slug": "pertussis", "summary": "百日咳菌による感染症で、激しい咳発作が特徴です。感染期は抗菌薬治療と隔離が最優先（鍼灸禁忌）で、回復期の残存症状のみ補完的にケアします。", "symptoms": "風邪のような症状から徐々に咳が強くなってきた / 連続する短い咳の後に息を吸い込む発作的な咳がある / 夜間や刺激をきっかけに咳が悪化しやすい / 抗菌薬治療が終わった後も数週間以上咳や胸背部の疲れが残っている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D519", "name": "肺気腫", "category": "耳鼻咽喉のお悩み", "keywords": "肺気腫, COPD, 息切れ, 慢性的な咳, 痰, 呼吸リハビリ, 鍼灸, 銀座", "slug": "pulmonary-emphysema", "summary": "肺胞の破壊により息切れや咳・痰が生じる疾患です。禁煙と呼吸器内科の標準治療を最優先に、安定期の呼吸補助筋ケアを主治医許可下で行います。", "symptoms": "階段や坂道など体を動かしたときに息苦しさや息切れを感じる / 慢性的な咳や切れにくい痰が続いている / 呼吸時に胸の圧迫感やゼーゼーとした喘鳴がある / 息苦しさから活動量が減り、肩や背中のこわばり・体力低下が気になる", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D520", "name": "漏斗胸", "category": "耳鼻咽喉のお悩み", "keywords": "漏斗胸, 胸のへこみ, 猫背, 姿勢の悩み, 呼吸の浅さ, 鍼灸, 銀座", "slug": "pectus-excavatum", "summary": "胸の中央がへこむ胸郭の変形です。専門医での評価・治療を基本としつつ、猫背や胸背部の筋緊張、呼吸のしづらさを鍼灸でサポートします。", "symptoms": "胸の中央部分がへこんでおり、見た目や姿勢が気になる / 猫背や巻き肩になりやすく、首や背中が慢性的にこる / 運動時や疲れがたまったときに息切れや呼吸の浅さを感じる / 手術後の胸周りのつっぱり感や体のバランスを整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D521", "name": "急性呼吸窮迫症候群", "category": "耳鼻咽喉のお悩み", "keywords": "急性呼吸窮迫症候群, ARDS, 急性呼吸不全, 退院後ケア, 体力回復, 鍼灸, 銀座", "slug": "acute-respiratory-distress-syndrome", "summary": "命に関わる重篤な急性呼吸不全（ARDS）です。発症時はICUでの救急治療が絶対最優先で鍼灸は絶対禁忌とし、退院・回復後のみ主治医許可下でケアします。", "symptoms": "急激な息苦しさや呼吸回数の増加、唇の青白さがある（直ちに救急受診が必要） / ARDSからの回復・退院後も全身の強い疲労感や筋力低下が残っている / 長期臥床後の首・肩・背中のこわばりや呼吸の浅さが気になる / 退院後の自律神経の乱れや睡眠の質の低下を穏やかに整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D522", "name": "先天性中枢性低換気症候群", "category": "耳鼻咽喉のお悩み", "keywords": "先天性中枢性低換気症候群, CCHS, オンディーヌの呪い, 指定難病, 睡眠時低換気, 鍼灸, 銀座", "slug": "congenital-central-hypoventilation-syndrome", "summary": "PHOX2B遺伝子変異等による指定難病で、睡眠時の人工呼吸管理が必須です。呼吸管理の代替にはならず、安定期・主治医許可下での補助ケアのみ対応します。", "symptoms": "睡眠時（重症例では覚醒時も）に呼吸が浅くなる・止まる低換気がみられる / 呼吸困難の自覚がないまま酸素不足やチアノーゼが起こりやすい / 心拍変動や体温調節障害、消化器症状など自律神経の症状を伴う / 専門医の呼吸管理のもと、日常の筋緊張や疲労感を穏やかにケアしたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D523", "name": "肺アスペルギルス症", "category": "耳鼻咽喉のお悩み", "keywords": "肺アスペルギルス症, 真菌感染症, 慢性肺アスペルギルス症, 血痰, 咳, 鍼灸, 銀座", "slug": "pulmonary-aspergillosis", "summary": "カビの一種（アスペルギルス）による肺の真菌感染症です。抗真菌薬などの専門治療が最優先（急性期は鍼灸禁忌）で、安定期の体調管理のみ補完的に行います。", "symptoms": "長引く咳や痰、血痰・喀血がみられる（速やかに呼吸器内科を受診） / 微熱や全身のだるさ、体重減少が続いている / 既往の肺疾患や免疫低下があり、息切れが悪化している / 抗真菌薬治療で病状が安定した後の体力低下や肩背部のこわばりを整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D524", "name": "睡眠時無呼吸症候群", "category": "耳鼻咽喉のお悩み", "keywords": "睡眠時無呼吸症候群, SAS, いびき, 日中の眠気, CPAP, 鼻づまり, 鍼灸, 銀座", "slug": "sleep-apnea-syndrome", "summary": "睡眠中に何度も呼吸が止まる病気です。医療機関でのCPAPやマウスピース治療を基本に、首肩の緊張や鼻づまり・自律神経を鍼灸で整えます。", "symptoms": "家族やパートナーから大きないびきや睡眠中の呼吸停止を指摘される / しっかり寝たはずなのに日中の強い眠気やだるさがある / 起床時の頭痛や口の渇き、熟睡感のなさに悩んでいる / 鼻づまりや首周りの張りがあり、CPAP装着時の不快感も気になる", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D525", "name": "単純性いびき症", "category": "耳鼻咽喉のお悩み", "keywords": "単純性いびき症, いびき, 鼻づまり, 口呼吸, 横向き寝, 鍼灸, 銀座", "slug": "primary-snoring", "summary": "無呼吸や日中の強い眠気を伴わないいびきです。鼻の通りや首周りの巡り、自律神経の緊張を鍼灸と生活習慣の見直しで整えます。", "symptoms": "無呼吸や日中の強い眠気はないが、睡眠中のいびきが気になる / 鼻づまりやアレルギー性鼻炎があり、寝ている間に口呼吸になりやすい / 飲酒後や疲れた日にいびきが大きくなると言われる / 仰向けで寝ると喉が詰まりやすく、朝の喉の乾燥がつらい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D526", "name": "上気道抵抗症候群", "category": "耳鼻咽喉のお悩み", "keywords": "上気道抵抗症候群, UARS, いびき, 日中の眠気, 睡眠障害, 鼻づまり, 鍼灸, 銀座", "slug": "upper-airway-resistance-syndrome", "summary": "明らかな無呼吸はなくても上気道が狭まり睡眠が妨げられる状態です。専門医での評価と並行し、鼻の通りや首肩の緊張・自律神経を鍼灸で整えます。", "symptoms": "無呼吸の基準には当てはまらないのに、日中の眠気や倦怠感が強い / 寝ている間のいびきや鼻づまり、口呼吸が気になっている / 朝起きたときの頭痛や寝た気がしない熟睡感の欠如がある / 睡眠不足から気分の落ち込みや集中力低下を感じている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D527", "name": "上咽頭炎", "category": "耳鼻咽喉のお悩み", "keywords": "上咽頭炎, 慢性上咽頭炎, 後鼻漏, 喉の違和感, Bスポット療法, EAT, 鍼灸, 銀座", "slug": "epipharyngitis", "summary": "鼻の奥と喉の境目（上咽頭）の炎症です。耳鼻科治療と並行し、Bスポット療法後にも残りやすい症状へ深層筋・自律神経・体液循環から多角的にアプローチします。", "symptoms": "鼻と喉の間の痛みや乾燥感、張り付くような違和感が続いている / 鼻水が喉に垂れ込む後鼻漏や痰、頻繁な咳払いがつらい / 風邪の後から1か月以上も喉の違和感や鼻詰まりが取れない / Bスポット療法などを続けても残り数割の症状や頭痛・首こり・倦怠感が抜けない", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D528", "name": "咽喉頭異常感症", "category": "耳鼻咽喉のお悩み", "keywords": "咽喉頭異常感症, ヒステリー球, 梅核気, 喉のつかえ, 喉の違和感, 自律神経, 鍼灸, 銀座", "slug": "globus-pharyngeus", "summary": "検査で異常がないのに喉のつかえや圧迫感を感じる状態です。耳鼻科での除外診断を前提に、自律神経と首喉の深層筋を鍼灸とツボケアで整えます。", "symptoms": "喉に何かが詰まっている・締めつけられる・イガイガする感覚がある / 耳鼻咽喉科で検査を受けても「異常なし」と言われた / 強いストレスや緊張を感じたときに喉の違和感が悪化しやすい / 喉の違和感に加えて首肩こり、頭痛、不安感、息苦しさも気になる", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D529", "name": "咽喉頭逆流症", "category": "耳鼻咽喉のお悩み", "keywords": "咽喉頭逆流症, LPR, 胃酸逆流, 声のかすれ, 咳払い, 喉の違和感, 鍼灸, 銀座", "slug": "laryngopharyngeal-reflux", "summary": "胃酸の逆流が喉まで達し、声のかすれや喉の違和感を起こす疾患です。医療機関での胃酸対策と並行し、自律神経と喉・胸部の緊張を鍼灸で整えます。", "symptoms": "胸やけはあまりないのに、喉のイガイガ感や引っかかり感が続く / 朝起きたときの声のかすれや、頻繁な咳払い・痰の絡みが気になる / 食後や横になったときに喉の違和感や乾いた咳が出やすい / ストレスや食生活の乱れで喉の不調が長引いている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D530", "name": "唾液腺腫瘍", "category": "耳鼻咽喉のお悩み", "keywords": "唾液腺腫瘍, 耳下腺腫瘍, 顎下腺腫瘍, しこり, 術後ケア, 鍼灸, 銀座", "slug": "salivary-gland-tumor", "summary": "耳下腺や顎下腺などにできる腫瘍です。悪性除外と外科的切除が絶対最優先（腫瘍部への刺鍼は禁忌）で、術後回復期の不調のみ主治医許可下でケアします。", "symptoms": "耳の前や下、顎の下にしこりを触れる（速やかに耳鼻咽喉科・頭頸部外科を受診） / しこりが急に大きくなった、硬い、痛みや顔の動きにくさがある / 唾液腺腫瘍の摘出手術後、首肩の強いこりや傷周囲のつっぱり感が気になる / 術後の顔面周囲の違和感や自律神経の疲れを主治医許可のもとケアしたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D531", "name": "α1-アンチトリプシン欠乏症", "category": "耳鼻咽喉のお悩み", "keywords": "α1-アンチトリプシン欠乏症, AAT欠乏症, 指定難病, 若年性肺気腫, 息切れ, 鍼灸, 銀座", "slug": "alpha-1-antitrypsin-deficiency", "summary": "肺を守る酵素が生まれつき不足する指定難病です。禁煙と専門医での補充療法・呼吸管理を最優先とし、安定期の呼吸補助筋ケアのみ主治医許可下で行います。", "symptoms": "比較的若い年齢から労作時の息切れや呼吸のしづらさが出始めた / 慢性的な咳や痰が続き、肺気腫（COPD）と診断された / 喫煙歴が少ないにもかかわらず肺機能の低下を指摘された / 専門医の補充療法・管理のもと、安定期の肩背部の張りや疲労感を和らげたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D532", "name": "間質性肺炎", "category": "耳鼻咽喉のお悩み", "keywords": "間質性肺炎, 乾いた咳, 息切れ, KL-6, 呼吸器ケア, 鍼灸, 銀座", "slug": "interstitial-pneumonia", "summary": "肺の間質に炎症や線維化が起こる疾患の総称です。呼吸器内科の標準治療と急性増悪予防を最優先とし、安定期・主治医許可下でのみ補完ケアを行います。", "symptoms": "階段や歩行など体を動かしたときの息切れが徐々に強くなっている / 痰の少ない乾いた咳（空咳）が長期間続いている / 血液検査でKL-6の上昇や、関節リウマチなど膠原病の合併を指摘された / 呼吸器内科で安定管理中だが、咳による胸背部のこわばりや疲れを和らげたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D533", "name": "薬剤性肺炎", "category": "耳鼻咽喉のお悩み", "keywords": "薬剤性肺炎, 薬剤性肺障害, 乾いた咳, 息切れ, 発熱, 回復期ケア, 鍼灸, 銀座", "slug": "drug-induced-pneumonia", "summary": "薬の副作用で肺に炎症が起こる疾患です。原因薬の中止と呼吸器内科での治療が絶対最優先（急性期は鍼灸禁忌）で、回復期の体調管理のみ補完的に行います。", "symptoms": "新しい薬や漢方薬・サプリメントを始めてから乾いた咳や息切れが出た（速やかに受診） / 服薬中に原因不明の発熱や強いだるさ、呼吸困難が現れた / 原因薬の中止と治療で回復したが、体力低下や胸背部の張りが残っている / 治療終了後、主治医の許可のもと自律神経や全身の疲れを穏やかに整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D534", "name": "過敏性肺炎", "category": "耳鼻咽喉のお悩み", "keywords": "過敏性肺炎, アレルギー性肺炎, 咳, 息切れ, 抗原回避, 鍼灸, 銀座", "slug": "hypersensitivity-pneumonitis", "summary": "カビや羽毛などの抗原を繰り返し吸い込むことで起こるアレルギー性肺炎です。抗原回避と呼吸器内科治療を最優先に、安定期・主治医許可下で補完ケアを行います。", "symptoms": "自宅や職場など特定の環境にいると咳や息切れ、微熱が出やすい / 季節（夏型など）や鳥の羽毛・加湿器・カビとの接触後に体調が悪化する / 慢性的な乾いた咳や息苦しさが続き、線維化を指摘されている / 抗原回避と医療管理で安定しているが、咳による肩背部のこりを和らげたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D535", "name": "肺分画症", "category": "耳鼻咽喉のお悩み", "keywords": "肺分画症, 先天性肺疾患, 繰り返す肺炎, 血痰, 術後ケア, 鍼灸, 銀座", "slug": "pulmonary-sequestration", "summary": "正常な気管支と交通せず大動脈から血流を受ける先天性の肺異常です。肺炎や喀血予防の外科的切除が基本で、術後回復期・主治医許可下でのみ補完ケアを行います。", "symptoms": "健診のレントゲンやCT、胎児エコーなどで肺分画症を指摘された / 同じ部位で肺炎を繰り返したり、血痰・咳が出たりすることがある / 呼吸器外科・小児外科で経過観察中または手術後の体調を整えたい / 術後の胸背部のこわばりや疲れやすさを主治医許可のもとケアしたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D536", "name": "ニューモシスチス肺炎", "category": "耳鼻咽喉のお悩み", "keywords": "ニューモシスチス肺炎, PCP, カリニ肺炎, 日和見感染症, 呼吸困難, 回復期ケア, 鍼灸, 銀座", "slug": "pneumocystis-pneumonia", "summary": "免疫低下時に発症する重篤な真菌性肺炎（PCP）です。専門医療機関での抗微生物薬治療が絶対最優先（急性期は鍼灸禁忌）で、回復後のみ主治医許可下でケアします。", "symptoms": "免疫抑制薬やステロイド使用中・免疫低下状態で乾いた咳や息切れが出た（直ちに受診） / 発熱と進行する呼吸困難がある / ニューモシスチス肺炎の治療・退院後も体力低下や倦怠感が長引いている / 基礎疾患の管理と並行し、回復期の肩背部のこわばりを主治医許可下で整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D537", "name": "ヒトメタニューモウイルス感染症", "category": "耳鼻咽喉のお悩み", "keywords": "ヒトメタニューモウイルス感染症, hMPV, 気管支炎, 肺炎, 咳, 回復期ケア, 鍼灸, 銀座", "slug": "human-metapneumovirus-infection", "summary": "発熱や激しい咳、ゼーゼーとした呼吸を起こすウイルス感染症です。感染期は医療機関受診と安静・隔離が最優先（鍼灸禁忌）で、回復期の不調のみ補完的にケアします。", "symptoms": "発熱や鼻水に続いて強い咳やゼーゼーとした喘鳴が出ている（速やかに受診） / 乳幼児や高齢者、基礎疾患があり呼吸が苦しそうに見える / 熱が下がり感染期が過ぎた後も、長引く咳や倦怠感がなかなか抜けない / 咳き込みで凝り固まった胸・肩・背中の疲れを回復期にケアしたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D538", "name": "嚢胞性肺疾患", "category": "耳鼻咽喉のお悩み", "keywords": "嚢胞性肺疾患, 肺嚢胞, 息苦しさ, 胸痛, 気胸予防, 呼吸ケア, 鍼灸, 銀座", "slug": "cystic-lung-disease", "summary": "肺に袋状の構造が生じる嚢胞性肺疾患。呼吸器専門医の管理を最優先に、安定期・主治医許可下で呼吸を支える補完的鍼灸を行います。", "symptoms": "動いたときに息苦しさや息切れを感じやすい / 胸の痛みや圧迫感が気になることがある / 咳や痰が続いて呼吸が浅くなりやすい / 気胸などの合併症が不安で首や背中がこわばりやすい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D539", "name": "閉塞性細気管支炎", "category": "耳鼻咽喉のお悩み", "keywords": "閉塞性細気管支炎, 指定難病, 咳, 息切れ, 呼吸困難, 細気管支, 鍼灸, 銀座", "slug": "bronchiolitis-obliterans", "summary": "細気管支の炎症・狭窄で息苦しさが続く指定難病。呼吸器専門医の治療を最優先に、安定期・主治医許可下で穏やかに体調を整えます。", "symptoms": "乾いた咳や痰の絡 s": "伝音難聴, 聞こえにくい, 耳のつまり感, 補聴器, 聴宮, 耳門, 鍼灸, 銀座", "slug": "conductive-hearing-loss", "summary": "外耳や中耳の異常で音が伝わりにくくなる難聴です。耳鼻科での診断と適切な治療を最優先に、耳周囲の血流改善や自律神経ケアで回復期を支えます。", "symptoms": "耳が詰まったような感覚やこもり感が続いている / 相手の話し声や周囲の音が小さく聞き取りにくい / 中耳のトラブルに伴ってふらつきや平衡感覚の違和感がある / 補聴器や耳鼻科治療とあわせて耳周りの不調も整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D559", "name": "混合性難聴", "category": "耳鼻咽喉のお悩み", "keywords": "混合性難聴, 伝音難聴, 感音性難聴, 音がぼやける, 聴力変動, 補聴器, 鍼灸, 銀座", "slug": "mixed-hearing-loss", "summary": "伝音難聴と感音性難聴の両方を併せ持つ状態です。耳鼻咽喉科での精密検査と治療を最優先に、耳周囲の血流と自律神経バランスを整えます。", "symptoms": "小さい音が聞こえにくく、言葉や音がぼやけて感じる / 日によって聴力や聞こえやすさが変動することがある / 補聴器を使っていても徐々に聞き取りにくさを感じている / 中耳の違和感に加えて耳鳴りや疲労感が重なっている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D560", "name": "若年発症型両側性感音難聴", "category": "耳鼻咽喉のお悩み", "keywords": "若年発症型両側性感音難聴, 指定難病, 感音難聴, 補聴器, 聴宮, 耳門, 頭竅陰, 鍼灸, 銀座", "slug": "juvenile-onset-bilateral-sensorineural-hearing-loss", "summary": "40歳未満で発症し両耳の難聴が徐々に進行する指定難病です。耳鼻科の定期管理を最優先に、耳鳴りやめまい感・首肩の緊張を補完的にケアします。", "symptoms": "40歳未満から両耳の聞こえにくさが少しずつ進んでいる / 音楽や鳥の声など高い周波数の音が聞き取りにくい / 難聴に伴って耳鳴りやめまいを感じることがある / 補聴器や人工内耳の調整を続けながら体調も整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D561", "name": "低音障害型感音性難聴", "category": "耳鼻咽喉のお悩み", "keywords": "低音障害型感音性難聴, 低い音が聞こえにくい, 耳閉感, 内リンパ浮腫, ストレス, メニエール, 鍼灸, 銀座", "slug": "low-tone-sensorineural-hearing-loss", "summary": "内リンパの浮腫により低音域が聞こえにくくなる難聴です。発症早期の耳鼻科治療を最優先に、早期併用や回復期・再発予防を鍼灸で支えます。", "symptoms": "男性の声など低い音が聞き取りにくく耳が詰まった感じがする / ゴーッという低音の耳鳴りや音の響き・歪みが気になる / ストレスや寝不足が続くと何度も症状を繰り返してしまう / 将来めまいを伴うメニエール病へ移行しないか不安がある", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D562", "name": "突発性難聴", "category": "耳鼻咽喉のお悩み", "keywords": "突発性難聴, 急に聞こえない, 耳鳴り, めまい, 聴宮, 完骨, 耳門, 鍼灸, 銀座", "slug": "sudden-sensorineural-hearing-loss", "summary": "ある日突然片耳などが聞こえにくくなる感音難聴です。発症早期の耳鼻科ステロイド治療を最優先に、早期併用や回復期の耳鳴り・めまいをケアします。", "symptoms": "ある日突然、片耳の聞こえが悪くなったり塞がった感じがする / ボーッ・キーン・ジジジといった耳鳴りが続いている / 難聴と同時に回転性のめまいや吐き気を伴っている / 耳鼻科でステロイド治療中または治療後で回復を後押ししたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": true}, {"id": "D563", "name": "耳硬化症", "category": "耳鼻咽喉のお悩み", "keywords": "耳硬化症, アブミ骨, 伝音難聴, 耳鳴り, 手術, 補聴器, 鍼灸, 銀座", "slug": "otosclerosis", "summary": "中耳のアブミ骨が硬くなり音の振動が伝わりにくくなる病気です。耳鼻科での精査・手術適応の判断を最優先に、術前後の体調や耳鳴りを支えます。", "symptoms": "思春期以降から20〜40代にかけて徐々に聞こえにくくなってきた / 鼓膜に異常がないと言われたが伝音難聴や耳鳴りが続いている / 妊娠や出産をきっかけに聴力低下が進んだと感じる / 手術や補聴器を検討しながら耳周りの不快感や緊張も和らげたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D564", "name": "特発性肺線維症", "category": "耳鼻咽喉のお悩み", "keywords": "特発性肺線維症, IPF, 指定難病, 間質性肺炎, 乾いた咳, 息切れ, 鍼灸, 銀座", "slug": "idiopathic-pulmonary-fibrosis", "summary": "肺胞壁が徐々に硬くなり息切れや乾いた咳が生じる指定難病です。呼吸器専門医の治療を最優先に、安定期の呼吸のしやすさと体力を補完的に支えます。", "symptoms": "痰の出ない乾いた咳が慢性的に続いている / 坂道や階段、日常動作で息切れや息苦しさを感じる / 慢性的な疲労感や体力の低下、胸・背中の張りがある / 呼吸器内科で治療中だが、安定期の体調管理や睡眠の質を整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D565", "name": "耳下腺炎", "category": "耳鼻咽喉のお悩み", "keywords": "耳下腺炎, おたふく風邪, 流行性耳下腺炎, 顔の腫れ, 天容, リンパ, 鍼灸, 銀座", "slug": "parotitis", "summary": "耳の下の唾液腺に炎症が起き腫れや痛みが出る病気です。感染・発熱のある急性期は医療機関受診が最優先（鍼灸禁忌）で、回復期の体調管理を支援します。", "symptoms": "耳の下から顎にかけて腫れや押したときの痛みがある / 食事や飲み込みの際に耳の下の痛みが強くなる / 発熱やだるさ、口の乾燥を伴っている / 感染が治まったあとも首や顔周りの張り・むくみが残っている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D566", "name": "耳下腺腫瘍", "category": "耳鼻咽喉のお悩み", "keywords": "耳下腺腫瘍, 耳の下のしこり, 多形腺腫, ワルチン腫瘍, 天容, 天牖, 欠盆, 鍼灸, 銀座", "slug": "parotid-gland-tumor", "summary": "耳下腺にしこりができる腫瘍です。良性・悪性の鑑別と手術判断のため耳鼻科精査が最優先であり、術後回復期や主治医許可下での体調管理を支えます。", "symptoms": "耳の前や耳の下あたりに痛みのないしこりがある / しこりが硬く動きにくい、または急に大きくなってきた / 顔の動きにくさや感覚のしびれ、鈍い痛みが出てきた / 手術後の首肩の張りや自律神経の乱れを主治医許可のもとで整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D567", "name": "耳管開放症", "category": "耳鼻咽喉のお悩み", "keywords": "耳管開放症, 自分の声が響く, 自声強聴, 耳閉感, 三間, 翳風, 完骨, 鍼灸, 銀座", "slug": "patulous-eustachian-tube", "summary": "耳管が開いたままになり自分の声や呼吸音が響く症状です。耳鼻科診療と併用し、三間のお灸や翳風・完骨への鍼灸で全身バランスと血流を整えます。", "symptoms": "自分の声や呼吸音が耳の中で大きく響いて会話がつらい / 耳が塞がったような耳閉感や圧迫感が続いている / 横になったり頭を深く下げたりすると一時的に症状が軽くなる / 急な体重減少や疲労・ストレス後から症状が気になり始めた", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D568", "name": "先天性耳瘻孔", "category": "耳鼻咽喉のお悩み", "keywords": "先天性耳瘻孔, 耳の穴, 耳の付け根, 腫れ, 膿, 細菌感染, 鍼灸, 銀座", "slug": "preauricular-sinus", "summary": "生まれつき耳の付け根付近に小さな穴がある状態です。感染による腫れや膿がある場合は耳鼻科・皮膚科受診が最優先で、患部への刺激は避けます。", "symptoms": "耳の前や付け根付近に小さな穴やくぼみがある / 穴の周りに汗や垢が溜まり、臭いや透明な分泌物が気になる / 穴の周囲が赤く腫れて痛みやかゆみ、膿が出てきた / 感染を繰り返しており、手術や今後のケアについて知りたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D569", "name": "真珠腫性中耳炎", "category": "耳鼻咽喉のお悩み", "keywords": "真珠腫性中耳炎, 耳漏, 伝音難聴, 鼓室形成術, めまい, 耳鼻科手術, 鍼灸, 銀座", "slug": "cholesteatoma", "summary": "鼓膜の皮膚が中耳に入り込み周囲の骨を壊しながら進む中耳炎です。耳鼻咽喉科での精査と手術が最優先で、術後回復期の体調管理を支援します。", "symptoms": "臭いを伴う耳だれ（耳漏）や耳の詰まり感が続いている / 徐々に聞こえにくくなり、耳鳴りや圧迫感がある / めまいやふらつき、顔の動かしにくさを感じる / 鼓室形成術などの手術後に首肩の張りや体調を整えたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D570", "name": "異臭症", "category": "耳鼻咽喉のお悩み", "keywords": "異臭症, 嗅覚障害, 錯嗅, 幻嗅, コロナ後遺症, 迎香, 鼻通, 印堂, 鍼灸, 銀座", "slug": "parosmia-phantosmia", "summary": "実際の匂いが別物に感じられたり存在しない匂いを感じる嗅覚の質的障害です。耳鼻科での精査を前提に、鼻周囲と脳の過緊張の双方へアプローチします。", "symptoms": "食べ物や日常の匂いが焦げた臭い・腐敗臭・革の臭いなどに変わる / 周囲に匂いの元がないのにタバコや薬品のような臭いを感じる / 風邪やコロナ感染、副鼻腔炎のあとから匂いの異常が続いている / 病院の点鼻薬や内服だけでは変化がなく日常生活がつらい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D571", "name": "後鼻漏", "category": "耳鼻咽喉のお悩み", "keywords": "後鼻漏, 鼻水が喉に落ちる, 痰が絡む, 副鼻腔炎, 上咽頭炎, 鼻通, 上星, 鼻凉, 鍼灸, 銀座", "slug": "postnasal-drip", "summary": "過剰な鼻水や粘り気のある分泌物が喉へ流れ落ちる不快な症状です。耳鼻科での原因治療と併用し、炎症の軽減と鼻奥の神経過敏を鍼灸で整えます。", "symptoms": "鼻水が喉の奥に垂れ込み、常に引っかかり感や不快感がある / 喉に絡む痰や鼻水を出そうとして咳込みが続いている / 副鼻腔炎の治療後も鼻の奥の違和感だけがずっと残っている / 不快感で食事や夜の睡眠に支障が出ている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D572", "name": "唾石症", "category": "耳鼻咽喉のお悩み", "keywords": "唾石症, 顎の下が腫れる, 食事時の痛み, 顎下腺, 頬車, 外玉液, 湧泉, 鍼灸, 銀座", "slug": "sialolithiasis", "summary": "唾液腺や導管に石ができ食事時に顎の下が腫れて痛む病気です。耳鼻科・口腔外科での精査を最優先に、経過観察期の唾液循環と再発予防を支えます。", "symptoms": "食事をしようとした時や食べている時に顎の下が腫れて強く痛む / 食後しばらくすると顎の下の腫れや痛みが引いていく / 小さな唾石で経過観察中だが、再発や詰まりを防ぎたい / 口の渇きや顎周りの張り感が気になっている", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D573", "name": "顎関節症", "category": "耳鼻咽喉のお悩み", "keywords": "顎関節症, 顎の痛み, 口が開かない, カクカク音, 食いしばり, 咬筋, 外側翼突筋, 鍼灸, 銀座", "slug": "temporomandibular-joint-disorder-ent", "summary": "顎関節や噛む筋肉の痛み、開口障害、関節音が生じる症状です。歯科・口腔外科での評価と併用し、咬筋・外側翼突筋の深層筋鍼灸で負担を軽減します。", "symptoms": "口を開け閉めすると顎関節が痛む、またはカクカクと音が鳴る / 口を大きく開けにくく、硬い物や大きな物が食べづらい / 顎のこわばりに加えて耳の奥の痛みや詰まり感、頭痛がある / 寝ている間の歯ぎしり・食いしばりや猫背・デスクワークが多い", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D574", "name": "反回神経麻痺", "category": "耳鼻咽喉のお悩み", "keywords": "反回神経麻痺, 声がかすれる, 嗄声, むせる, 誤嚥, 声帯麻痺, 鍼灸, 銀座", "slug": "recurrent-laryngeal-nerve-palsy", "summary": "声帯を動かす反回神経が麻痺し声枯れやむせが生じる状態です。原因疾患の特定と耳鼻科精査を最優先に、回復期や安定期の体調管理を補完的に支えます。", "symptoms": "声がかすれて弱くなり、高い声や大きな声が出しにくい / 食べ物や飲み物を飲み込む際にむせたり咳き込んだりする / 甲状腺・食道・胸部などの手術後から声枯れが続いている / 息切れや喉の違和感があり、日常生活での負担を和らげたい", "image_file": "cat_ent.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D575", "name": "扁桃炎", "category": "耳鼻咽喉のお悩み", "keywords": "扁桃炎, 扁桃腺の腫れ, 喉の痛み, 発熱, 天鼎, 欠盆, 鍼灸, 銀座", "slug": "tonsillitis", "summary": "喉の口蓋扁桃に細菌やウイルスが感染して腫れや高熱が出る病気です。急性感染期は医療機関受診が最優先（鍼灸禁忌）で、回復期・再発予防を支えます。", "symptoms": "喉の奥が赤く腫れ、強い喉の痛みや飲み込みにくさがある / 急な高熱・寒気・だるさがあり、扁桃に白い膿が見える / 季節の変わり目や疲労・ストレスが溜まると何度も扁桃炎を繰り返す / こじらせて扁桃周囲膿瘍にならないよう予防と体質改善をし ds": "アルポート症候群, 遺伝性腎炎, 指定難病, 血尿, 難聴, 腎臓病, 鍼灸, 銀座", "slug": "alport-syndrome", "summary": "IV型コラーゲン異常により腎炎・難聴・眼症状を伴う遺伝性の指定難病です。専門医管理を最優先に安定期の体調を支えます。", "symptoms": "健診で持続的な顕微鏡的血尿や蛋白尿を指摘されている / 風邪などの後にコーラ色や赤色の肉眼的血尿が出ることがある / 10歳以降から高い音が聞き取りにくい感音難聴が出てきた / 腎機能低下への不安や通院生活による疲労・肩こりが続いている", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D622", "name": "ホモシスチン尿症", "category": "泌尿器のお悩み", "keywords": "ホモシスチン尿症, 先天性代謝異常, 指定難病, 食事療法, 血栓予防, 鍼灸, 銀座", "slug": "homocystinuria", "summary": "アミノ酸代謝酵素の欠損によりホモシスチンが蓄積する指定難病です。専門医の食事・薬物管理を最優先に安定期の体調を支えます。", "symptoms": "先天性代謝異常として低メチオニン食などの管理を続けている / 手足が長い・側弯などの骨格的特徴に伴う腰背部の張りがある / 水晶体脱臼や強度近視などの眼症状による眼精疲労がつらい / 血栓症予防の通院や長期の食事管理で心身の疲れが溜まっている", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D623", "name": "ネイルパテラ症候群", "category": "泌尿器のお悩み", "keywords": "ネイルパテラ症候群, 爪膝蓋骨症候群, 指定難病, 腎症, 膝痛, 鍼灸, 銀座", "slug": "nail-patella-syndrome", "summary": "爪や膝蓋骨・肘の形成異常と腎症・緑内障を伴う指定難病です。専門医管理を最優先に、関節周囲の負担と体調を優しく支えます。", "symptoms": "生まれつき爪の低形成や膝のお皿が小さい・ない特徴がある / 膝の不安定感や痛み、肘が伸びにくいことによる周囲のこりがある / 定期検査で蛋白尿や血尿などの腎症の経過観察を続けている / 緑内障や高眼圧症の定期チェックと日々の疲労に悩んでいる", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D624", "name": "尿素サイクル異常症", "category": "泌尿器のお悩み", "keywords": "尿素サイクル異常症, 高アンモニア血症, 先天性代謝異常, 指定難病, 食事療法, 鍼灸, 銀座", "slug": "urea-cycle-disorders", "summary": "アンモニアを尿素へ変換する酵素が生まれつき不足する指定難病です。専門医の食事・薬物管理を最優先に安定期の体調を支えます。", "symptoms": "先天性代謝異常として厳格な蛋白制限と服薬管理を続けている / 吐き気や頭痛・倦怠感など高アンモニア血症の兆候に常に注意している / 体調変化や感染症による急性増悪への不安・ストレスが大きい / 安定期における慢性的な疲労感や肩こり・睡眠の乱れを整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D625", "name": "メープルシロップ尿症", "category": "泌尿器のお悩み", "keywords": "メープルシロップ尿症, 先天性代謝異常, 指定難病, 分岐鎖アミノ酸, 食事療法, 鍼灸, 銀座", "slug": "maple-syrup-urine-disease", "summary": "分岐鎖アミノ酸の代謝障害により尿に甘い臭いが生じる指定難病です。厳格な食事療法と専門医管理を最優先に安定期を支えます。", "symptoms": "新生児マススクリーニング等で診断され食事療法を継続している / 発熱や嘔吐・下痢に伴う急性代謝発作の予防に細心の注意を払っている / 厳格な分岐鎖アミノ酸制限と定期採血の管理で心身の疲れがある / 安定期における筋緊張やこわばり・睡眠の乱れを穏やかに整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D626", "name": "フェニルケトン尿症", "category": "泌尿器のお悩み", "keywords": "フェニルケトン尿症, PKU, 先天性代謝異常, 指定難病, 食事療法, 鍼灸, 銀座", "slug": "phenylketonuria", "summary": "フェニルアラニン代謝酵素の不足による指定難病です。生涯の低フェニルアラニン食と専門医管理を最優先に安定期の心身を支えます。", "symptoms": "生まれつき低フェニルアラニン食と定期的な血中濃度管理を続けている / 長期の食事制限や妊娠前後の厳格なコントロールに精神的負担がある / 不安感や気分の落ち込み・睡眠の浅さなど自律神経の乱れを感じる / 湿疹や皮膚の敏感さ・日々の疲労感を穏やかに整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D627", "name": "抗利尿ホルモン不適合分泌症候群", "category": "泌尿器のお悩み", "keywords": "抗利尿ホルモン不適合分泌症候群, SIADH, 低ナトリウム血症, 倦怠感, けいれん, 鍼灸, 銀座", "slug": "siadh", "summary": "抗利尿ホルモンの過剰分泌により低ナトリウム血症を起こす疾患です。専門医での緊急・原因治療を最優先に安定後の体調を支えます。", "symptoms": "血液検査で低ナトリウム血症やSIADHと診断され通院している / 強い倦怠感・吐き気・頭痛・筋肉のけいれんや脱力感がある / むくみは目立たないのに体重増加や尿量減少がみられる / 原因疾患の治療と水分制限を続けており回復期の体力を整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D628", "name": "尖圭コンジローマ", "category": "泌尿器のお悩み", "keywords": "尖圭コンジローマ, HPV, 性感染症, イボ, 泌尿器科, 皮膚科, 鍼灸, 銀座", "slug": "condyloma-acuminatum", "summary": "HPV感染により性器や肛門周囲にイボが生じる性感染症です。皮膚科・泌尿器科の標準治療を最優先に、全身の体調管理を支えます。", "symptoms": "陰部や肛門周囲に先の尖ったイボやカリフラワー状の隆起がある / 初期は痛みが少ないが、大きくなりかゆみ・違和感・出血が出てきた / 皮膚科や泌尿器科で治療中だが再発への不安やストレスが大きい / 免疫力の低下を防ぎ、治療と並行して全身のコンディションを整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D629", "name": "ＩｇＡ腎症", "category": "泌尿器のお悩み", "keywords": "ＩｇＡ腎症, IgA腎症, 慢性糸球体腎炎, 指定難病, 血尿, 蛋白尿, 鍼灸, 銀座", "slug": "iga-nephropathy", "summary": "腎臓の糸球体に異常なIgAが沈着して炎症が続く指定難病です。腎臓専門医の管理を最優先に、安定期の体調維持を優しく支えます。", "symptoms": "学校や職場の尿検査で血尿や蛋白尿を指摘された / 風邪や扁桃炎の後に血尿が目立つことがある / 足のむくみや血圧の上昇、慢性的な倦怠感が気になっている / 減塩や薬物療法を続けながら、冷えや疲労・ストレスを整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D630", "name": "無精子症", "category": "泌尿器のお悩み", "keywords": "無精子症, 男性不妊, 閉塞性無精子症, 非閉塞性無精子症, 妊活, 鍼灸, 銀座", "slug": "azoospermia", "summary": "精液中に精子が認められない男性不妊の原因の一つです。専門医での鑑別・生殖医療を基本に、心身のコンディショニングを支えます。", "symptoms": "精液検査で精子が確認されず、無精子症と診断された / 閉塞性か非閉塞性かの検査やホルモン療法・TESE等を検討している / 自覚症状がないまま診断を受け、強い不安やストレスを抱えている / 不妊治療と並行して体力や血流・睡眠の質を整えておきたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D631", "name": "乏精子症", "category": "泌尿器のお悩み", "keywords": "乏精子症, 男性不妊, 精子濃度低下, 精索静脈瘤, 妊活, 鍼灸, 銀座", "slug": "oligozoospermia", "summary": "精液中の精子濃度が基準値（1,500万/mL）を下回る状態です。専門医での原因精査と並行し、血流と生活リズムを整えます。", "symptoms": "精液検査で精子濃度が1,500万/mL以下と指摘された / 自覚症状はないがなかなか自然妊娠に至らず悩んでいる / 精索静脈瘤やホルモンバランス、酸化ストレスの影響が気になっている / 仕事によるストレス・睡眠不足・疲労感が慢性的に続いている", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D632", "name": "精子無力症", "category": "泌尿器のお悩み", "keywords": "精子無力症, 精子運動率低下, 男性不妊, 妊活, 精索静脈瘤, 骨盤血流, 自律神経, 鍼灸, 銀座", "slug": "asthenozoospermia", "summary": "精子の運動率が低下した状態です。泌尿器科での原因精査と標準治療を最優先に、安定期の血流・自律神経ケアとして鍼灸を併用します。", "symptoms": "精液検査で精子の運動率が低いと指摘されました / 妊活を続けていますがなかなか結果につながりません / 慢性的な疲労や睡眠不足、強いストレスを感じています / 下腹部の冷えや腰・骨盤まわりのこわばりが気になります", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D633", "name": "類宦官症", "category": "泌尿器のお悩み", "keywords": "類宦官症, 性腺機能低下症, テストステロン低下, 二次性徴, 男性ホルモン, ホルモン補充療法, 自律神経, 鍼灸, 銀座", "slug": "eunuchoidism", "summary": "男性ホルモンの分泌低下により二次性徴や体調に変化が生じる状態です。専門医での原因精査とホルモン療法を最優先に、体調面を補完します。", "symptoms": "声変わりやヒゲ・体毛の発達など二次性徴が十分にみられません / 筋力の低下や強い疲労感、気分の落ち込みが続いています / 性欲の低下や勃起の不調、将来の不妊について不安があります / 骨密度の低下や女性化乳房などの体格変化が気になります", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D634", "name": "精索静脈瘤", "category": "泌尿器のお悩み", "keywords": "精索静脈瘤, 陰のうの痛み, 陰のうの重だるさ, 男性不妊, 乏精子症, 精子無力症, 泌尿器科, 鍼灸, 銀座", "slug": "varicocele", "summary": "精索の静脈が逆流・拡張して瘤状になる状態です。泌尿器科での精査と手術適応の評価を最優先に、経過観察期や術後の体調面を支援します。", "symptoms": "長時間の立ち仕事や力みのあとに陰のうや鼠径部が重だるく痛みます / 左側の陰のうに袋状や虫の巣のような血管の膨らみを感じます / 横になって休むと陰のうの違和感や鈍痛が軽くなります / 精液検査の数値低下や男性不妊の原因として指摘されました", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D635", "name": "陰のう水腫", "category": "泌尿器のお悩み", "keywords": "陰のう水腫, 陰嚢水腫, 陰のうの腫れ, 陰のうの重だるさ, 泌尿器科, 鼠径ヘルニア, 鍼灸, 銀座", "slug": "hydrocele", "summary": "陰のう内部に液体がたまり柔らかく腫れる状態です。泌尿器科での原因鑑別と手術適応評価を最優先に、安定期の体調管理を補完します。", "symptoms": "片側または両側の陰のうが柔らかく腫れて左右差が気になります / 強い痛みはないものの、陰のうの重だるさや不快感があります / 夕方になると腫れが大きくなり、横になると少し軽く感じます / 入浴時に陰のうの膨らみに気づき、他の病気ではないか不安です", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D636", "name": "精巣上体炎", "category": "泌尿器のお悩み", "keywords": "精巣上体炎, 副睾丸炎, 陰のうの痛み, 陰のうの腫れ, 発熱, 精巣捻転, 泌尿器科, 鍼灸, 銀座", "slug": "epididymitis", "summary": "精巣上体に細菌感染が起こり強い痛みや腫れ・発熱を生じる疾患です。精巣捻転との緊急鑑別と抗菌薬治療が必須で、急性期の鍼灸は禁忌です。", "symptoms": "片側の陰のうが急に強く痛み、赤く腫れて熱を持っています / 陰のうの痛みや腫れに加えて発熱や鼠径部の痛みがあります / 排尿時の不快感や痛み、尿の濁りや血尿がみられます / 抗菌薬治療後の体力低下や再発予防の体調管理が気になります", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D637", "name": "精巣形成不全", "category": "泌尿器のお悩み", "keywords": "精巣形成不全, 性分化疾患, 停留精巣, 男性不妊, テストステロン低下, 腰眼, 関元, 横骨, 鍼灸, 銀座", "slug": "testicular-dysgenesis", "summary": "精巣の発生・分化過程の障害による機能異常です。泌尿器科での精査・腫瘍化評価やホルモン療法を最優先に、安定期の体調面を補完します。", "symptoms": "思春期の遅れや体毛の少なさなど二次性徴の変化が気になります / 精巣の大きさの左右差や小ささ、停留精巣の既往があります / 性欲の減退や勃起の不調、女性化乳房などに悩んでいます / 不妊症の検査で乏精子症や無精子症と指摘されました", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D638", "name": "切れ痔", "category": "泌尿器のお悩み", "keywords": "切れ痔, 裂肛, 排便痛, 鮮血, 便秘, 天枢, 大巨, 便秘点, 鍼灸, 銀座", "slug": "anal-fissure", "summary": "硬い便やいきみで肛門の皮膚が裂ける状態です。肛門外科での標準治療を基本に、便秘改善と天枢・大巨・便秘点のツボケアで再発を防ぎます。", "symptoms": "排便時に肛門が切れるような鋭い痛みがあり、食後や排便後も続きます / 排便後にトイレットペーパーに少量の鮮やかな血が付きます / 頑固な便秘や硬い便、あるいは頻繁な下痢を繰り返して mmary": "器質的心疾患がない胸痛や動悸・息苦しさに対し、循環器科での除外診断を前提に呼吸と自律神経バランスを整えます。", "symptoms": "心電図等で異常がないのに安静時の胸の痛みや重苦しさが続く / 突然の動悸や脈の乱れを感じて強い不安に襲われる / 安静にしているのに息切れや息苦しさ、ため息が増えている / 過呼吸やしびれ、不眠、疲労感がつらい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D719", "name": "パニック障害", "category": "脳神経のお悩み", "keywords": "パニック障害, パニック発作, 予期不安, 腎気, 脳過敏, 脳腸相関, 自律神経, 鍼灸, 銀座", "slug": "panic-disorder-neuro", "summary": "突然のパニック発作と予期不安に対し、専門医での標準治療を優先しつつ「腎気」や脳過敏・首肩の緊張から体の過剰性を整えます。", "symptoms": "電車やエレベーターなど閉鎖空間で突然強い不安や動悸・発汗が起きる / また発作が起きるのではという予期不安や広場恐怖・抑うつがある / 内科検査では異常がないのに不眠・冷えのぼせ・呼吸の浅さが続く / 頚肩・背中の強い筋緊張があり、再発しない身体づくりを目指したい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D720", "name": "限局性恐怖症", "category": "脳神経のお悩み", "keywords": "限局性恐怖症, 恐怖症, 不安障害, 上星, 光明, 百会, 鍼灸, 銀座", "slug": "specific-phobia-neuro", "summary": "特定の対象・状況への強い恐怖と身体の過緊張に対し、専門医の心理療法を優先しつつ上星・光明・百会等で自律神経を整えます。", "symptoms": "高所・閉所・動物・注射・病院など特定の対象に激しい恐怖を感じる / 対象を思い浮かべるだけで動悸や冷や汗、脳貧血のような感覚が出る / 過剰に怖がっていると自覚していても気持ちを制御できない / 恐怖の対象を避けることで日常生活や通院・仕事に支障が出ている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D721", "name": "広場恐怖症", "category": "脳神経のお悩み", "keywords": "広場恐怖症, 外出困難, パニック障害, 上星, 光明, 労宮, 鍼灸, 銀座", "slug": "agoraphobia-neuro", "summary": "すぐ逃げられない状況への恐怖と外出不安に対し、専門医治療を優先しつつ上星・光明・労宮のツボで過緊張を和らげます。", "symptoms": "電車・バス・渋滞・長いトンネルなどすぐ降りられない場所が怖い / 美容院や歯科、映画館、人ごみ・行列を避けるようになっている / 過去にパニック発作を経験し、人前で倒れる・迷惑をかける不安が強い / 不安な場所を避け続けるうちに外出が難しくなっている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D722", "name": "多系統萎縮症", "category": "脳神経のお悩み", "keywords": "多系統萎縮症, MSA, 指定難病, 運動失調, 自律神経障害, 鍼灸, 銀座", "slug": "multiple-system-atrophy", "summary": "指定難病である多系統萎縮症に対し、脳神経内科の標準治療を最優先としたうえで、安定期の循環・筋緊張・QOL維持を支援します。", "symptoms": "歩行時のふらつきや転倒しやすさ、呂律の回りにくさがある / 動作が遅く筋肉がこわばる（パーキンソン様症状）が出てきた / 立ちくらみ・起立性低血圧、頻尿や排尿困難、便秘が続いている / 睡眠時の異常行動や呼吸の乱れ、発汗異常が気になっている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D723", "name": "オリーブ橋小脳萎縮症", "category": "脳神経のお悩み", "keywords": "オリーブ橋小脳萎縮症, OPCA, 多系統萎縮症, 指定難病, ふらつき, 鍼灸, 銀座", "slug": "olivopontocerebellar-atrophy", "summary": "多系統萎縮症の一病型である指定難病に対し、脳神経内科治療とリハビリを最優先しつつ安定期の動作維持と循環を支援します。", "symptoms": "初期から起立・歩行時のふらつきやバランスの取りにくさがある / 呂律が回りにくい、箸やボタン・書字など細かい動作が難しい / 進行に伴い立ちくらみ・排尿障害・便秘・発汗異常が出てきた / 筋肉のこわばりや動作の遅さ、飲み込みにくさ（嚥下障害）が不安", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D724", "name": "線条体黒質変性症", "category": "脳神経のお悩み", "keywords": "線条体黒質変性症, SND, 多系統萎縮症, 指定難病, 筋強剛, 鍼灸, 銀座", "slug": "striatonigral-degeneration", "summary": "パーキンソン様症状が前面に出る指定難病に対し、脳神経内科管理を最優先とし安定期の筋強剛緩和と自律神経調整を支援します。", "symptoms": "表情が乏しくなり、動作の開始や動きがゆっくりになってきた / 筋肉のこわばり（筋強剛）が強く、立ち上がりや歩行が不安定 / 抗パーキンソン病薬を飲んでいるが十分な効果が出にくい / 排尿障害・立ちくらみ・便秘に加え、ふらつきも出てきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D725", "name": "脊髄小脳変性症", "category": "脳神経のお悩み", "keywords": "脊髄小脳変性症, SCD, 指定難病, 頭皮鍼, 運動失調, 鍼灸, 銀座", "slug": "spinocerebellar-degeneration", "summary": "指定難病である脊髄小脳変性症に対し、脳神経内科治療を最優先しつつ安定期の頭皮鍼や筋緊張緩和でQOL維持を支援します。", "symptoms": "歩くときにふらつき、足幅を広げないと安定しない / 酔ったような話し方になり、呂律が回りにくくなっている / 手の震えや不器用さから書字や物をつかむ動作が難しい / 排尿・排便の障害、立ちくらみ、いびきや睡眠時無呼吸がある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D726", "name": "シャイドレーガー症候群", "category": "脳神経のお悩み", "keywords": "シャイドレーガー症候群, 多系統萎縮症, 起立性低血圧, 指定難病, 自律神経, 鍼灸, 銀座", "slug": "shy-drager-syndrome", "summary": "強い自律神経障害が前面に出る指定難病に対し、脳神経内科管理を最優先とし安全な体位で穏やかな自律神経・循環ケアを行います。", "symptoms": "立ち上がると強い立ちくらみや失神（起立性低血圧）が起きる / 尿失禁や排尿困難、便秘、発汗低下などの自律神経症状が強い / 睡眠時無呼吸や大きないびき、性機能障害を伴っている / 経過とともに歩行のふらつきや筋肉のこわばりも現れてきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D727", "name": "フリードライヒ運動失調症", "category": "脳神経のお悩み", "keywords": "フリードライヒ運動失調症, 脊髄小脳変性症, 指定難病, 運動失調, 側弯, 鍼灸, 銀座", "slug": "friedreichs-ataxia", "summary": "遺伝性の脊髄小脳変性症に対し、脳神経内科・循環器内科管理を最優先とし主治医許可下で筋疲労緩和と循環ケアを支援します。", "symptoms": "若年期から歩行の不安定さや、つま先の屈曲・足の内反がある / 関節の位置や振動の感覚が鈍く、下肢を中心に筋力が低下している / 脊柱側弯症や足の変形、関節の硬さ、構音・視力・聴力の変化がある / 心筋症や不整脈、糖尿病などの合併症を指摘されている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D728", "name": "エイリアンハンド症候群", "category": "脳神経のお悩み", "keywords": "エイリアンハンド症候群, 他人の手症候群, 不随意運動, 脳卒中後遺症, 脳神経内科, リハビリ, 鍼灸, 銀座", "slug": "alien-hand-syndrome", "summary": "自分の意思に反して手足が勝手に動く神経障害。専門医での原因精査とリハビリを最優先に、安定期の心身ケアを支えます。", "symptoms": "自分の意思とは無関係に手が物を掴んだり放したりする / 片手の動作をもう一方の手が勝手に妨害してしまう / 手が他人のものや異物のように感じられる / 動作の制御困難による強い不安やストレスがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D729", "name": "ペリー症候群", "category": "脳神経のお悩み", "keywords": "ペリー症候群, 指定難病, 遺伝性パーキンソン病, 体重減少, 呼吸異常, 脳神経内科, 鍼灸, 銀座", "slug": "perry-syndrome", "summary": "40歳代に多く発症する遺伝性の神経難病。専門医による呼吸・栄養・薬物管理を最優先に、安定期の心身ケアを行います。", "symptoms": "うつ症状や意欲低下・無気力が続いている / 動作が遅くなり小刻み歩行や筋のこわばりが出てきた / 1年で10kgほど急激に体重が減少している / 日中の頻呼吸や夜間の無呼吸など呼吸の異変がある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D730", "name": "レビー小体型認知症", "category": "脳神経のお悩み", "keywords": "レビー小体型認知症, 幻視, パーキンソン症状, レム睡眠行動異常症, 自律神経症状, 認知症, 鍼灸, 銀座", "slug": "lewy-body-dementia", "summary": "幻視や認知機能の変動、動作のこわばりを伴う認知症。専門医の診断・薬物調整を最優先に、安定期の心身ケアを支えます。", "symptoms": "実際にはない人や虫が見える幻視や幻聴がある / 物忘れや意識の清明さが日や時間帯で大きく変動する / 手足の震えや動作緩慢・転倒しやすさが出てきた / 睡眠中に大声で寝言を言う、便秘や立ちくらみがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D731", "name": "アルツハイマー型認知症", "category": "脳神経のお悩み", "keywords": "アルツハイマー型認知症, 物忘れ, 認知症予防, 睡眠不足, ツボ, 神庭, 鍼灸, 銀座", "slug": "alzheimers-dementia", "summary": "脳内たんぱく質蓄積による最も多い認知症。専門医の早期診断・薬物治療を最優先に、睡眠養生やツボ刺激で生活を支えます。", "symptoms": "最近の出来事や約束を忘れることが急激に増えた / 日付や季節・今いる場所が分からなくなることがある / 料理や買い物の段取りがうまく組めなくなってきた / 不眠や気分の落ち込み・不安やイライラが強くなった", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D732", "name": "若年性アルツハイマー", "category": "脳神経のお悩み", "keywords": "若年性アルツハイマー, 若年性認知症, 物忘れ, 働き盛り, もの忘れ外来, ストレス, 鍼灸, 銀座", "slug": "young-onset-alzheimers", "summary": "65歳未満の働き盛り世代に発症する認知症。専門医での早期鑑別と標準治療を最優先に、安定期の睡眠やストレスケアを行います。", "symptoms": "仕事上のミスや段取りの悪さが急に増えた / 物忘れや時間・場所の感覚の衰えを感じる / 短気になったり趣味への関心が薄れたりしている / 嗅覚の低下や片付けの困難さが出てきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D733", "name": "前頭側頭型認知症", "category": "脳神経のお悩み", "keywords": "前頭側頭型認知症, 指定難病, 行動異常, 失語, 嚥下障害, 脳神経内科, 鍼灸, 銀座", "slug": "frontotemporal-dementia", "summary": "前頭葉・側頭葉の萎縮で行動や言語に変化が生じる認知症。専門医の診断と環境・嚥下管理を最優先に、安定期の心身を支えます。", "symptoms": "周囲への無関心や共感の低下・衝動的な行動が目立つ / 同じ行動や特定の食品への強いこだわりを繰り返す / 言葉が出にくい・言葉の意味が分かりにくくなった / 筋力低下や震え・飲み込みにくさが出てきた", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D734", "name": "血管性認知症", "category": "脳神経のお悩み", "keywords": "血管性認知症, 脳卒中, まだら認知症, 感情失禁, 再発予防, リハビリ, 鍼灸, 銀座", "slug": "vascular-dementia", "summary": "脳卒中による血流障害で段階的に進行する認知症。再発予防の医療管理とリハビリを最優先に、安定期の巡りと心身を整えます。", "symptoms": "できることとできないことの差が大きいまだらな認知低下がある / 脳梗塞や脳出血の後に物忘れや判断力低下が進んだ / 手足の麻痺・歩行障害・ろれつや飲み込みにくさがある / 些細なことで急に泣く・怒るなど感情の制御が難しい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D735", "name": "アルコール性認知症", "category": "脳神経のお悩み", "keywords": "アルコール性認知症, 多量飲酒, ビタミンB1欠乏, 記憶障害, 作話, 禁酒, 鍼灸, 銀座", "slug": "alcoholic-dementia", "summary": "多量飲酒による脳萎縮や栄養障害で起こる認知症。専門医での禁酒・栄養治療を最優先に、安定期の睡眠やストレスケアを支えます。", "symptoms": "多量飲酒が続いており急激に激しい物忘れが増えた / 今がいつでどこにいるのか時間や場所が分からなくなる / 記憶の空白を埋めるように事実と異なる話をしてしまう / お酒をやめられず睡眠の乱れや強いストレスを抱えている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D736", "name": "パーキンソン病", "category": s": true, "has_youtube": false, "has_rich": false}, {"id": "D750", "name": "神経細胞移動異常症", "category": "脳神経のお悩み", "keywords": "神経細胞移動異常症, 指定難病, 滑脳症, てんかん, 筋緊張, 鍼灸, 銀座", "slug": "neuronal-migration-disorder", "summary": "胎児期の神経細胞移動の障害による指定難病です。専門医管理を最優先に、安定期の筋緊張・自律神経・消化ケアを支援します。", "symptoms": "乳幼児期からのてんかん発作や発達遅滞を管理している / 手足の痙縮や筋緊張異常があり動きづらい / 睡眠の乱れや情緒の不安定さ・感覚過敏がある / 便秘などの消化器トラブルやご家族の疲労が続く", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D751", "name": "脳表ヘモジデリン沈着症", "category": "脳神経のお悩み", "keywords": "脳表ヘモジデリン沈着症, 指定難病, 感音性難聴, 小脳失調, ふらつき, 鍼灸, 銀座", "slug": "superficial-siderosis", "summary": "持続的な微出血で脳表にヘモジデリンが沈着する指定難病です。専門医管理を最優先に、安定期の疲労や緊張の緩和を支えます。", "symptoms": "徐々に進む聞こえにくさ（感音性難聴）がある / 歩行のふらつきや小脳失調による不安定さがある / 手足のこわばり・脱力や頭痛・嗅覚低下がある / 転倒や誤嚥を防ぎながら日々の体調を保ちたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D752", "name": "神経線維腫症II型", "category": "脳神経のお悩み", "keywords": "神経線維腫症II型, NF2, 指定難病, 両側聴神経鞘腫, 脊髄神経鞘腫, 鍼灸, 銀座", "slug": "neurofibromatosis-type-2", "summary": "両側の聴神経鞘腫や脊髄腫瘍などを多発する指定難病です。脳神経外科の定期管理を最優先に、安定期の体調維持を支えます。", "symptoms": "両側または片側の難聴・耳鳴り・めまいがある / 手足のしびれや感覚低下・脱力感を感じる / 頭痛や顔のしびれ・視力低下が気になっている / 定期検査や手術の合間に首肩の緊張や不安を整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D753", "name": "ハンチントン病", "category": "脳神経のお悩み", "keywords": "ハンチントン病, 指定難病, 舞踏運動, 不随意運動, 脳神経内科, 鍼灸, 銀座", "slug": "huntington-disease", "summary": "不随意運動（舞踏運動）や精神・認知症状が緩やかに進む指定難病です。脳神経内科の管理を最優先に、安定期の緊張緩和を支えます。", "symptoms": "手足や顔が意図せず動く（舞踏運動）ことがある / 細かい作業がしづらく歩行時のふらつき・転倒が心配 / 食事中のむせ込みや飲み込みにくさが出てきた / イライラ・気分の落ち込みや睡眠の乱れを整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D754", "name": "ビッカースタッフ脳幹脳炎", "category": "脳神経のお悩み", "keywords": "ビッカースタッフ脳幹脳炎, 脳幹脳炎, 複視, 運動失調, 免疫療法, 鍼灸, 銀座", "slug": "bickerstaff-brainstem-encephalitis", "summary": "感染後の自己免疫異常により脳幹に炎症が起きる疾患です。急性期の入院・免疫療法を最優先に、回復期の体調・後遺症ケアを支えます。", "symptoms": "風邪や下痢のあとに物が二重に見える（複視）ようになった / 急にふらついて歩けない・意識がぼんやりする / 入院での免疫療法を終え回復期の歩行や疲労を整えたい / 残存するふらつきや首肩の緊張を穏やかに和らげたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D755", "name": "クロイツフェルト・ヤコブ病", "category": "脳神経のお悩み", "keywords": "クロイツフェルト・ヤコブ病, CJD, プリオン病, 指定難病, 緩和ケア, 鍼灸, 銀座", "slug": "creutzfeldt-jakob-disease", "summary": "異常プリオン蛋白により急速な認知症や運動障害が進む指定難病です。厳格な感染対策と専門医管理を絶対最優先とします。", "symptoms": "短期間で記憶障害や人格・行動の変化が急速に進んでいる / ふらつき・視覚異常や音に驚いた際の手足のぴくつきがある / 診断を受けて専門医のもとで緩和ケア・生活の質維持を行っている / ご家族の介護負担や専門機関との連携方法に悩んでいる", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D756", "name": "プリオン病", "category": "脳神経のお悩み", "keywords": "プリオン病, 指定難病, 異常プリオン蛋白, 遺伝性プリオン病, 緩和ケア, 鍼灸, 銀座", "slug": "prion-disease", "summary": "異常型プリオン蛋白の脳内沈着により生じる指定難病の総称です。厳格な感染対策と専門医・多職種管理を絶対最優先とします。", "symptoms": "急速な認知機能低下やふらつき・ミオクローヌスがみられる / 進行性の小脳失調や強い不眠・幻覚などの神経症状がある / 遺伝性プリオン病の診断や遺伝カウンセリングを検討している / ご本人のQOL維持とご家族の心身の負担軽減を図りたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D757", "name": "ゲルストマン・ストロイスラー・シャインカー病", "category": "脳神経のお悩み", "keywords": "ゲルストマン・ストロイスラー・シャインカー病, GSS, プリオン病, 指定難病, 小脳失調, 鍼灸, 銀座", "slug": "gerstmann-straussler-scheinker-disease", "summary": "進行性の小脳失調を主症状とする遺伝性プリオン病（指定難病）です。厳格な感染対策と専門医管理を絶対最優先とします。", "symptoms": "40〜60歳代（30歳代もあり）からふらつき・めまい・小脳失調が始まった / 言葉のもつれやしびれ、歩行障害・筋力低下が緩やかに進んでいる / 視覚・聴覚障害や認知症の進行に備え専門医と連携している / 補助具や食事形態の工夫、ご家族の長期ケアの負担を和らげたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D758", "name": "前庭神経炎", "category": "脳神経のお悩み", "keywords": "前庭神経炎, 回転性めまい, 吐き気, ふらつき, 聴宮, 内関, 翳風, 鍼灸, 銀座", "slug": "vestibular-neuritis-neuro", "summary": "突然の激しい回転性めまいが数日続く前庭神経の障害です。専門医の鑑別・急性期治療後、回復期のふらつきや自律神経を整えます。", "symptoms": "耳鳴りや難聴はないのに激しい回転性めまいが続く / 頭を動かすと吐き気や嘔吐・ふらつきが強まる / 強いめまい発作のあとも数か月ふらつきや頭重感が残る / ストレスや疲労が重なるとバランス感覚が不安定になる", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D759", "name": "急性散在性脳脊髄炎", "category": "脳神経のお悩み", "keywords": "急性散在性脳脊髄炎, ADEM, 脱髄疾患, ステロイドパルス, 脳神経内科, 鍼灸, 銀座", "slug": "acute-disseminated-encephalomyelitis", "summary": "感染後等に脳や脊髄へ急性の自己免疫性脱髄炎症が生じる疾患です。急性期の入院・免疫療法を最優先に、回復期を支えます。", "symptoms": "感染症や予防接種の数日〜4週間後に発熱・頭痛・嘔吐が出た / 意識障害・けいれん・視覚障害や手足の麻痺が急に現れた / 入院でのステロイド治療後、回復期のリハビリと体調管理を続けたい / 再発リスクに注意しながら疲労や筋緊張を整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D760", "name": "過眠症", "category": "脳神経のお悩み", "keywords": "過眠症, ナルコレプシー, 特発性過眠症, 日中の眠気, 神門, 申脈, 照海, 鍼灸, 銀座", "slug": "hypersomnia", "summary": "夜間の睡眠量にかかわらず日中の強い眠気が続く睡眠障害です。専門医の鑑別を優先しつつ、ツボ刺激と養生で自律神経を整えます。", "symptoms": "夜しっかり寝ても日中に耐え難い眠気や居眠りが1か月以上続く / 笑う・驚くなどの感情変化で急に力が抜ける（情動脱力発作） / 1時間以上昼寝をしてもすっきりせずだるさが残る / 寝つき時の金縛りや入眠時幻覚、生活リズムの乱れがある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D761", "name": "REM睡眠行動障害", "category": "脳神経のお悩み", "keywords": "REM睡眠行動障害, レム睡眠行動障害, 寝言, 夢の行動化, 失眠, 安眠, 労宮, 鍼灸, 銀座", "slug": "rem-sleep-behavior-disorder", "summary": "レム睡眠中に筋緊張の抑制が外れ、夢の内容を行動に移してしまう睡眠障害です。専門医の鑑別を優先し、睡眠の質と自律神経を整えます。", "symptoms": "睡眠中に大声で叫ぶ・はっきりした寝言を言う / 夢に合わせて手足を振り回し、家族に当たったり物を壊したりする / 50〜60歳代以降から悪夢や夜間の激しい体動が増えた / 睡眠不足やストレス・飲酒の影響で夜間の眠りが浅い", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D762", "name": "睡眠時遊行症", "category": "脳神経のお悩み", "keywords": "睡眠時遊行症, 夢遊病, ノンレム睡眠, 失眠, 内関, 労宮, 鍼灸, 銀座", "slug": "sleepwalking", "summary": "深いノンレム睡眠中に起き上がって歩き回り記憶が残らない睡眠障害です。安全確保と専門医相談を軸に、自律神経と睡眠を整えます。", "symptoms": "寝付いて数時間後に無意識に起き上がって歩き回る / 呼びかけへの反応がぎこちなく、翌朝まったく覚えていない / 日中の眠気や疲労感・睡眠不足が続いている / ストレスや不規則な生活・飲酒のあとに症状が出やすい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D763", "name": "不思議の国のアリス症候群", "category": "脳神経のお悩み", "keywords": "  そわそわ, 鍼灸, 銀座", "slug": "akathisia", "summary": "薬の副作用によりじっと座っていられない強い落ち着かなさが生じる症状。処方医での調整を最優先に、安定期の心身ケアを支えます。", "symptoms": "じっと座っていられず足踏みや貧乏ゆすりを繰り返す / 脚や身体の内側がむずむず・灼熱感のように落ち着かない / 歩き回ると一時的に楽になるが休めない / そわそわ感や不眠で日常生活がつらい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D782", "name": "アレキサンダー病", "category": "脳神経のお悩み", "keywords": "アレキサンダー病, 指定難病, GFAP遺伝子, 痙縮, 嚥下障害, 鍼灸, 銀座", "slug": "alexander-disease", "summary": "GFAP遺伝子変異により神経を支える細胞が障害される指定難病。脳神経内科の管理を最優先に、安定期の筋緊張や生活の質を支えます。", "symptoms": "歩行のふらつきや足のつっぱり（痙縮）が進行している / 飲み込みにくさ（嚥下障害）や話しにくさがある / 繰り返す嘔吐や睡眠障害、強い疲労感が続く / 発達遅れやけいれん、認知機能の低下が心配", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D783", "name": "ラスムッセン脳炎", "category": "脳神経のお悩み", "keywords": "ラスムッセン脳炎, ラスムッセン症候群, 難治性てんかん, 片麻痺, 脳神経内科, 鍼灸, 銀座", "slug": "rasmussen-encephalitis", "summary": "片側の大脳半球に慢性炎症と萎縮が起こり難治性てんかん等を伴う希少疾患。専門医の免疫療法を最優先に、安定期の体調管理を支えます。", "symptoms": "薬が効きにくい部分てんかん発作が繰り返し起きる / 片側の手足に麻痺（片麻痺）や動かしにくさが進行している / 発達や知的機能、言語・視野の変化が見られる / 睡眠不足や疲労、感染症の後に体調が悪化しやすい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D784", "name": "もやもや病", "category": "脳神経のお悩み", "keywords": "もやもや病, 脳血管, 一過性麻痺, 過換気, 脳神経外科, 鍼灸, 銀座", "slug": "moyamoya-disease", "summary": "脳の主要血管が細くなり脆弱な側副血行路が生じる疾患。脳神経外科での管理を最優先に、安定期の穏やかな自律神経・養生ケアを支えます。", "symptoms": "一時的な手足の麻痺やしびれ、ろれつが回りにくくなることがある / 熱い麺を吹く・吹奏楽器・激しい運動などの過換気で症状が出やすい / 頭痛や口周囲のしびれ、めまい、物忘れが気になる / 定期的なMRI検査や脳神経外科での経過観察を続けている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D785", "name": "オルトレキシア", "category": "脳神経のお悩み", "keywords": "オルトレキシア, 健康食強迫, 摂食障害, 食事制限, 心療内科, 鍼灸, 銀座", "slug": "orthorexia-nervosa", "summary": "「健康的な食事」への強迫的なこだわりで心身や社会生活に支障が出る状態。専門医・栄養指導を最優先に、安定期の自律神経ケアを支えます。", "symptoms": "添加物や糖質・脂質などを極端に排除し食べられる食品が減っている / 成分表示の確認や食事計画に長時間とらわれて疲弊している / ルールを破ると強い罪悪感や過度の運動・嘔吐につながってしまう / 外食や人との食事を避けて孤立し、体重減少や疲労感が出ている", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D786", "name": "異食症", "category": "脳神経のお悩み", "keywords": "異食症, 非食品摂取, 氷食症, 鉄欠乏, 心療内科, 鍼灸, 銀座", "slug": "pica-eating-disorder", "summary": "栄養価のない非食品を1か月以上繰り返し食べてしまう症状。内科・精神科での原因精査と治療を最優先に、安定期の自律神経ケアを支えます。", "symptoms": "氷・紙・土・髪の毛・チョークなど食品以外のものを食べてしまう / 妊娠中の貧血や鉄・亜鉛不足を指摘されている / 強いストレスや不安、感覚過敏・衝動性に伴って症状が出る / 便秘や腹痛など消化器の不調や中毒・腸閉塞のリスクが心配", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D787", "name": "反芻症", "category": "脳神経のお悩み", "keywords": "反芻症, 食べ物の逆流, 摂食障害, 消化器内科, 心療内科, 鍼灸, 銀座", "slug": "rumination-disorder", "summary": "食後に吐き気や胃腸疾患なく食べ物が逆流し再咀嚼等を繰り返す症状。専門医での診断・治療を最優先に、安定期の自律神経ケアを支えます。", "symptoms": "食後に吐き気やえづきがないまま食べ物が口に戻ってくる / 逆流した食べ物を噛み直して飲み込む、または吐き出す行為が1か月以上続く / 人前での食事を避けたり症状を隠したりして孤立感がある / 腹痛や食道炎、口臭・歯のエナメル質損傷、体重減少が気になる", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D788", "name": "抗NMDA受容体脳炎", "category": "脳神経のお悩み", "keywords": "抗NMDA受容体脳炎, 自己免疫性脳炎, 卵巣腫瘍, 脳神経内科, 回復期ケア, 鍼灸, 銀座", "slug": "anti-nmda-receptor-encephalitis", "summary": "脳のNMDA受容体に対する自己抗体で発症する自己免疫性脳炎。急性期の入院治療が必須であり、回復期以降の体調管理を支えます。", "symptoms": "発熱や頭痛など風邪様症状の後に幻覚・妄想・興奮などが急に出た / けいれん発作や不随意運動、意識障害、言語障害を伴う / 血圧・心拍・体温の激しい変動や呼吸抑制など自律神経症状がある / 退院後の回復期・安定期に冷えや自律神経の乱れを整えたい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D789", "name": "遺伝性周期性四肢麻痺", "category": "脳神経のお悩み", "keywords": "遺伝性周期性四肢麻痺, 指定難病, カリウム, 四肢麻痺, 脳神経内科, 鍼灸, 銀座", "slug": "hereditary-periodic-paralysis", "summary": "筋肉のイオンチャネル遺伝子変異により発作的に四肢麻痺が起こる指定難病。脳神経内科管理を最優先に、安定期の誘因回避と筋ケアを支えます。", "symptoms": "下肢を中心に脱力や麻痺発作が繰り返し起こる / 高カリウム性では運動後の安静・寒冷・カリウム食品で誘発されやすい / 低カリウム性では早朝や夜間、激しい運動・多量の炭水化物・飲酒後に起こりやすい / 発作のない時期にも筋肉のこわばりや疲労感、不安がある", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": true, "has_rich": false}, {"id": "D790", "name": "進行性
