.jpg", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1190", "name": "麻酔後シバリング（術後の震え・悪寒予防補助）", "category": "自律神経のお悩み", "keywords": "麻酔後シバリング, 術後シバリング, 術後の震え, 全身麻酔後, 脊髄くも膜下麻酔, TEAS, 周術期ケア, 鍼灸", "slug": "post-anesthetic-shivering", "summary": "手術・麻酔後のつらい震え（麻酔後シバリング）に対し、経穴刺激（TEAS）による発生率低下が報告されている周術期サポート知見。", "symptoms": "・以前の手術で麻酔から覚めたあとの激しい震え（シバリング）と寒気がつらかった\n・今後の手術に向けて、周術期の体温調節や自律神経の乱れを整えておきたい\n・術後の吐き気・冷え・回復の遅れに不安がある\n・手術前後の体調管理として、科学的根拠のある鍼灸ケアを知りたい", "image_file": "jiritsushinkei_acupoints.jpg", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1191", "name": "慢性腎臓病（CKD）の腎機能指標・症状補助ケア", "category": "泌尿器のお悩み", "keywords": "慢性腎臓病, CKD, クレアチニン, 腎機能保護, かゆみ, 倦怠感, むくみ, 保存期腎不全, 鍼灸", "slug": "chronic-kidney-disease-support", "summary": "慢性腎臓病（CKD）の腎臓内科管理を最優先としつつ、かゆみ・倦怠感・自律神経の乱れを穏やかに支える補助的な鍼灸ケア。", "symptoms": "・慢性腎臓病（CKD）で通院中だが、皮膚のかゆみやだるさがつらい\n・血圧管理や食事療法を続けているが、冷えやむくみ・眠りの浅さが気になる\n・腎臓に負担をかける薬を増やしたくないため、安全な非薬物ケアを知りたい\n・主治医の治療を妨げない範囲で、日々の体調とQOLを整えたい", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1192", "name": "糖尿病性足病変（初期・末梢循環と神経症状の補助ケア）", "category": "内分泌のお悩み", "keywords": "糖尿病性足病変, 糖尿病足, 末梢循環障害, 足のしびれ, 足の冷え, 糖尿病神経障害, 創傷予防, 鍼灸", "slug": "diabetic-foot-support", "summary": "糖尿病内科・血管外科の厳格な血糖・フットケア管理を前提に、初期の末梢循環低下や神経障害痛を安全に支える補助鍼灸ケア。", "symptoms": "・糖尿病があり、足先の冷え・しびれ・ジンジンする痛みが気になっている\n・主治医のもとで血糖コントロールとフットケアを続けているが、足の血行も整えたい\n・傷や潰瘍ができないよう、早めの段階から安全に末梢循環をケアしたい\n・糖尿病に配慮した衛生管理と禁忌判断ができる鍼灸院に相談したい", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1193", "name": "重症疾患・ICU入室後の回復補助（せん妄・疼痛・栄養耐性サポート）", "category": "自律神経のお悩み", "keywords": "ICU後遺症, 重症疾患後症候群, PICS, 人工呼吸器離脱後, せん妄予防, 退院後回復, 自律神経, 鍼灸", "slug": "icu-critical-illness-recovery", "summary": "重症疾患やICU入室後の体力低下・不眠・疼痛・自律神経の乱れに対し、主治医の経過観察と併用して回復を支える補助鍼灸。", "symptoms": "・大病やICU入院・人工呼吸器管理を経て退院したが、強い疲労感や筋力低下が続く\n・入院後から眠りが浅く、不安感や気分の落ち込み・認知面の疲れが抜けない\n・胃腸の働きが落ち、食事が十分に進まず体力が戻りにくい\n・退院後の外来フォロー・リハビリと併用できる優しい回復ケアを探している", "image_file": "cat_autonomic.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1194", "name": "脳卒中後構音障害（発声・言語リハビリ併用）", "category": "脳神経のお悩み", "keywords": "脳卒中後構音障害, 構音障害, ろれつが回らない, 発声障害, 脳梗塞後遺症, 言語リハビリ, 言語聴覚士, 鍼灸", "slug": "post-stroke-dysarthria", "summary": "脳卒中後のろれつの回りにくさや発声のしづらさ（構音障害）に対し、言語リハビリと併用して口腔・咽頭筋の協調回復を支える補助鍼灸。", "symptoms": "・脳卒中後、言葉が不明瞭になり家族や周囲に聞き返されることが多い\n・舌や唇・のどが動かしにくく、長く話すと声がかすれたり疲れたりする\n・言語聴覚士（ST）のリハビリを続けているが、さらに発声回復を後押ししたい\n・飲み込みづらさ（嚥下障害）や首肩の強いこわばりもあわせて気になる", "image_file": "cat_neuro_acupoints.jpg", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1195", "name": "脳卒中後便秘（脳梗塞・脳出血後の排便障害）", "category": "脳神経のお悩み", "keywords": "脳卒中後便秘, 脳梗塞便秘, 脳出血後遺症, 排便障害, 腸管運動低下, 下剤軽減, 自律神経, 鍼灸", "slug": "post-stroke-constipation", "summary": "脳卒中後に生じる頑固な便秘に対し、主治医の排便管理と併用して腸管運動と自律神経を整え、自然な排便リズムを支える鍼灸。", "symptoms": "・脳卒中後、活動量低下や自律神経の乱れから頑固な便秘が続いている\n・下剤に頼る量が増えてしまい、お腹の張りや不快感がつらい\n・排便時の強いいきみによる血圧上昇が心配で、スムーズに排便したい\n・リハビリや食事管理に加えて、安全に併用できる排便サポートを探している", "image_file": "cat_neuro_acupoints.jpg", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1196", "name": "産後尿失禁（出産後の尿漏れ・骨盤底筋訓練併用）", "category": "女性のお悩み", "keywords": "産後尿失禁, 産後尿漏れ, 腹圧性尿失禁, 骨盤底筋, 産後ケア, 授乳中, 骨盤底筋訓練, 鍼灸", "slug": "postpartum-urinary-incontinence", "summary": "出産後のくしゃみや抱っこによる尿漏れ（産後尿失禁）に対し、骨盤底筋訓練（PFMT）と併用して回復を後押しする産後鍼灸ケア。", "symptoms": "・出産後、くしゃみ・咳・笑い・赤ちゃんを抱き上げた拍子に尿が漏れる\n・骨盤底筋体操を続けているが、なかなかスッキリ改善しない\n・授乳中で薬を使いにくく、身体に優しい方法でケアしたい\n・産後の腰痛や骨盤周囲の違和感・疲労感もあわせて整えたい", "image_file": "cat_women.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1197", "name": "胃内視鏡検査（胃カメラ）時の不快感・嘔吐反射軽減", "category": "消化器のお悩み", "keywords": "胃内視鏡検査, 胃カメラ, 嘔吐反射, えづき, 不安軽減, 咽頭麻酔, 内関, 鍼灸", "slug": "upper-gi-endoscopy-discomfort", "summary": "胃カメラ（上部消化管内視鏡）時の強い嘔吐反射や不安・不快感に対し、検査前の自律神経調整と経穴刺激で負担を和らげるサポート。", "symptoms": "・胃カメラ検査のときの「オエッ」という強い嘔吐反射（えづき）がトラウマになっている\n・鎮静剤が使えない・使いたくない事情があり、少しでも楽に受けたい\n・検査前から胃の緊張や動悸・強い不安感が出てしまう\n・検査後に残る胃の張りや吐き気・だるさを整えたい", "image_file": "cat_digestive.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1198", "name": "前立腺がんホルモン療法（ADT）に伴うホットフラッシュ", "category": "がんの種類", "keywords": "前立腺がん, ホルモン療法, ADT, ホットフラッシュ, ほてり, 発汗, 夜間覚醒, がん支持療法, 鍼灸", "slug": "prostate-cancer-adt-hot-flashes", "summary": "前立腺がんのホルモン療法（ADT）に伴う突然のほてりや発汗・夜間覚醒に対し、治療継続を支える非薬物の補助鍼灸ケア。", "symptoms": "・前立腺がんのホルモン療法（ADT）を始めてから、急なほてりや大汗がつらい\n・夜中にほてりと寝汗で目が覚め、睡眠不足や日中のだるさが続いている\n・ほてり対策の薬を増やすことに抵抗があり、副作用の少ないケアを探している\n・ホルモン療法を無理なく継続するために、自律神経の波を穏やかにしたい", "image_file": "cat_cancer_acupoints.jpg", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1199", "name": "婦人科手術の周術期不安・術後回復サポート", "category": "女性のお悩み", "keywords": "婦人科手術, 周術期不安, 術前不安, 腹腔鏡手術, 子宮筋腫手術, 術後悪心嘔吐, 術後回復, 鍼灸", "slug": "gynecological-surgery-perioperative-anxiety", "summary": "婦人科手術前後の強い不安・緊張や術後の吐き気・体力回復に対し、標準医療と併用して心身の負担を和らげる周術期鍼灸ケア。", "symptoms": "・子宮や卵巣の手術を控え、強い不安や緊張で眠れない日が続いている\n・術後の吐き気・痛み・お腹の張り・自律神経の乱れが心配\n・退院後の体力低下やホルモンバランスの揺らぎを穏やかに整えたい\n・主治医の治療方針を尊重しながら、安全に併用できるケアを探している", "image_file": "cat_women.png", "image_exists": true, "has_youtube": false, "has_rich": false}, {"id": "D1200", "name": "血液透析に伴う筋けいれん・むずむず脚（非薬物サポート）", "category": "泌尿器のお悩み", "keywords": "透析筋けいれん, こむら返り, 透析むずむず脚, 血液透析, RLS, レストレスレッグス, 足がつる, 指圧, 鍼灸", "slug": "hemodialysis-cramps-rls", "summary": "血液透析に伴う足のつり（筋けいれん）やむずむず脚の不快感に対し、シャント腕を避けた安全な経穴ケアで日常の負担を和らげるサポート。", "symptoms": "・透析中や透析後の夜間にふくらはぎや足がよくつる（こむら返り）\n・夕方から夜にかけて脚がむずむずしてじっとしていられず、眠れない\n・ドライウェイト調整や内服治療を続けているが、脚の不快感が残っている\n・シャントや出血リスクに配慮した安全な非薬物ケアを探している", "image_file": "cat_urology.png", "image_exists": true, "has_youtube": false, "has_rich": false}];
    let selectedCat = "すべて";
    let query = "";
    let visibleLimit = 30;
    const esc = (s) => String(s || "").replace(/[&<>"']/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    const norm = (s) => String(s || "")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60))
      .replace(/\s+/g, " ")
      .trim();

    const INDEXED = DISEASES.map((d) => ({
      ...d,
      _haystack: norm([d.name, d.category, d.keywords, d.summary, d.symptoms].join(" "))
    }));

    function cardHtml(d) {
      const thumb = `<img src="./cards/${esc(d.slug)}.svg" alt="${esc(d.name)}" loading="lazy" class="w-full h-36 sm:h-full object-cover rounded-xl border border-slate-100 shadow-xs" />`;
      const badges = [
        `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#16284c] text-white">${esc(d.category)}</span>`,
        d.has_youtube ? `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#eef7fc] text-[#0369a1] border border-[#bae6fd]">🎥 YouTube解説あり</span>` : "",
        d.has_rich ? `<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#faf5eb] text-[#8c6239] border border-[#e5d5b5]">★ 詳細解説</span>` : ""
      ].filter(Boolean).join(" ");
      return `<a href="./${esc(d.slug)}.html" class="group bg-white rounded-2xl border border-[#e8e3d9] shadow-sm hover:border-[#b68d40] transition-all overflow-hidden flex"><div class="w-1.5 shrink-0 bg-[#16284c] group-hover:bg-[#b68d40]"></div><div class="flex-1 p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-12 gap-4 items-center"><div class="sm:col-span-4">${thumb}</div><div class="sm:col-span-8 space-y-2"><div class="flex flex-wrap items-center gap-1.5">${badges}</div><h3 class="font-mincho text-lg sm:text-xl font-bold text-[#16284c] group-hover:text-[#b68d40]">${esc(d.name)}</h3><p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${esc(d.summary)}</p><div class="text-right text-xs font-semibold text-[#16284c]">詳しい解説を読む →</div></div></div></a>`;
    }

    function render() {
      const counts = { "すべて": INDEXED.length };
      INDEXED.forEach((d) => { counts[d.category] = (counts[d.category] || 0) + 1; });
      document.getElementById("cats").innerHTML = Object.keys(counts).map((c) => {
        const active = c === selectedCat;
        const cls = active ? "bg-[#b68d40] text-white border-[#b68d40]" : "bg-slate-50 text-slate-600 border-slate-200 hover:border-[#b68d40]";
        return `<button type="button" data-cat="${esc(c)}" class="px-3.5 py-1.5 rounded-full text-xs font-medium border ${cls}">${esc(c)} (${counts[c]})</button>`;
      }).join("");

      const tokens = norm(query).split(" ").filter(Boolean);
      const filtered = INDEXED.filter((d) => {
        if (selectedCat !== "すべて" && d.category !== selectedCat) return false;
        if (!tokens.length) return true;
        return tokens.every((tk) => d._haystack.includes(tk));
      });

      document.getElementById("count").textContent = filtered.length;
      const slice = filtered.slice(0, visibleLimit);
      document.getElementById("list").innerHTML = slice.map(cardHtml).join("") || '<p class="text-center text-sm text-slate-500 py-10 bg-white rounded-2xl border border-[#e8e3d9]">該当する疾患が見つかりませんでした。別のひらがな・キーワードでお試しください。</p>';

      const remaining = filtered.length - slice.length;
      const wrap = document.getElementById("load-more-wrap");
      const btn = document.getElementById("load-more-btn");
      if (remaining > 0) {
        wrap.classList.remove("hidden");
        btn.textContent = `さらに表示する（残り ${remaining} 件）`;
      } else {
        wrap.classList.add("hidden");
      }
    }

    document.getElementById("q").addEventListener("input", (e) => { query = e.target.value; visibleLimit = 30; render(); });
    document.getElementById("cats").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-cat]");
      if (b) { selectedCat = b.dataset.cat; visibleLimit = 30; render(); }
    });
    document.getElementById("quick-chips").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-quick]");
      if (b) {
        query = b.dataset.quick;
        selectedCat = "すべて";
        visibleLimit = 30;
        document.getElementById("q").value = query;
        render();
      }
    });
    document.getElementById("load-more-btn").addEventListener("click", () => { visibleLimit += 50; render(); });
    render();
  </script>
