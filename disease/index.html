  <script>
    const DISEASES = [{"id": "D001", "name": "頭鳴り（ずなり）", "category": "特に対応することが多い症状", "keywords": "頭鳴り, ずなり, 耳鳴り, 脳過敏症候群, 脳の興奮, 自律神経, キーン, ザー", "slug": "zunari", "meta_description": "MRIやCTで異常がなく薬でも改善しない「頭鳴り」に対し、脳の過覚醒（交感神経の興奮）と首・深層筋の緊張に着目した銀座そうぜん鍼灸院の鍼灸アプローチを解説します。", "summary": "頭の中で「キーン」「ザー」と音が鳴り続ける状態を、脳の過覚醒（自律神経）と首肩の深層筋から整える施術解説。", "symptoms": "・頭の中や頭頂部で「キーン」「シャー」「ジー」という音が鳴り続けている / ・静かな場所や寝る前に音が気になり眠れない / ・MRIやCT、耳鼻科で「異常なし・様子見」と言われた / ・抗てんかん薬や抗不安薬を飲んでも変化を感じにくい", "mechanism": "頭鳴りは耳の病気ではなく、脳の側頭葉（聴覚野）が過剰に興奮し続ける「脳の過覚醒（交感神経の長期興奮）」や、神経伝達のグルタミンサイクルの変調などが関係していると考えられています。首・肩の深層筋の強い緊張や長期間のストレス・睡眠不足が引き金になるケースが多く見られます。", "approach": "1. 首・肩（僧帽筋など）の深層筋の緊張を緩め、脳への過剰な刺激・緊張の連鎖を断つ / 2. 醒脳開竅法や自律神経調整の鍼灸で交感神経の過覚醒を鎮め、副交感神経への切り替えを促す / 3. 音の変動期〜安定期を見極めながら施術間隔を調整し、脳の神経可塑性による安定化を目指す（※強いマッサージや首のストレッチは悪化要因になるため控えていただきます）", "faq": "Q. 何回くらいで変化が出ますか？ A. 首の緊張は3〜6回で変化が出ることが多く、音の安定化には症状の性質に応じて間隔を空けながら調整します。 / Q. 病院で異常なしと言われましたが相談できますか？ A. 脳の過覚醒は検査数値に出にくいため、同様のお悩みで来院される方が多くいらっしゃいます。 / Q. 枕を変えた方が良いですか？ A. 枕そのものより首の深層筋の状態が影響するため、まずは首の緊張を整えることを優先しています。", "image_file": "zunari.png", "image_exists": false, "source_url": "https://www.s-treatment.com/15426077685619", "status": "下書き（見本）"}, {"id": "D002", "name": "脳過敏症候群", "category": "特に対応することが多い症状", "keywords": "脳過敏症候群, 聴覚過敏, 片頭痛, めまい, 耳鳴り, 頭鳴り, 脳の興奮, 自律神経", "slug": "nokabin", "meta_description": "病院の検査で異常がなく薬でも落ち着かない脳過敏症候群（聴覚過敏・めまい・頭鳴り・片頭痛）に対し、脳を興奮させる体の要因を一つずつ取り除く銀座そうぜん鍼灸院の鍼灸アプローチを解説します。", "summary": "脳の過剰興奮による聴覚過敏・頭鳴り・めまい・片頭痛に対し、筋肉・神経・内臓の乱れから脳を鎮める鍼灸解説。", "symptoms": "・音や光に対して過敏になり、日常生活がつらい / ・頭鳴りや耳鳴り、めまい、重度の片頭痛・閃輝暗点に悩んでいる / ・病院で脳波検査や抗てんかん薬・抗不安薬を試したが改善しない / ・首や腰の違和感、強い疲労感が抜けない", "mechanism": "脳過敏症候群は、脳が長期的に過剰興奮している状態（脳の過覚醒）です。精神的ストレスだけでなく、首・腰の深層筋の緊張、リンパ・血流の滞り、内臓疲労など体のさまざまな異常信号が脳へ伝わり続けることで、脳が過敏に反応してしまうと考えられます。", "approach": "1. 筋肉・神経・リンパ・内臓など、脳を興奮させている体の要因（フック）を一つずつ取り除く / 2. 強い刺激やマッサージ・ストレッチは過敏性を悪化させるため避け、体の土台（首・腰・自律神経）から穏やかに整える / 3. 症状の波が落ち着いてきたら施術間隔を空け、脳の神経可塑性による安定化を促す", "faq": "Q. 耳鼻科や病院で異常なしと言われましたが相談できますか？ A. 脳過敏は一般的な検査で異常が出にくい状態のため、同様のお悩みで来院される方が多くいらっしゃいます。 / Q. どのくらい通う必要がありますか？ A. まずは首や腰など体の土台を整えることから始め、安定してきたら月1回〜2ヶ月に1回へと間隔を空けて卒業を目指します。 / Q. セルフケアで揉んだりストレッチしても良いですか？ A. 強い刺激は脳の興奮を強める恐れがあるため、当院では首・腰のマッサージやストレッチを控えていただいています。", "image_file": "nokabin.png", "image_exists": false, "source_url": "https://www.s-treatment.com/17780031627554", "status": "下書き"}, {"id": "D003", "name": "梨状筋症候群", "category": "特に対応することが多い症状", "keywords": "梨状筋症候群, 坐骨神経痛, お尻の痛み, 足のしびれ, もも裏の痛み, 間欠性跛行, 深層筋, トリガーポイント", "slug": "rijokin", "meta_description": "マッサージやストレッチで改善しないお尻の痛み・坐骨神経痛（梨状筋症候群）に対し、お尻の深層筋に直接アプローチする銀座そうぜん鍼灸院のトリガーポイント鍼灸を解説します。", "summary": "お尻の深い筋肉（梨状筋）の硬結による坐骨神経痛・足のしびれを、深層筋トリガーポイント鍼灸で解放する解説。", "symptoms": "・長時間座っているとお尻の奥（仙骨まわり）がズキズキ痛む / ・お尻から太もも裏、ふくらはぎの外側にかけて痛みやしびれがある / ・少し歩くと足がしびれて休みたくなる（間欠性跛行） / ・病院でヘルニアや脊柱管狭窄症と言われたが、薬やストレッチで変わらない", "mechanism": "お尻の深い層にある「梨状筋」が異常に硬くなり、その下を通る坐骨神経・下殿神経・後大腿皮神経などを圧迫することで痛みやしびれが生じます。圧迫される神経によって痛む場所が異なり、腰椎のトラブルから二次的に梨状筋が固まるケースも多く見られます。", "approach": "1. 痛みやしびれの部位から圧迫されている神経（坐骨神経・下殿神経など）を特定する / 2. 手が届かないお尻の深層筋（梨状筋）へ直接トリガーポイント鍼灸を行い、自己回復能力によって筋肉の柔軟性と神経の再生を促す / 3. 関連する腰部の緊張もあわせて調整し、再発しにくい状態へ導く（※梨状筋のストレッチは坐骨神経をさらに圧迫し逆効果になりやすいため控えていただきます）", "faq": "Q. ストレッチやマッサージを続けても良いですか？ A. 梨状筋のストレッチは坐骨神経を圧迫して悪化するケースが多いため、当院では控えていただいています。 / Q. ヘルニアや脊柱管狭窄症と診断されましたが対応できますか？ A. 梨状筋症候群はヘルニアや脊柱管狭窄症と症状が非常に似ており、深層筋の圧迫を解くことで楽になるケースが多くあります。 / Q. デスクワークで座るとすぐ痛みますが改善しますか？ A. 仙骨まわりの鈍痛は梨状筋単体や腰椎関節の関連が多く、深層筋への鍼灸が有効です。", "image_file": "rijokin.png", "image_exists": false, "source_url": "https://www.s-treatment.com/14810970831733", "status": "下書き"}, {"id": "D004", "name": "自律神経失調症", "category": "特に対応することが多い症状", "keywords": "自律神経失調症, 不眠, 倦怠感, めまい, 動悸, 過敏性腸症候群, 交感神経, 副交感神経, 冷え性", "slug": "jiritsushinkei", "meta_description": "不眠・倦怠感・めまい・動悸・胃腸の不調など多岐にわたる自律神経失調症に対し、交感神経と副交感神経の切り替えと全身の筋緊張を整える銀座そうぜん鍼灸院の鍼灸を解説します。", "summary": "交感神経と副交感神経のバランス崩れによる不眠・倦怠感・めまい・胃腸不調を、体と神経の両面から整える解説。", "symptoms": "・寝つきが悪い、眠りが浅く朝スッキリ起きられない / ・原因不明の倦怠感、めまい、頭痛、動悸、息切れが続いている / ・腹痛・下痢・便秘（過敏性腸症候群）や異常な発汗・冷えがある / ・検査では異常なしと言われ、薬や漢方だけではスッキリしない", "mechanism": "呼吸・血流・消化・睡眠を司る交感神経（活動）と副交感神経（休息）の切り替えがうまくいかなくなる状態です。精神的ストレスだけでなく、睡眠不足・生活リズムの乱れ・ホルモン変動・首肩の筋緊張・内臓疲労・感染症後の影響など複数の要因が絡み合って発症します。", "approach": "1. お腹や体表のサインから、交感神経優位・副交感神経優位・実証／虚証などの体の状態を見極める / 2. 福田安保理論に基づく自律神経調整と、背面や頭皮・深層筋の緊張緩和（必要に応じて吸い玉・電気鍼を併用）で切り替え力を回復させる / 3. 睡眠・栄養・温熱（仙骨や第7頚椎のカイロ等）やツボ刺激など、体質に合った生活リズムの整え方をアドバイスする", "faq": "Q. 精神的な弱さが原因なのでしょうか？ A. 性格や精神的な強さとは関係なく、過労・睡眠不足・環境や体の不調が重なれば誰にでも起こります。 / Q. 病院の検査で異常なしと言われましたが診てもらえますか？ A. 自律神経の乱れは血液や画像検査に映らないことが多いため、体表のサインを見ながら施術方針を組み立てます。 / Q. マッサージや強い運動をすれば良くなりますか？ A. 体調が整う前の強いマッサージや激しい運動は逆効果になることがあるため、まずは体の緊張を穏やかに整えることを優先します。", "image_file": "jiritsushinkei.png", "image_exists": false, "source_url": "https://www.s-treatment.com/15426068520662", "status": "下書き"}, {"id": "D005", "name": "胸郭出口症候群", "category": "特に対応することが多い症状", "keywords": "胸郭出口症候群, 腕のしびれ, 手のしびれ, 斜角筋症候群, 小胸筋症候群, 肋鎖症候群, 頚肋症候群, 猫背", "slug": "kyokakudeguchi", "meta_description": "腕や手のしびれ・肩甲骨まわりの痛み（胸郭出口症候群）に対し、斜角筋・鎖骨下・小胸筋の深層筋を緩めて神経圧迫を解放する銀座そうぜん鍼灸院の施術を解説します。", "summary": "首・鎖骨・胸まわりでの神経圧迫による腕や手のしびれを、斜角筋・小胸筋などの深層筋鍼灸で解放する解説。", "symptoms": "・上を向いたり、腕を上げたり（バンザイ）すると腕や手がしびれる / ・胸を張ると腕に痛みやしびれが出る、または肩甲骨まわりが強く痛む / ・長時間のデスクワークや猫背で、手のだるさ・しびれが悪化する / ・病院でヘルニアやストレートネックと言われ薬を飲んでいるが改善しない", "mechanism": "首から腕へ向かう神経が「前・中斜角筋の間（斜角筋症候群）」「肋骨と鎖骨の間（肋鎖症候群）」「胸の奥の小胸筋の下（小胸筋症候群）」「骨の変形（頚肋症候群）」のいずれかで圧迫されることで発症します。当院では斜角筋症候群の来院が最も多く、複数箇所が絡み合うケースもあります。", "approach": "1. 症状が出る動作としびれる指の領域から、圧迫箇所（斜角筋・肋鎖・小胸筋など）を正確に特定する / 2. 首の深層にある前・中斜角筋や胸の小胸筋を鍼灸で緩め、鎖骨下の空間を広げて神経の通り道を解放する / 3. 筋肉の防御反応を招く首・肩・腕のマッサージやストレッチを控えていただき、平均5回前後を目安に改善を目指す（※骨が原因の頚肋症候群は医療機関での手術適応となります）", "faq": "Q. 何回くらいで変化を実感できますか？ A. 複数パターンが絡み合う場合もありますが、平均5回前後の施術で変化が出ることが多く、当院では210例中200例で改善した実績があります。 / Q. 肩や腕のストレッチ・マッサージは効果的ですか？ A. 揉んだり伸ばしたりすると筋肉が防御反応でさらに硬くなり悪循環を招くため、当院では控えていただいています。 / Q. 病院で頚椎ヘルニアと言われましたが関係ありますか？ A. ヘルニアと診断されていても、実際は胸郭出口での筋肉による神経圧迫が原因で鍼灸により改善するケースが少なくありません。", "image_file": "kyokakudeguchi.png", "image_exists": false, "source_url": "https://www.s-treatment.com/14804762664564", "status": "下書き"}, {"id": "D006", "name": "薬の効かない咳喘息", "category": "特に対応することが多い症状", "keywords": "咳喘息, 薬が効かない咳, 空咳, 気管支, 自律神経, 逆流性食道炎, ステロイド吸入, 夜間咳嗽", "slug": "sekizensoku", "meta_description": "吸入ステロイドや薬が効かない長引く咳喘息に対し、自律神経による気管支神経の過敏や逆流性食道炎の影響に着目した銀座そうぜん鍼灸院の鍼灸アプローチを解説します。", "summary": "吸入薬で止まらない長引く空咳に対し、自律神経・気管支神経の興奮と逆流性食道炎の視点から整える施術解説。", "symptoms": "・ゼイゼイしない空咳が何週間も（あるいは何ヶ月も）続いている / ・夜間や早朝に咳が悪化し、十分に眠れない / ・ステロイド吸入薬や気管支拡張薬を続けているが改善しない / ・胸部レントゲンで異常がなく、背中上部（肩甲骨の間）に小さなニキビが出やすい", "mechanism": "一般的な咳喘息は気道の炎症が原因ですが、薬が効きにくいケースでは「自律神経の乱れによる気管支神経の過剰興奮（空気の刺激に過敏反応する状態）」や、「長期のステロイド吸入による胃酸逆流（逆流性食道炎）が気道を傷つける二次障害」が隠れていることが多く見られます。", "approach": "1. 気道の炎症だけでなく、自律神経・気管支神経の興奮状態や逆流性食道炎の有無、背中（第1〜3胸椎付近）のサインを確認する / 2. 自律神経の緊張を鎮めて気管支の過敏性を和らげるとともに、胃腸・食道まわりの負担を軽減する鍼灸を行う / 3. 医療機関での適切な診断・吸入治療と並行しながら、再発しにくい呼吸・体調の土台を整える", "faq": "Q. 病院で処方された吸入薬は続けても大丈夫ですか？ A. 自己判断で中止せず、医師の指示のもとで継続しながら鍼灸を併用してください。 / Q. なぜステロイド吸入を続けても咳が止まらないことがあるのですか？ A. 気道の炎症ではなく自律神経・気管支神経の過敏が主因であったり、吸入の影響による逆流性食道炎が咳を長引かせていたりするケースがあるためです。 / Q. 背中の状態と咳喘息に関係はありますか？ A. 自律神経が関与する咳喘息では第1〜3胸椎付近に小さなニキビなどのサインが現れることがあり、体全体の調整の目安にしています。", "image_file": "sekizensoku.png", "image_exists": false, "source_url": "https://www.s-treatment.com/14813619188231", "status": "下書き"}, {"id": "D007", "name": "子宮筋腫を小さくする鍼灸", "category": "特に対応することが多い症状", "keywords": "子宮筋腫, 過多月経, 生理痛, 貧血, 筋層内筋腫, 粘膜下筋腫, 漿膜下筋腫, 妊活, 骨盤血流", "slug": "shikyukinshu", "meta_description": "過多月経・生理痛・貧血・圧迫症状を引き起こす子宮筋腫に対し、骨盤内の血流循環とホルモン・自律神経バランスを整える銀座そうぜん鍼灸院の鍼灸アプローチを解説します。", "summary": "30歳以上の女性の約4人に1人にみられる子宮筋腫に対し、骨盤内の血流と自律神経バランスを整える施術解説。", "symptoms": "・月経の経血量が多く、レバー状の塊や強い貧血・生理痛に悩んでいる / ・子宮筋腫が少しずつ大きくなっており、手術を避けたいと考えている / ・筋腫による圧迫で頻尿・便秘・下腹部の張り感がある / ・妊娠を希望しており、子宮環境を整えたい", "mechanism": "子宮の平滑筋にできる良性腫瘍で、位置により「筋層内」「粘膜下」「漿膜下」の3タイプがあります。成長には女性ホルモン（エストロゲン・プロゲステロン）や骨盤内の血流の滞りが深く関わっており、大きくなると過多月経や周囲臓器の圧迫、着床の妨げにつながります。", "approach": "1. 筋腫のタイプ・サイズ・症状（過多月経や圧迫感、冷え、自律神経の乱れ）を丁寧に確認する / 2. 仙骨周辺や下腹部・手足のツボへの鍼灸（必要に応じてお灸による温熱刺激）で骨盤内の血行と自律神経・ホルモンバランスを整える / 3. 産婦人科での定期検診と併用しながら、症状の緩和と筋腫が大きくなる要因の軽減を目指す", "faq": "Q. 産婦人科での経過観察や漢方と併用できますか？ A. はい、定期的な検査でサイズや状態を確認しながら鍼灸を併用される方が多くいらっしゃいます。 / Q. どのタイプの子宮筋腫でも相談できますか？ A. 筋層内・粘膜下・漿膜下のいずれのご相談にも対応していますが、強い出血や急性の痛みなど重症化が疑われる場合は速やかな医療機関受診をおすすめします。 / Q. 自宅でできるケアはありますか？ A. 骨盤内の血流を助けるため、仙骨周辺を温める温熱ケア（カイロ等）などが役立つ場合があります。", "image_file": "shikyukinshu.png", "image_exists": false, "source_url": "https://www.s-treatment.com/16130140184361", "status": "下書き"}, {"id": "D008", "name": "肘部管症候群", "category": "特に対応することが多い症状", "keywords": "肘部管症候群, 尺骨神経障害, 小指のしびれ, 薬指のしびれ, 肘の内側の痛み, 握力低下, 鷲手変形", "slug": "chubukan", "meta_description": "小指や薬指のしびれ・肘の内側の痛み（肘部管症候群・尺骨神経障害）に対し、肘部管を構成する筋肉の圧迫を緩め神経再生を促す銀座そうぜん鍼灸院の鍼灸を解説します。", "summary": "肘の内側での尺骨神経圧迫による小指・薬指のしびれに対し、前腕の深層筋を緩め神経再生を促す施術解説。", "symptoms": "・小指と薬指の内側半分がビリビリしびれる、感覚が鈍い / ・肘の内側から前腕にかけて痛みやしびれが放散する / ・肘を長時間曲げている（スマホ・デスクワーク・就寝時）と悪化する / ・ボタンが掛けにくい、握力が落ちてきた、小指側の筋肉がやせてきた", "mechanism": "肘の内側（肘部管）を通る尺骨神経が、尺側手根屈筋・浅指屈筋・深指屈筋などの筋肉の硬結や肘関節の摩擦・圧迫を受けることで発症します。放置して神経障害が進行すると、指が伸びにくくなる「鷲手変形」に至る恐れがあるため早期対応が重要です。", "approach": "1. 小指のみか前腕まで広がるかなど、しびれのパターンと進行度（痛み→しびれ→麻痺）を見極める / 2. 肘部管を構成する前腕内側の深層筋やツボ（小海など）へ鍼灸を行い、神経の圧迫を解放して再生を促す / 3. 薬指→小指球→小指と段階的にしびれが引く経過を追いながら、筋肉を強く押さず皮膚を優しくつまんで緩めるセルフケアを指導する", "faq": "Q. 病院で手術を勧められましたが鍼灸で改善しますか？ A. 筋肉の圧迫が主因のケースでは6回前後の鍼灸で回復した事例もあります。ただし、強い麻痺や鷲手変形が進行している場合は早期の手術検討が必要です。 / Q. どの順番でしびれが引いていきますか？ A. 多くの場合、薬指→小指球（手のひらのふくらみ）→小指の先端という3段階で徐々に軽快していきます。 / Q. 自分で揉んだり押したりしても良いですか？ A. 筋肉を強く押すと圧迫が強まり悪化する恐れがあるため、皮膚と筋肉の間を優しくつまんで伸ばすケアをおすすめしています。", "image_file": "chubukan.png", "image_exists": false, "source_url": "https://www.s-treatment.com/14805862878697", "status": "下書き"}, {"id": "D009", "name": "新型コロナウイルスの後遺症", "category": "特に対応することが多い症状", "keywords": "新型コロナウイルス後遺症, コロナ後遺症, ロングコビット, ブレインフォグ, 倦怠感, 嗅覚障害, 味覚障害, 自律神経, 慢性疲労", "slug": "covid_kouisho", "meta_description": "長引く倦怠感・ブレインフォグ・嗅覚障害・自律神経の乱れなど新型コロナウイルス後遺症に対し、全身の免疫・神経・血流・内臓から自己回復力を引き出す銀座そうぜん鍼灸院の鍼灸を解説します。", "summary": "感染後に長引く倦怠感・ブレインフォグ・嗅覚障害・自律神経症状に対し、全身の自己回復力を引き出す施術解説。", "symptoms": "・感染から2ヶ月以上経っても、強い疲労感・倦怠感が抜けない / ・頭に霧がかかったようなブレインフォグ、集中力・記憶力の低下がある / ・嗅覚・味覚の異常、頭痛、めまい、動悸、睡眠障害が続いている / ・複数の診療科を回ったが決め手がなく、体調の波（クラッシュ）が不安", "mechanism": "当院ではコロナ後遺症の背景に「ウイルス残存による脳・神経系への影響（ブレインフォグ・嗅覚障害・慢性疲労など）」と「免疫の過剰反応（微熱・皮膚トラブル・抜け毛など）」の2つの側面があると考えており、自律神経や内臓・ホルモン系まで広く影響が及びます。", "approach": "1. 症状の傾向や血液検査の推移なども参考にしながら、残存型・免疫過剰反応型を含めた体の状態を多角的に確認する / 2. 免疫反応・筋肉・血流・末梢神経・自律神経・内臓・副腎疲労・ホルモンバランスまで全身へ広く鍼灸でアプローチする / 3. 深い睡眠と成長ホルモンの分泌、エネルギー代謝（ATP）の回復を促し、クラッシュを起こしにくい体づくりを支援する（※合わない薬やセルフケアは無理に続けず、ご自身の体感で良いものを選択することを重視しています）", "faq": "Q. 病院の診療科ごとに言われることが違い困っています。 A. 確定した標準治療がまだ確立されていないため、当院では特定の部位に限定せず全身の回復力を底上げする方針で対応しています。 / Q. 激しい運動やセルフケアをした方が良いですか？ A. 感染症由来の後遺症では一般的な自律神経ケアが逆効果になることがあるため、体調を見極めながらご自身の感覚に合うものだけを取り入れます。 / Q. サプリや漢方はたくさん飲んだ方が良いですか？ A. 肝臓への負担になることもあるため、明らかに体感が良いものだけを選んで続けることをおすすめしています。", "image_file": "covid_kouisho.png", "image_exists": false, "source_url": "https://www.s-treatment.com/17179223391758", "status": "下書き"}];
    let selectedCat = "すべて";

    function render() {

        return `<button type="button" data-cat="${esc(c)}" class="px-3.5 py-1.5 rounded-full text-xs font-medium border ${cls}">${esc(c)} (${counts[c]})</button>`;

      });
      document.getElementById("count").textContent = filtered.length;
