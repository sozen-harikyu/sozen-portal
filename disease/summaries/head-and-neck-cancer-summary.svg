<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="頭頸部がんの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">頭頸部がん</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">鼻・口腔・喉・唾液腺など顔や首領域のがん総称。標準治療を最優先に、主治医</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">許可のもと治療に伴う倦怠感や不安の緩和を支援します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手術や放射線・薬物療法による強い倦怠</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">感がつらい</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療に伴う吐き気・食欲低下・手足のし</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">びれに悩んでいる</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発声や食事など生活変化への不安で眠り</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が浅い</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭蓋底から鎖骨より上の顔や首（鼻・副鼻腔・口</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腔・咽頭・喉頭・唾液腺・甲状腺など）に発生す</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">るがんの総称です。呼吸・摂食・嚥下・発声・味</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">覚・聴覚など重要な機能が集中する領域であり…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による治療後の生活機能まで見据え</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">た手術・放射線・薬物療法などの標準がん治療を</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">絶対最優先とし、鍼灸はがんを治す治療ではなく</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主治医許可のもとでの支持療法・QOL向上と…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>