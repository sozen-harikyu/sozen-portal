<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="モートン病の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272643"/>
      <stop offset="100%" stop-color="#3d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b88a44"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">モートン病</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">足の指の付け根を通る神経が靱帯と地面に挟まれて圧迫され、主に第3〜4趾間</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">に鋭い痛みやしびれを起こす絞扼性神経障害です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b88a44"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足の第3〜4趾（または第2〜3趾）の</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">付け根から指先にピリピリ・チクチク…</text><circle cx="76" cy="375" r="5" fill="#b88a44"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ヒールや先が細い靴を履くと痛み、靴を</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脱ぐと症状が和らぐ</text><circle cx="76" cy="441" r="5" fill="#b88a44"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">点字ブロックや小さな段差を踏んだとき</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に強い痛みが走る</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足の指へ伸びる神経が、足裏の深横中足靱帯と地</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">面の間に繰り返し挟み込まれることで炎症や仮性</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">神経腫が生じます。ハイヒールなどつま先に負担</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がかかる靴の着用、長時間のつま先立ちや中腰…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 足部から下肢全体の血液や体液の循環を改</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">善し、患部の痛み・腫れ・熱感を穏やかに鎮めて</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いきます / 2. 中医学では更年期女性や肝</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腎虚弱の方に多いと捉え、肝腎の働きを補うツ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>