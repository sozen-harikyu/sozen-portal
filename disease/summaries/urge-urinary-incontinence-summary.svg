<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="切迫性尿失禁（急な尿意で漏れる症状）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">切迫性尿失禁（急な尿意で漏れる症状）</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">急な強い尿意・トイレ不安に対し、膀胱の過敏な収縮と自律神経の緊張を穏やか</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">に鎮める解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">急に我慢できない尿意が襲ってきて、ト</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">イレまで間に合わないことがある</text><circle cx="76" cy="375" r="5" fill="#b58b45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・水音を聞いたり寒い場所に出たりする</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">と一気に尿意が強まる</text><circle cx="76" cy="441" r="5" fill="#b58b45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・外出や旅行・映画館が不安で楽しめな</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くなっている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膀胱排尿筋の不随意な過剰収縮と仙髄・大脳の排</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">尿抑制低下が原因です。尿失禁に対する鍼灸の臨</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">床レビュー（PMC10441104）では、腰</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">仙部経穴（BL32・BL33・BL35）と…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 泌尿器科での検査（尿路感染・結石等の除</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">外）を前提に、腰仙部と下肢（三陰交・太渓等）</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">から膀胱過敏を鎮静 / 2. 下半身の冷えと</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">交感神経の緊張を緩和し、急な尿意の引き金を…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>