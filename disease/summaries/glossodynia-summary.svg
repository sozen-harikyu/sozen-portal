<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="舌痛症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">舌痛症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">明らかな病変がないのに舌の痛みや灼熱感が続く舌痛症に対し、自律神経と顔面</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">周囲の巡りを整える鍼灸でサポートします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">舌の先や縁がヒリヒリ・ピリピリ痛み、</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">焼けるような灼熱感がある</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">歯科や耳鼻科で診てもらっても舌の表面</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に大きな異常が見つからない</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">仕事や家事のストレス・睡眠不足が重な</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ると痛みが強くなる気がする</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">舌痛症は、舌の粘膜に明確な潰瘍や病変が見られ</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ないにもかかわらず、痛み・灼熱感・しびれ・味</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">覚の違和感などが続く状態です。歯科処置などが</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">きっかけになることもありますが、単一の原因…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 顔面・口腔周囲の巡りを整えるツボケア：</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">公式サイトでも紹介している地倉や巨髎を活用し</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、口周囲や顔面の神経・血流の滞りを優しく和ら</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">げます。 / 2. 全身の冷え・リンパ循環…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>