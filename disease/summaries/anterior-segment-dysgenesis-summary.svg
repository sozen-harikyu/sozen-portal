<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="前眼部形成異常の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3b5c"/>
      <stop offset="100%" stop-color="#2b5887"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#4f86b8"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">眼のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">前眼部形成異常</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">胎生期の前眼部形成過程で角膜混濁などが生じる指定難病です。眼科治療を最優</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">先に、安定期の眼精疲労ケアをサポートします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#4f86b8"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">生まれつき角膜の濁りやまぶしさがある</text><circle cx="76" cy="351" r="5" fill="#4f86b8"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">見えにくさから目や首肩が疲れやすい</text><circle cx="76" cy="393" r="5" fill="#4f86b8"/><text x="92" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">白内障や緑内障などの合併症を管理して</text><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胎生5〜8週に角膜・虹彩・水晶体などの前眼部</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が作られる過程で異常が生じる指定難病です。リ</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ーガー異常やペータース異常などが代表例で、P</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">AX6などの遺伝子変異のほか、妊娠中の感染…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 眼科専門医での手術や眼鏡補正、視覚リハ</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ビリテーションを最優先とし、急性期や術後安静</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">期は施術を控えます / 2. 症状が安定し主</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治医の許可がある場合に限り、見えにくさから…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>