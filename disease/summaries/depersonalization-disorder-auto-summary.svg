<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="離人症性障害の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">離人症性障害</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">現実感の喪失や疎隔感が続く解離性障害の一つ。専門医の診断と精神療法を最優</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">先に、百会等を用いた穏やかな自律神経ケアで緊張を和らげます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">自分を外から眺めているような感覚や現</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">実感のなさが続く</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">周囲の世界が膜一枚隔てたように遠く感</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">じられる</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強いストレスやトラウマ体験の後から違</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">和感が抜けない</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">離人症性障害（離人感・現実感消失症）は、自分</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が体から離れて見ているような感覚や周囲の現実</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">感が薄れる状態が持続・反復する解離性障害の一</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">つです。過去のトラウマ体験や強いストレスに…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 精神科・心療内科での診断と治療を最優先</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、急性のパニックや希死念慮がない安定期に</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主治医の許可のもと補完対応 / 2. 頭頂部</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の百会などを用いて自律神経と脳の過緊張を穏…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>