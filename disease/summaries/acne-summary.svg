<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ニキビの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ニキビ</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">毛穴の詰まりと皮脂過剰、アクネ菌の増殖によって額や頬・あごに炎症が起きる</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">皮膚トラブルで、皮膚科治療と生活・体質ケアが大切です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">おでこ・頬・口周り・下あごに発疹や吹</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">き出物が繰り返しできる</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">毛穴が詰まった白ニキビや、開いて黒ず</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">んだ黒ニキビが増えている</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">赤く腫れて痛みを伴う赤ニキビに悪化し</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">やすい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">肌のターンオーバーの乱れによる毛穴の閉塞、ホ</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ルモン変動や糖分・油分の多い食事などによる皮</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脂の過剰分泌、詰まった皮脂を栄養とするアクネ</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">菌の増殖が主な原因です。東洋医学では、偏っ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 胃腸やホルモン・血流を整える曲池、余分</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な水分（痰）の排出を助ける豊隆、肌のうるおい</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">と巡りを支える尺沢・支溝・合谷を施術します </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">/ 2. 自律神経と胃腸・ホルモンバランス…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>