<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="大腿骨頭壊死症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">大腿骨頭壊死症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">大腿骨頭への血流が途絶え壊死・圧潰する疾患。整形外科での専門治療を最優先</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">とし生活の質を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">立ち上がりや歩行・体重をかけたときに</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">股関節に強い痛みが出る</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">安静にしていても股関節が痛み、太もも</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">外側や膝・ふくらはぎへ広がる</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">股関節の曲げ伸ばしや開閉が制限され、</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">歩き方（跛行）が変わってきた</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">大腿骨の球状の頭部（大腿骨頭）への血流が減少</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・途絶えて骨組織が壊死し、体重がかかる部分が</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">つぶれることで周囲に出血や浮腫が生じて強い痛</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">みを引き起こす疾患です。骨折・脱臼などの外…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 骨頭の圧潰や関節変形が進行する深刻な疾</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">患のため、まず整形外科専門医での診断・治療（</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">免荷・杖の使用・薬物療法・骨切り術・人工関節</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">置換術等）を最優先に案内します / 2. …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>