<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="抗糸球体基底膜腎炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">抗糸球体基底膜腎炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">急速進行性の指定難病のため腎臓専門医の緊急・標準治療が最優先です。寛解・</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">安定期かつ主治医許可下の倦怠感ケアに限定します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">血尿や蛋白尿、尿量の減少を指摘された</text><circle cx="76" cy="351" r="5" fill="#b58b45"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">微熱や全身の強い倦怠感、食欲低下があ</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る</text><circle cx="76" cy="417" r="5" fill="#b58b45"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">進行に伴うむくみや吐き気、高血圧が心</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">配</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">自己免疫反応により抗糸球体基底膜（抗GBM）</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">抗体が作られ、腎臓の糸球体基底膜に沈着して急</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">速に腎機能が低下する指定難病です。中高年に多</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">く遺伝性はないとされ、喫煙や溶剤・呼吸器感…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 急性期の標準治療専念と断薬厳禁の徹底：</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">急性期・活動期は腎臓専門医による免疫抑制療法</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や血漿交換が絶対条件であり鍼灸は行いません。</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">自己判断でのステロイド等の中断は厳禁とし、…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>