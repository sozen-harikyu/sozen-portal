<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="マイボーム腺梗塞の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3b5c"/>
      <stop offset="100%" stop-color="#2b5887"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#4f86b8"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">眼のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">マイボーム腺梗塞</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">まぶたの脂腺が詰まり白い粒ができる状態です。眼科処置と温湿布ケアに加え、</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">目周囲や首肩の巡りを整える鍼灸で再発予防を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#4f86b8"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まつ毛の生え際に白いブツブツができて</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いる</text><circle cx="76" cy="375" r="5" fill="#4f86b8"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">瞬きのたびに目にゴロゴロとした異物感</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がある</text><circle cx="76" cy="441" r="5" fill="#4f86b8"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まぶたの腫れや赤み、硬さが気になって</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まぶたの縁にあり涙の蒸発を防ぐ油分を分泌する</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">マイボーム腺の出口が、固まった脂や汚れで詰ま</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ることで起こります。60代以上の約6割にみら</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れる加齢による分泌機能低下のほか、動物性脂…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 感染や強い腫れ・膿がある場合は眼科での</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">圧出や点眼処置を最優先とし、安定期のケアとし</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">て対応いたします / 2. 眼輪筋や側頭部、</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">首肩の深層筋の緊張を緩め、まぶた周囲の微細…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>