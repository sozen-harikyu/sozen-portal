<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ハンチントン病の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#304373"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">脳神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ハンチントン病</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">不随意運動（舞踏運動）や精神・認知症状が緩やかに進む指定難病です。脳神経</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">内科の管理を最優先に、安定期の緊張緩和を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手足や顔が意図せず動く（舞踏運動）こ</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とがある</text><circle cx="76" cy="375" r="5" fill="#c48f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">細かい作業がしづらく歩行時のふらつき</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・転倒が心配</text><circle cx="76" cy="441" r="5" fill="#c48f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食事中のむせ込みや飲み込みにくさが出</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">てきた</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">IT15遺伝子内の3塩基繰り返し配列が異常に</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">伸長することで発症する常染色体顕性遺伝の神経</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">変性疾患（指定難病）で、食生活や生活習慣とは</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">無関係に生じます。発症は30歳代が多いもの…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 指定難病として脳神経内科管理を絶対最優</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">先：舞踏運動や抑うつ・精神症状に対する専門医</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の薬物調整（副作用確認を含む）と病期に応じた</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">生活支援が最優先であり、主治医の許可下・安…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>