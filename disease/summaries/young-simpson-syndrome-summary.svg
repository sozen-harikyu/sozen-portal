<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ヤング・シンプソン症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ヤング・シンプソン症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">眼瞼裂狭小や甲状腺機能低下症、内反足等を伴う先天性疾患。多診療科での標準</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">治療を最優先とし、安定期の穏やかな補完ケアを行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">乳児期から目が開けにくく（眼瞼裂狭小</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）弱視が心配</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">哺乳力の弱さや呼吸のしにくさ、鼻への</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">逆流があった</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">内反足や先天性心疾患、甲状腺機能低下</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">症を指摘された</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ヒストンアセチル基転移酵素をコードするKAT</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">6B遺伝子の新生突然変異によって生じる先天性</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">異常症候群です。新生児期の軽度呼吸障害や哺乳</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">困難、特徴的な眼瞼裂狭小、弱視・鼻涙管閉塞…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 小児科・整形外科・眼科・耳鼻科・内分泌</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">科でのホルモン補充・手術・てんかん管理・療育</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を絶対最優先とし、急性期・発作頻発期・術前後</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は対象外といたします / 2. 状態が安定…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>