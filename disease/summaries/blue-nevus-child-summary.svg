<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="青色母斑の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">青色母斑</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">真皮のメラノサイト集積で生じる青色母斑。皮膚科での鑑別・管理を最優先し、</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">心身の緊張を穏やかに整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手足の甲や顔、臀部などに青〜青黒色の</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">小さな盛り上がりがある</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ほくろに似ているが青みが強く1cm前</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">後ある</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">少しずつ大きくなったり形や色が変化し</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">たりしている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">青色母斑は、皮膚の深い層である真皮にメラノサ</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">イト（青色母斑細胞）が異常に集積し、メラニン</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">色素を産生することで皮膚表面から青色〜青黒色</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に見える良性のあざです。通常は直径10mm…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 皮膚科でのダーモスコピー診断、悪性黒色</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腫との鑑別、および必要に応じた外科的切除や定</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">期的な経過観察を最優先にご案内します / 2</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">. 皮膚病変・母斑部位への直接刺鍼や強い刺…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>