<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="硬膜動静脈瘻の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">硬膜動静脈瘻</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">脳や脊髄を覆う硬膜の動脈と静脈が直接つながる血管疾患です。脳神経外科での</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">標準治療を最優先に、治療後の回復期を支援します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">耳の奥で脈打つような耳鳴りが聞こえる</text><circle cx="76" cy="351" r="5" fill="#c48a47"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性的な頭痛や頭の重さが続いている</text><circle cx="76" cy="393" r="5" fill="#c48a47"/><text x="92" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">目の充血や二重に見える、視力低下があ</text><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脳や脊髄を覆う硬膜の動脈と静脈が、毛細血管を</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">介さず穴（シャント）で直接つながってしまう稀</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な病気です。高い圧の動脈血が静脈へ直接流れ込</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">むことで静脈圧が上昇し、うっ血や逆流を起こ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 未治療の硬膜動静脈瘻や急な頭痛・意識障</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">害・麻痺がある場合は脳出血やくも膜下出血の危</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">険があるため鍼灸禁忌とし、直ちに脳神経外科の</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">受診を最優先とします / 2. カテーテル…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>