<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="肺分画症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">肺分画症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">正常な気管支と交通せず大動脈から血流を受ける先天性の肺異常です。肺炎や喀</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">血予防の外科的切除が基本で、術後回復期・主治医許可下でのみ補完ケアを行…</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">健診のレントゲンやCT、胎児エコーな</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">どで肺分画症を指摘された</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">同じ部位で肺炎を繰り返したり、血痰・</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">咳が出たりすることがある</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">呼吸器外科・小児外科で経過観察中また</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は手術後の体調を整えたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">肺分画症は、胎児期の肺形成過程で生じる先天性</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">疾患で、正常な気管支と交通がなく、肺動脈では</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なく大動脈から異常動脈で栄養される肺組織が形</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">成される状態です。無症状で経過することもあ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 呼吸器外科・小児外科での評価と外科的切</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">除を最優先とし、肺炎合併時や喀血・血痰がある</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">時期の鍼灸は禁忌となります / 2. 手術後</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の回復が安定した時期や、無症状で主治医から…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>