<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="陰茎がんの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">陰茎がん</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">亀頭部や包皮などに発生する希少な悪性腫瘍です。専門医の標準治療を最優先と</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">し、主治医許可のもとで副作用の緩和とQOL向上を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">亀頭や包皮にカリフラワー状のしこりや</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治らないびらん・潰瘍がある</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">塗り薬で改善しない湿疹様の赤みや強い</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">におい・浸出液がある</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足の付け根のリンパ節の腫れや全身の倦</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">怠感・体重減少がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">陰茎がんは10万人あたり0.4〜0.5人程度</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">と比較的まれな悪性腫瘍で、亀頭部（約5割）を</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">中心に包皮や冠状溝に発生します。従来指摘され</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">てきた包茎単独よりも、性感染症としてのヒト…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による標準がん治療（手術・放射線</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療・薬物療法等）を絶対最優先とし、鍼灸はが</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">んそのものを治す治療ではないことを前提に、主</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治医の許可を得たうえで支持療法・QOL向上…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>