<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="更年期障害の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="100%" stop-color="#6b3764"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c98b5b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">女性のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">更年期障害</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">閉経前後のホルモン急減によるほてり・不眠・不安に対し、女性ホルモン関連の</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ツボと七情に応じたお灸で心身を調える施術です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c98b5b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">顔や上半身の急なほてり・寝汗がつらい</text><circle cx="76" cy="351" r="5" fill="#c98b5b"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">理由のないイライラや不安感、気分の落</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ち込みがある</text><circle cx="76" cy="417" r="5" fill="#c98b5b"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">眠りが浅く、日中の強い疲労感や動悸に</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">悩んでいる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">更年期障害は閉経前後10年（45〜55歳前後</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）に卵巣機能が低下し、エストロゲンやプロゲス</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">テロンが急減することで生じます。脳の視床下部</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や下垂体からの指令に卵巣が応じられず自律神…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 婦人科でのホルモン補充療法（HRT）や</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">漢方治療との併用を前提に、百会・子宮穴・三陰</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">交・陰陵泉へ施術し自律神経と血流を整えます </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">/ 2. イライラや不安などの七情に合わせ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>