<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="感染性心内膜炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">感染性心内膜炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">血液中の細菌が心臓の弁や心内膜に病巣をつくる重篤な感染症です。専門医での</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">抗菌薬治療を最優先し、回復後の体調管理を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">原因のわからない発熱や悪寒が続いてい</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る</text><circle cx="76" cy="375" r="5" fill="#c48a47"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い全身のだるさや食欲低下がある</text><circle cx="76" cy="417" r="5" fill="#c48a47"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">息切れや動悸、胸の不快感を感じる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">口腔内や皮膚・腸内などから血液中に入り込んだ</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">細菌や真菌が、心臓の弁や心内膜の小さな傷に付</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">着して疣贅（ゆうぜい）と呼ばれる病巣をつくる</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">病気です。炎症により心臓の弁が破壊されたり…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 感染性心内膜炎は命に関わる重篤な感染症</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">のため、発熱・炎症がある急性期および抗菌薬治</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">療中・経過不安定時は鍼灸禁忌であり、速やかに</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">循環器内科等での標準治療を受けていただきま…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>