<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="好酸球性副鼻腔炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">好酸球性副鼻腔炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">両側の鼻茸や嗅覚障害を繰り返しやすい指定難病の慢性副鼻腔炎です。専門医の</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">管理を最優先に安定期の体調を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い鼻詰まりと嗅覚低下が続いている</text><circle cx="76" cy="351" r="5" fill="#c28b3b"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">粘り気の強い鼻汁が長期間止まらない</text><circle cx="76" cy="393" r="5" fill="#c28b3b"/><text x="92" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">鼻茸の手術や薬の後も再発を繰り返して</text><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">好酸球性副鼻腔炎は、白血球の一種である好酸球</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が鼻粘膜に過剰に集まり、両側の鼻腔に多発性の</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">鼻茸（ポリープ）や粘稠な鼻汁、嗅覚障害を引き</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">起こす指定難病です。はっきりとした発症原因…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による標準治療と定期管理を最優先</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、安定期・主治医許可のもとで鼻通・天迎香</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・印堂などのツボを用いて鼻周囲の巡りをサポー</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">トします / 2. 症状の長期化に伴うスト…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>