<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="血栓症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">血栓症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">血管内に血の塊ができて血流を塞ぐ病気です。急性期は救急・専門治療を最優先</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">し、安定期の予防と体調管理をサポートします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">片側の脚の急な腫れや痛み、張りがある</text><circle cx="76" cy="351" r="5" fill="#c48a47"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">長時間のデスクワークや移動で下肢がむ</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くみやすい</text><circle cx="76" cy="417" r="5" fill="#c48a47"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">息切れや胸の痛み、手足のしびれ・麻痺</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がないか不安である</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">血液の流れの停滞、血管内壁の傷、血液が固まり</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">やすい体質や生活習慣病などが重なり、血管の中</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に血栓（血の塊）ができる病気です。血栓がその</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">場で血管を塞いで末梢の循環不全を起こすほか…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 血栓の急性期や疑いがある段階、および血</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">栓が存在する部位への直接刺激・強いマッサージ</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は塞栓を誘発する危険があるため厳禁とし、循環</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">器内科や救急での薬物療法等を最優先とします…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>