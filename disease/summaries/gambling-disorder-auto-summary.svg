<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ギャンブル依存症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ギャンブル依存症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">脳の報酬系の偏りによりギャンブル行動を制御できなくなる依存症。専門医療機</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">関・自助グループでの支援を最優先に、心身の過緊張を補完ケアします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">やめようと思ってもギャンブルへの衝動</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を止められない</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">負けを取り戻そうとして借金や嘘を重ね</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">一人で抱え込んでいる</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い罪悪感や不安・イライラから不眠や</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">動悸・胃痛が続いている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ギャンブル依存症は、脳の報酬系やストレス対処</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の偏りにより、経済的・社会的な悪影響が生じて</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">もギャンブル行動を制御できなくなる精神疾患で</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す。我慢強く一人で問題を抱え込みやすい人ほ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 依存症専門医療機関・相談機関・自助グル</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ープでの治療と回復支援を最優先とし、重度抑う</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">つや希死念慮がある時期は専門医療を優先して施</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">術対象外とします / 2. 主治医の許可と…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>