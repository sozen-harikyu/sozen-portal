<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="膵石症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">膵石症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">膵管内に結石が生じ、食後や飲酒後の上腹部・背部痛や消化不良を引き起こす疾</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">患です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食後や飲酒後に上腹部から背中にかけて</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強く痛む</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">前かがみや脇腹を抱えると痛みが和らぐ</text><circle cx="76" cy="417" r="5" fill="#c49342"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腹部膨満感や下痢、脂肪便などの消化不</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">良が続く</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性膵炎の経過中に主膵管や分枝膵管の内部に白</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">く硬い結石が形成され、膵管や膵組織の内圧が高</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まることで痛みが生じます。背景の大半は慢性膵</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">炎で、原因の約7割をアルコールが占めるとさ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. まずは消化器内科など専門医療機関での検</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">査・治療（禁酒・食事管理・薬物療法・内視鏡や</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手術等）を最優先とし、主治医の方針を確認しま</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す / 2. 医療管理下の補完ケアとして、…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>