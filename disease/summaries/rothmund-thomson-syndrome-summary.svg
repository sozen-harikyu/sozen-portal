<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ロスムンド・トムソン症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ロスムンド・トムソン症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">DNA修復に関わる遺伝子異常により光線過敏や皮膚萎縮、若年性白内障などが</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">起こる希少疾患です。遮光と定期検診が最優先です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">日光を浴びると皮膚が赤く腫れたり湿疹</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">のようになりやすい</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">顔や手足の皮膚の萎縮や乾燥・敏感さが</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気になっている</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">骨格の異常や低身長、若年性の白内障な</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">どを専門医で経過観察中</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ロスムンド・トムソン症候群は、DNAの複製や</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">修復を担うRECQL4遺伝子などの変異によっ</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">て発症する極めて希少な遺伝性疾患です。乳児期</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">からの顔面・四肢の紅斑や皮膚萎縮、強い光線…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 皮膚科・眼科・整形外科などの定期受診と</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がんスクリーニング、日々の厳格な紫外線遮光対</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">策を最優先とします / 2. 敏感で萎縮しや</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すい皮膚への直接刺激や強い摩擦を避け、主治…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>