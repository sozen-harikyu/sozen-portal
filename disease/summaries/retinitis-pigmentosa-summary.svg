<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="網膜色素変性症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3b5c"/>
      <stop offset="100%" stop-color="#2b5887"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#4f86b8"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">眼のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">網膜色素変性症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">遺伝要因で視細胞が徐々に変性する指定難病です。眼科での経過観察と保護ケア</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">を基本に、主治医許可下で眼精疲労や血流を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#4f86b8"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">夕方以降や暗い場所で物が見えにくい（</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">夜盲）</text><circle cx="76" cy="375" r="5" fill="#4f86b8"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">周囲の視野が少しずつ狭くなってきたと</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">感じる</text><circle cx="76" cy="441" r="5" fill="#4f86b8"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">明るい場所での強いまぶしさや暗順応の</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">しにくさがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">光を電気信号に変える網膜の視細胞（主に暗所視</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を担う桿体細胞）や網膜色素上皮細胞に関わる遺</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">伝子の変異によって、視細胞が緩やかに変性・減</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">少していく遺伝性・進行性の指定難病です。発…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3b5c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 眼科専門医での定期的な視野・眼底検査、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">遮光眼鏡や補助具の活用、難病医療費助成などの</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">標準サポートを最優先とします / 2. 主治</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">医の許可を得た安定期の補完的ケアとして、見…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>