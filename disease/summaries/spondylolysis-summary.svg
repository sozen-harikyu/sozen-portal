<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="脊椎分離症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">脊椎分離症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">腰椎の疲労骨折で起こる腰痛。安静や医療連携を基本に、腰周囲の筋緊張緩和と</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">再発予防をサポートします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">背中を後ろに反らすと腰が痛む</text><circle cx="76" cy="351" r="5" fill="#c58b3c"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">狭い範囲に響くような腰痛が2週間以上</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">続いている</text><circle cx="76" cy="417" r="5" fill="#c58b3c"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">長時間の立ち姿勢や体を横に倒すと痛み</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が強まる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主に第4・第5腰椎の椎間関節基部の骨が分離す</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る状態です。有力な原因は、腰の曲げ伸ばしや回</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">旋動作の繰り返しによる疲労骨折とされ、成長期</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">（小学生〜高校生）の野球・サッカー・バレー…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. まず整形外科での画像診断・保存療法（安</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">静やコルセット装着）を優先しつつ、現在の回復</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">段階を確認 / 2. 分離部に負担をかけない</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">範囲で腰部や股関節周囲の過緊張を緩め、血流…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>