<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="切れ痔の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">切れ痔</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">硬い便やいきみで肛門の皮膚が裂ける状態です。肛門外科での標準治療を基本に</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">、便秘改善と天枢・大巨・便秘点のツボケアで再発を防ぎます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">排便時に肛門が切れるような鋭い痛みが</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">あり、食後や排便後も続きます</text><circle cx="76" cy="375" r="5" fill="#b58b45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">排便後にトイレットペーパーに少量の鮮</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">やかな血が付きます</text><circle cx="76" cy="441" r="5" fill="#b58b45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頑固な便秘や硬い便、あるいは頻繁な下</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">痢を繰り返しています</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">切れ痔（裂肛）は、知覚神経が豊富に通う肛門の</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">皮膚が排便時に裂けることで強い痛みを生じる疾</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">患で、20〜50代や女性に多くみられます。最</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">大の原因は便秘や硬い便、過度ないきみですが…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 強い痛みや出血が続く場合、慢性化・肛門</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">狭窄が疑われる場合は肛門外科での診察や軟膏・</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">便通軟化剤などの標準治療を優先し、並行して再</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発予防の体質ケアを行います / 2. 胃腸…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>