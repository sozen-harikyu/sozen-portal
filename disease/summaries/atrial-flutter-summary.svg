<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="心房粗動の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">心房粗動</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">心房内に異常な電気回路ができ拍動が速くなる不整脈です。循環器内科の標準治</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">療を最優先に、安定期には内関等で自律神経を整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">運動していないのに動悸や脈の速さを感</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">じる</text><circle cx="76" cy="375" r="5" fill="#c48a47"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">息切れや倦怠感、脱力感が出やすい</text><circle cx="76" cy="417" r="5" fill="#c48a47"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胸の違和感や圧迫感、めまいを感じるこ</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">心臓の心房内に異常な電気の旋回回路が形成され</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ることで、通常より心拍が速くなる不整脈です。</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">右心房の三尖弁周囲を回る通常型と、心臓手術後</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">などに起こる非通常型があります。加齢、高血…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 発作中や強い息切れ・胸痛・めまい・失神</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がある場合は直ちに循環器内科・救急受診を最優</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">先とし、抗凝固薬による脳梗塞予防や薬物療法・</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">カテーテルアブレーションを妨げない方針を徹…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>