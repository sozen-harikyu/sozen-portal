<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="慢性腎臓病（CKD）の腎機能指標・症状補助ケアの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">慢性腎臓病（CKD）の腎機能指標・症</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">状補助ケア</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">慢性腎臓病（CKD）の腎臓内科管理を最優先としつつ、かゆみ・倦怠感・自律</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">神経の乱れを穏やかに支える補助的な鍼灸ケア。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性腎臓病（CKD）で通院中だが、皮</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膚のかゆみやだるさがつらい ・血圧…</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性腎臓病（CKD）では腎機能の緩やかな低下</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に伴い、体液・電解質バランスの乱れや尿毒症関</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">連の掻痒感、倦怠感、身体機能低下が生じやすく</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なります。2024年の24研究（計1,49…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腎臓内科専門医による血圧・血糖管理、食事療法</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、薬物療法が絶対の基盤です。鍼灸は決して標準</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療に代わるものではなく、安定期の症状緩和・</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">自律神経調整の補助として、足三里・太渓・三…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>