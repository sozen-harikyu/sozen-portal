<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="複合性局所疼痛症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">複合性局所疼痛症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">外傷や手術後に焼けるような痛みと皮膚・自律神経変化が続くCRPSに対し、</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">医療・リハビリと併用する補完ケア解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">怪我や手術の後から、手足に焼けるよう</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な・うずくような強い痛みが続いている</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">衣服が軽く触れただけや気温変化、スト</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">レスで激しい痛みが出る</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">患部の皮膚の色・温度が変わったり、腫</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れや発汗異常が見られる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">外傷・骨折（ギプス固定後など）や手術をきっか</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">けに、末梢神経や中枢神経の痛み信号処理が過敏</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">化する神経障害性疼痛です。明確な神経損傷がな</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">い「1型（旧RSD）」と神経損傷を伴う「2…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 医療機関での薬物療法・神経ブロック・リ</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ハビリ（理学療法やミラーセラピー等）を基本と</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">し、補完的ケアとして連携 / 2. 患部への</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">過度な刺激を避けつつ、自律神経の安定と血流…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>