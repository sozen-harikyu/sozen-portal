<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="胃・十二指腸潰瘍の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">胃・十二指腸潰瘍</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">胃酸により胃や十二指腸の粘膜が深く傷つく疾患。医療治療を最優先に、再発予</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">防と自律神経ケアを補完します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食中・食後や空腹時にみぞおちが痛む</text><circle cx="76" cy="351" r="5" fill="#c49342"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胸やけ・胃もたれ・吐き気・食欲不振が</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">続いている</text><circle cx="76" cy="417" r="5" fill="#c49342"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強いストレスが続いて胃の不調を繰り返</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">しやすい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胃酸やペプシンなどの攻撃因子と、胃粘液などの</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">防御因子のバランスが崩れ、胃や十二指腸の粘膜</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が消化されて深く傷つく疾患です。主な原因はピ</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ロリ菌感染、消炎鎮痛剤（NSAIDs）の副…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 医療機関での内視鏡診断・薬物治療・ピロ</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">リ菌除菌を最優先とし、吐血や黒色便・激痛など</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">出血・穿孔徴候がある場合は直ちに受診をご案内</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> / 2. 医師の管理下で安定した状態や再…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>