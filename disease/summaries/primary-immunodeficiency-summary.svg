<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="原発性免疫不全症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">原発性免疫不全症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">生まれつき免疫系に欠陥があり感染症を繰り返しやすい約300疾患の総称（指</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">定難病）です。専門医の感染管理を絶対最優先とします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">肺炎や中耳炎・副鼻腔炎・皮膚感染など</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を繰り返し重症化しやすい</text><circle cx="76" cy="375" r="5" fill="#c48a47"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">免疫グロブリン補充療法や抗菌薬などの</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">専門治療を受けている</text><circle cx="76" cy="441" r="5" fill="#c48a47"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">感染症予防のため日常生活で衛生管理を</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">徹底している</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">原発性免疫不全症候群は、B細胞・T細胞・NK</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">細胞・好中球など免疫を担う細胞に関わる約30</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">0種類の遺伝子異常により、生まれつき免疫機能</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が十分に働かない指定難病の総称です。肺炎や…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による抗菌薬・抗ウイルス薬管理、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">免疫グロブリン補充療法、造血幹細胞移植などの</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">標準治療と手洗いうがい・生もの回避等の感染予</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">防を絶対最優先とします / 2. 免疫低下…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>