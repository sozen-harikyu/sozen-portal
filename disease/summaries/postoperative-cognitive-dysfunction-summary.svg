<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="術後認知機能障害・術後せん妄（POCD）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#304373"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">脳神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">術後認知機能障害・術後せん妄（POC</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">D）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">手術後のぼんやり感・睡眠の乱れ・回復遅延に対し、自律神経と神経炎症の鎮静</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">を支える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">高齢のご家族が手術後からぼんやりしや</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すい・夜眠れなくなった</text><circle cx="76" cy="375" r="5" fill="#c48f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・退院後も手術前のシャキッとした生活</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">リズムに戻りにくい</text><circle cx="76" cy="441" r="5" fill="#c48f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・主治医の経過観察とあわせて回復を後</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">押しできる安全なケアを知りたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手術侵襲に伴う全身性炎症（IL-6・TNF-</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">α上昇）と神経炎症・睡眠覚醒リズムの乱れが関</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">与します。2023年のメタ解析（12研究・n</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">=1,058：PMC10155419）では…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 退院後・主治医の許可を得たうえで、百会</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・神門・足三里など自律神経と睡眠を整える低刺</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">激施術を実施 / 2. 術後の痛み・こわばり</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・食欲低下など、脳の疲労を強める身体ストレ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>