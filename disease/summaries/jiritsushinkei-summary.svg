<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="自律神経失調症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#243b6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">特に対応することが多い症状｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">自律神経失調症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">交感神経と副交感神経のバランス崩れによる不眠・倦怠感・めまい・胃腸不調を</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">、体と神経の両面から整える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf5eb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">寝つきが悪い、眠りが浅く朝スッキリ起</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">きられない</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・原因不明の倦怠感、めまい、頭痛、動</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">悸、息切れが続いている</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・腹痛・下痢・便秘（過敏性腸症候群）</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や異常な発汗・冷えがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf5eb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">呼吸・血流・消化・睡眠を司る交感神経（活動）</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">と副交感神経（休息）の切り替えがうまくいかな</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くなる状態です。精神的ストレスだけでなく、睡</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">眠不足・生活リズムの乱れ・ホルモン変動・首…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf5eb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. お腹や体表のサインから、交感神経優位・</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">副交感神経優位・実証／虚証などの体の状態を見</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">極める / 2. 福田安保理論に基づく自律神</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">経調整と、背面や頭皮・深層筋の緊張緩和（必…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>