<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="糖尿病性胃不全麻痺（胃麻痺）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">内分泌のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">糖尿病性胃不全麻痺（胃麻痺）</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">糖尿病に伴う胃の動きの低下（胃排出遅延）に対し、血糖管理と併用して胃腸を</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">支える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">糖尿病の治療中、食後の強い膨満感・胃</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">もたれ・吐き気が続く</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・少ししか食べられないのに胃に食べ物</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がずっと残っている感じがする</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・消化管運動改善薬だけでは症状が落ち</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">着きにくい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">高血糖の長期持続による迷走神経（自律神経）障</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">害が胃の排出機能を低下させます。単盲検クロス</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">オーバー試験（PubMed 25689986</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）やメタ解析（PubMed 2420692…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 糖尿病専門医の血糖コントロールと食事療</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">法を絶対前提に、迷走神経と胃腸経穴を低刺激で</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">調整 / 2. 糖尿病性末梢神経障害や感染リ</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">スクに配慮し、衛生管理と皮膚観察を徹底 /…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>