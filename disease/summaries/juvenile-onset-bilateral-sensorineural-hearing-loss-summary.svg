<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="若年発症型両側性感音難聴の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">若年発症型両側性感音難聴</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">40歳未満で発症し両耳の難聴が徐々に進行する指定難病です。耳鼻科の定期管</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">理を最優先に、耳鳴りやめまい感・首肩の緊張を補完的にケアします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">40歳未満から両耳の聞こえにくさが少</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">しずつ進んでいる</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">音楽や鳥の声など高い周波数の音が聞き</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">取りにくい</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">難聴に伴って耳鳴りやめまいを感じるこ</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">若年発症型両側性感音難聴は、40歳未満の若い</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">年齢で発症し、両側の感音性難聴が緩やかに進行</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">する指定難病です。特定の遺伝子変異などの遺伝</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">的・先天的要因が原因とされ、遺伝子検査で原…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 公式サイトで紹介している聴宮・耳門・頭</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">竅陰などのツボを活用し、耳周囲の血流と耳鳴り</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・めまい感の緩和を目指します / 2. 聞き</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">取りの集中による側頭部・首肩の深層筋の疲労…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>