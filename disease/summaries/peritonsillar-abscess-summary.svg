<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="扁桃周囲膿瘍の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">扁桃周囲膿瘍</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">扁桃炎が悪化し周囲に膿が溜まる緊急性の高い感染症です。気道閉塞・敗血症リ</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">スクのため急性期鍼灸は絶対禁忌で、完治後の再発予防のみ対応します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">左右どちらかの喉に激しい痛みと強い腫</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れがあり飲み込めない</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">高熱が出て口が開きにくい（開口障害）</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">または声がこもる</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">息苦しさやつばも飲み込めないほどの痛</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">みがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">扁桃周囲膿瘍は、扁桃炎や扁桃周囲炎が改善しな</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いまま周囲の組織へ波及し、膿の袋（膿瘍）が形</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">成された危険な状態です。20〜30代に多く、</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">激しい片側の咽頭痛、高熱、嚥下痛、開口障害…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 扁桃周囲膿瘍の疑い・発症中・治療中の急</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性期は気道閉塞や敗血症の危険があるため鍼灸は</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">絶対禁忌とし、直ちに耳鼻咽喉科救急の受診を強</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くご案内します / 2. 医療機関での排膿…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>