<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="傾眠の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">傾眠</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">うとうとと眠り込みやすい軽度の意識障害の状態です。原因疾患の医療的精査を</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">最優先とし、安定期の体調・自律神経を補完的に整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">日中にうとうとして声をかけないと目が</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">覚めにくい</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食事中や会話中に急に眠り込んでしまう</text><circle cx="76" cy="417" r="5" fill="#a9844f"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食欲低下や水分不足、体力の衰えが気に</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なっている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">傾眠は、肩を叩く・呼びかけるといった軽い刺激</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で覚醒するものの、すぐ再び眠り込んでしまう軽</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">度の意識障害です。原因は脱水、認知症、内科疾</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">患、慢性硬膜下血腫、過眠症、食後低血圧、抗…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 医師の診断・治療を前提としたうえで合谷</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・中衝・太陽などを用い覚醒感と巡りを整える施</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">術 / 2. 首肩のこりや眼精疲労、全身の倦</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">怠感を和らげ日中の活動リズムを支えるケア …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>