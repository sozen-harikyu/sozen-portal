<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="帯状疱疹急性期疼痛（後遺症予防併用）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272643"/>
      <stop offset="100%" stop-color="#3d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b88a44"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">帯状疱疹急性期疼痛（後遺症予防併用）</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">皮膚科での抗ウイルス薬治療を最優先に、帯状疱疹の強い痛みと後遺症予防を支</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b88a44"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">皮膚科で帯状疱疹と診断され抗ウイルス</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">薬を飲んでいるが痛みが強い</text><circle cx="76" cy="375" r="5" fill="#b88a44"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・ピリピリ・ズキズキした神経痛で夜眠</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れない</text><circle cx="76" cy="441" r="5" fill="#b88a44"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・帯状疱疹後神経痛（PHN）に移行す</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">るのをできるだけ防ぎたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">水痘・帯状疱疹ウイルスの再活性化による神経節</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">炎症が激しい痛みを引き起こします。複数のメタ</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">解析（11 RCTs・n=1,156等）では</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、標準治療と併用した鍼灸により疼痛軽減・後…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 皮膚科での早期抗ウイルス薬治療を絶対最</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">優先とし、水疱・びらん部への直接刺激を厳格に</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">回避 / 2. 該当神経節周囲の安全な部位と</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">遠位経穴で神経炎症後の循環と鎮痛系をサポー…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>