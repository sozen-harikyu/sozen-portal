<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="クロンカイト・カナダ症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">クロンカイト・カナダ症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">胃や大腸に多数のポリープが生じる非遺伝性の難病。専門医の継続管理下で疲労</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">感や自律神経を補完ケアします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性的な下痢や腹部の違和感が長引いて</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">いる</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">栄養吸収の低下に伴う体重減少や強い倦</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">怠感がある</text><circle cx="76" cy="441" r="5" fill="#c49342"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脱毛や皮膚の色素沈着・爪の変化など全</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">身症状が気になる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主に胃や大腸などの消化管に多数のポリープが形</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">成される非遺伝性の消化管腫瘍性疾患です。慢性</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">的な下痢や腹部の違和感に加え、脱毛や皮膚の色</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">素沈着、爪の変形・変色など皮膚付属器にも特…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 消化器専門医での副腎皮質ステロイド治療</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や栄養管理・定期内視鏡検査を最優先とし、感染</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">予防や服薬状況を確認します / 2. 体力低</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下や栄養状態に配慮した低刺激の鍼灸で、首肩…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>