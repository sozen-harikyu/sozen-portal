<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="アトピー性皮膚炎の3ステップ要点図解">
  <defs>
    <linearGradient id="hdrA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="52" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip2"><rect x="440" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip3"><rect x="828" y="330" width="320" height="140"/></clipPath>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#faf8f4"/>
  <rect width="1200" height="148" rx="24" fill="url(#hdrA)"/>
  <rect y="120" width="1200" height="28" fill="url(#hdrA)"/>
  <rect x="48" y="28" width="248" height="28" rx="14" fill="#c28f45"/>
  <text x="172" y="47" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" font-weight="700" fill="#ffffff">皮膚のお悩み｜3ステップ図解</text>
  <text x="1152" y="47" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="48" y="106" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">アトピー性皮膚炎の整理と施術方針</text>

  <rect x="44" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="212" cy="242" r="34" fill="#faf5eb" stroke="#c28f45" stroke-width="2"/>
  <text x="212" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#c28f45">01</text>
  <text x="212" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#3c3a2a">よくあるサイン</text>
  <line x1="84" y1="322" x2="340" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip1)"><text x="66" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・夜間や起床時、ストレスがか…</text><text x="66" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・額・目口耳の周り・首・脇・…</text><text x="66" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・赤み・浸出液・皮膚のめくれ…</text></g>
  <rect x="72" y="478" width="280" height="44" rx="12" fill="#faf8f2"/>
  <text x="212" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#3c3a2a">まず原因部位を丁寧に見極め</text>

  <polygon points="392,365 416,350 416,380" fill="#c28f45" transform="rotate(180 404 365)"/>

  <rect x="432" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="600" cy="242" r="34" fill="#faf8f2" stroke="#3c3a2a" stroke-width="2"/>
  <text x="600" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#3c3a2a">02</text>
  <text x="600" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#3c3a2a">体の中で起きていること</text>
  <line x1="472" y1="322" x2="728" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip2)"><text x="454" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・角質層の乾燥による皮膚バリ…</text><text x="454" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・免疫システムの過剰反応が重…</text><text x="454" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・遺伝的素因に加え</text></g>
  <rect x="460" y="478" width="280" height="44" rx="12" fill="#faf5eb"/>
  <text x="600" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#8c6239">神経・血流・筋緊張から整理</text>

  <polygon points="780,365 804,350 804,380" fill="#c28f45" transform="rotate(180 792 365)"/>

  <rect x="820" y="182" width="336" height="366" rx="20" fill="#3c3a2a"/>
  <circle cx="988" cy="242" r="34" fill="#c28f45"/>
  <text x="988" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#ffffff">03</text>
  <text x="988" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#ffffff">当院の鍼灸アプローチ</text>
  <line x1="860" y1="322" x2="1116" y2="322" stroke="#ffffff33" stroke-width="2"/>
  <g clip-path="url(#clip3)"><text x="842" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・皮膚科でのステロイド外用や…</text><text x="842" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・保湿などの標準治療を基本とし</text><text x="842" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・自分の力で免疫の暴走を落ち…</text></g>
  <rect x="848" y="478" width="280" height="44" rx="12" fill="#c28f45"/>
  <text x="988" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">段階的に回復と安定を目指す</text>

  <text x="600" y="592" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>