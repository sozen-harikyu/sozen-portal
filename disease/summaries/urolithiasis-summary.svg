<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="尿路結石の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">尿路結石</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">腎臓から尿道までの尿路に結石ができる病気です。激痛発作や発熱・水腎症合併</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">時は救急・泌尿器科を最優先に、安定期の巡りケアを補完します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">背中やわき腹、下腹部に2〜3時間続く</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">波のある痛みを感じます</text><circle cx="76" cy="375" r="5" fill="#b58b45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">血尿や吐き気、下部結石による頻尿・残</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">尿感が気になります</text><circle cx="76" cy="441" r="5" fill="#b58b45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">健康診断で結石を指摘され、再発や痛み</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の発作が不安です</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">尿路結石は、腎臓・尿管・膀胱・尿道からなる尿</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">路にミネラルや有機物の結石ができる病気で、男</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性40代・女性50代に多く、日本人の95%以</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">上は腎臓や尿管の上部尿路結石です。先天異常…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 激しい痛み発作や発熱、水腎症・腎機能低</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下が疑われる場合は救急・泌尿器科受診を最優先</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、自然排石の経過観察期や砕石後の安定期に</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主治医の許可のもとで補完的ケアを行います …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>