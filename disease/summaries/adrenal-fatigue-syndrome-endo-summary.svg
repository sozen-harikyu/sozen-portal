<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="副腎疲労症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">内分泌のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">副腎疲労症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">慢性的なストレスや過労で心身の回復力が落ち強い疲労感が続く状態。内科疾患</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">の除外を確認しつつ、生活リズムと自律神経を整える鍼灸で支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">朝どうしても起きられず午前中がつらい</text><circle cx="76" cy="351" r="5" fill="#b68d40"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">しっかり寝ても疲れが抜けず強い倦怠感</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が続く</text><circle cx="76" cy="417" r="5" fill="#b68d40"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気力の低下・イライラ・不安感や集中力</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">低下がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">慢性的な精神的・身体的ストレスや睡眠不足、栄</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">養の偏りが長く続くことで、ストレス応答や自律</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">神経・神経伝達物質（セロトニン、ノルアドレナ</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">リン、ドーパミン等）のバランスが乱れ、強い…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 強い倦怠感の背景にアジソン病・甲状腺機</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">能低下症・貧血・うつ病など治療を要する疾患が</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">隠れていないか医療機関での血液検査・診察を最</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">優先とし、器質的疾患除外後の補完ケアとして…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>