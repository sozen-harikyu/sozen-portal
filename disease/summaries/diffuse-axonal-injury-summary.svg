<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="びまん性軸索損傷の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">びまん性軸索損傷</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">交通事故や転落などの強い衝撃で脳の神経線維（軸索）が広範囲に損傷し、意識</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">障害や後遺症を残す頭部外傷です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭部外傷後の後遺症として手足の麻痺や</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">運動機能の低下がある</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">記憶障害や注意力の低下など高次脳機能</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">障害が続いている</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">情緒不安定や不安感、意欲低下などの情</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">動変化に悩んでいる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">転倒・転落や自動車事故などの高エネルギー頭部</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">外傷、乳幼児の揺さぶられっ子症候群などで頭部</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に急激な回転力や加減速が加わることで発症しま</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す。脳の表部と深部が異なる速度で動いてねじ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 急性期・回復期ともに脳神経外科などの専</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">門医療機関での救命管理・薬物療法・リハビリテ</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ーションを最優先にご案内 / 2. 症状が安</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">定した段階では、主治医の許可のもと運動麻痺…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>