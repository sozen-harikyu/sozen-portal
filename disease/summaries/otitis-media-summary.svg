<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="中耳炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">中耳炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">鼓膜の奥の中耳に炎症が起きる中耳炎。急性期は耳鼻咽喉科受診を最優先に、回</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">復期や繰り返す不調の補完的ケアを行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">風邪のあとに耳の痛みや詰まった感じが</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">出やすい</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">音がこもって聞こえにくい状態が気にな</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">中耳炎を繰り返して慢性化しないか不安</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">中耳炎は、鼻や喉と耳をつなぐ耳管を経由して細</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">菌やウイルスが中耳に入り込み、炎症を起こす病</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気です。耳管が短い子どもに多いものの、大人で</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">も風邪による鼻や喉の炎症から発症します。急…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 急性期の強い耳痛・発熱・膿性耳だれがあ</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">る場合は耳鼻咽喉科での治療を最優先とし、炎症</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が落ち着いた回復期や慢性期の体調管理として補</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">完的に施術を行います / 2. 公式サイト…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>