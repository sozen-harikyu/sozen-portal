<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ニューモシスチス肺炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ニューモシスチス肺炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">免疫低下時に発症する重篤な真菌性肺炎（PCP）です。専門医療機関での抗微</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">生物薬治療が絶対最優先（急性期は鍼灸禁忌）で、回復後のみ主治医許可下で…</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">免疫抑制薬やステロイド使用中・免疫低</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下状態で乾いた咳や息切れが出た（直…</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発熱と進行する呼吸困難がある</text><circle cx="76" cy="417" r="5" fill="#c28b3b"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ニューモシスチス肺炎の治療・退院後も</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">体力低下や倦怠感が長引いている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ニューモシスチス肺炎（PCP）は、真菌の一種</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">であるニューモシスチス・イロベチイによって引</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">き起こされる日和見感染症です。免疫力が正常な</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">人では通常発症しませんが、ステロイド・免疫…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 発熱・咳・呼吸困難がある急性期や入院治</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">療中は専門医療機関での抗微生物薬・酸素治療が</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">絶対最優先であり、鍼灸施術は禁忌となります </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">/ 2. 感染症が治癒し呼吸状態と免疫状態…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>