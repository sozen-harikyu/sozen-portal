<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="薬物依存症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">薬物依存症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">脳の報酬系の変化により薬物使用を制御できなくなる精神疾患。専門医療機関・</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">回復支援を絶対最優先とし、回復安定期の体調ケアを補完します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">処方薬・市販薬・違法薬物などをやめた</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くても自分で制御できない</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">減量や中断時に不眠・強い不安・発汗・</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">震えなどの離脱症状が出る</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">孤立や家族関係の悪化など社会生活に大</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">きな支障が生じている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">薬物依存症は、違法薬物だけでなく睡眠薬・抗不</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">安薬などの処方薬や市販の鎮痛薬・咳止め薬の反</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">復使用によって脳の報酬系に変化が生じ、強い渇</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">望と使用制御の困難をきたす精神疾患です。中…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 依存症専門医療機関・精神保健福祉センタ</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ー・自助グループでの標準治療と離脱管理を絶対</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">最優先とし、急性中毒期・離脱症状期・精神症状</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">不安定時は施術対象外とします / 2. 専…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>