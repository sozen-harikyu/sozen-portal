<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="軟骨低形成症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">軟骨低形成症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">FGFR3遺伝子の異常などを原因とし、軟骨無形成症より軽度の四肢短縮型低</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">身長や関節・脊椎の異常を呈する先天性疾患です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">近位部優位の四肢短縮や低身長がある</text><circle cx="76" cy="351" r="5" fill="#c58b3c"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膝・肘・手首・指などに関節痛や可動域</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の制限を感じる</text><circle cx="76" cy="417" r="5" fill="#c58b3c"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脊柱側弯や脊柱管狭窄症など背骨のトラ</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ブルがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">かつて軟骨無形成症とまとめて軟骨異栄養症と呼</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ばれていた先天性の骨系統疾患で、症状が軽い場</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">合が軟骨低形成症とされます。原因の多くはFG</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">FR3遺伝子などの変異（常染色体優性遺伝や…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医療機関での定期評価、成長ホルモン</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">補充や必要に応じた整形外科・耳鼻科・呼吸管理</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・遺伝カウンセリング等の総合ケアを最優先にご</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">案内 / 2. 主治医の管理下において、関…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>