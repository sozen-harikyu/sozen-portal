<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="発作性・持続性心房細動（再発予防補助）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">発作性・持続性心房細動（再発予防補助</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">循環器内科の標準治療を前提に、自律神経の乱れから起きる動悸・不安と再発予</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">防を支える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">循環器内科で心房細動と診断され、内服</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">やアブレーション後の経過観察中</text><circle cx="76" cy="375" r="5" fill="#c48a47"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・疲労や睡眠不足・ストレスが重なると</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脈の乱れや不安が強くなる</text><circle cx="76" cy="441" r="5" fill="#c48a47"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・標準治療を続けながら自律神経と睡眠</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の土台を整えたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">心房の電気的・構造的リモデリングに加え、交感</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">神経・迷走神経バランスの急変が発作の引き金に</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なります。2024年の系統的レビュー・メタ解</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">析（PMC11608700）および除細動後…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 循環器専門医の継続受診・抗凝固薬等の処</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">方厳守を絶対前提として補助施術を実施 / 2</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">. 内関（PC6）・神門・背部経穴を中心に自</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">律神経の揺らぎと胸郭の緊張を穏やかに調整 …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>