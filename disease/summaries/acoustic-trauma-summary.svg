<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="音響外傷の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">音響外傷</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">大音量の曝露で内耳が傷つく音響外傷。急性期は早期の耳鼻咽喉科受診と安静を</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">最優先に、耳の血流を促す補完的ケアを行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ライブや大音量イヤホンのあとにキーン</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">という耳鳴りが続く</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">耳が詰まった感じや高音域の聞こえにく</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">さがある</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">普段の生活音が異常に大きく響く聴覚過</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">敏がつらい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">音響外傷（騒音性難聴）は、コンサートやフェス</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、爆発音、大音量でのイヤホン・ヘッドホン長時</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">間使用などにより、内耳の蝸牛にある有毛細胞が</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">障害されて起こる難聴・耳鳴りです。一度大き…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 発症直後の急性期は耳鼻咽喉科での早期受</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">診と処方薬の継続・静かな環境での安静を最優先</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、医師の治療と並行または回復期の補完的ケ</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">アとして施術します / 2. 公式サイトの…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>