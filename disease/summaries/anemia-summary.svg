<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="貧血の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2230"/>
      <stop offset="100%" stop-color="#6d3448"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48a47"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">循環器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">貧血</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">血液中のヘモグロビンが不足して全身が酸欠状態になる症状です。医療機関での</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">検査と食事改善を基本に、鍼灸で血行と自律神経を整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48a47"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い疲労感や倦怠感が抜けない</text><circle cx="76" cy="351" r="5" fill="#c48a47"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">少し動くだけで息切れや動悸がする</text><circle cx="76" cy="393" r="5" fill="#c48a47"/><text x="92" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">立ちくらみやめまい、顔色の悪さが気に</text><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">貧血は単一の病名ではなく、酸素を運ぶ赤血球中</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">のヘモグロビンが減少し全身が酸欠になった状態</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">です。成人女性の約4人に1人にみられる鉄欠乏</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性貧血が代表的で、月経や消化管からの過度な…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f6"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4b2230">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. まず医療機関での血液検査や必要に応じた</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">鉄剤治療（貯蔵鉄回復のため2〜3カ月の継続）</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を優先しつつ、全身の巡りを整えます / 2.</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> 血海・三陰交・手心（手のひら中央）など血…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>