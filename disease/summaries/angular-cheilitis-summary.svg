<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="口角炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">口角炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">唇の両端に炎症や亀裂、出血が起きる身近なトラブルです。薬物治療と保湿に加</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">え、胃腸や免疫力を整えるツボケアで再発を防ぎます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">口を大きく開けると唇の両端が裂けて痛</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">みや出血が出る</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">口角のただれや赤い腫れ、かさぶたを何</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">度も繰り返している</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">疲れや睡眠不足、胃腸の不調が続くとす</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ぐに口角が荒れる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">口角炎は、皮膚が薄く唾液でふやけやすい口角の</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">バリア機能が低下し、カンジダなどの真菌感染や</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">黄色ブドウ球菌などの細菌感染、ビタミンB2・</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">B6や鉄分の不足、乾燥や舐める癖、義歯や化…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. カンジダや細菌感染が疑われる場合は皮膚</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">科・歯科での外用薬治療を基本とし、繰り返す背</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">景にある免疫力低下や疲労を鍼灸で整えます /</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> 2. 血行と新陳代謝を促す偏歴、胃腸の消…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>