<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="整形外科術後回復・関節拘縮予防（リハビリ併用）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">整形外科術後回復・関節拘縮予防（リハ</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ビリ併用）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">整形外科手術後の関節のこわばりや長引く痛みを防ぎ、リハビリと社会復帰を後</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">押しする解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">骨折や関節の手術後、関節が硬く動かし</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">にくい（拘縮）のが心配</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・退院後のリハビリで痛みが強く、思う</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ように可動域が広がらない</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・手術後の痛みが慢性化するのを防ぎ、</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">早く元の生活に戻りたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">術後の局所炎症・腫脹と防御性筋収縮により関節</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">周囲の軟部組織が癒着・硬化しやすくなります。</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">2025年のRCT（n=110：PMC124</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">40497）では、通常リハビリへの鍼灸・手…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 整形外科主治医の許可とリハビリ計画を前</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">提に、手術創・金属固定部には触れず周囲筋と遠</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">位経穴を調整 / 2. リハビリ前の過度な筋</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">緊張と疼痛を和らげ、可動域訓練を進めやすい…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>