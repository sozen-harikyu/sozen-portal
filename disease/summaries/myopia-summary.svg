<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="近視の3ステップ要点図解">
  <defs>
    <linearGradient id="hdrA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3b5c"/>
      <stop offset="100%" stop-color="#2b5887"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="52" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip2"><rect x="440" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip3"><rect x="828" y="330" width="320" height="140"/></clipPath>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#faf8f4"/>
  <rect width="1200" height="148" rx="24" fill="url(#hdrA)"/>
  <rect y="120" width="1200" height="28" fill="url(#hdrA)"/>
  <rect x="48" y="28" width="248" height="28" rx="14" fill="#4f86b8"/>
  <text x="172" y="47" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" font-weight="700" fill="#ffffff">眼のお悩み｜3ステップ図解</text>
  <text x="1152" y="47" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="48" y="106" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">近視の整理と施術方針</text>

  <rect x="44" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="212" cy="242" r="34" fill="#faf5eb" stroke="#4f86b8" stroke-width="2"/>
  <text x="212" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#4f86b8">01</text>
  <text x="212" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#1b3b5c">よくあるサイン</text>
  <line x1="84" y1="322" x2="340" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip1)"><text x="66" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・遠くの看板や黒板の文字がぼ…</text><text x="66" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・遠くを見るとき無意識に目を…</text><text x="66" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・パソコンやスマホ作業の後に…</text></g>
  <rect x="72" y="478" width="280" height="44" rx="12" fill="#f2f7fc"/>
  <text x="212" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#1b3b5c">まず原因部位を丁寧に見極め</text>

  <polygon points="392,365 416,350 416,380" fill="#4f86b8" transform="rotate(180 404 365)"/>

  <rect x="432" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="600" cy="242" r="34" fill="#f2f7fc" stroke="#1b3b5c" stroke-width="2"/>
  <text x="600" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#1b3b5c">02</text>
  <text x="600" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#1b3b5c">体の中で起きていること</text>
  <line x1="472" y1="322" x2="728" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip2)"><text x="454" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・眼に入る平行光線が網膜より…</text><text x="454" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・遺伝的要因に加え</text><text x="454" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・長時間のパソコン</text></g>
  <rect x="460" y="478" width="280" height="44" rx="12" fill="#faf5eb"/>
  <text x="600" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#8c6239">神経・血流・筋緊張から整理</text>

  <polygon points="780,365 804,350 804,380" fill="#4f86b8" transform="rotate(180 792 365)"/>

  <rect x="820" y="182" width="336" height="366" rx="20" fill="#1b3b5c"/>
  <circle cx="988" cy="242" r="34" fill="#4f86b8"/>
  <text x="988" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#ffffff">03</text>
  <text x="988" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#ffffff">当院の鍼灸アプローチ</text>
  <line x1="860" y1="322" x2="1116" y2="322" stroke="#ffffff33" stroke-width="2"/>
  <g clip-path="url(#clip3)"><text x="842" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・眼科での適切な視力検査</text><text x="842" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・眼鏡やコンタクトレンズによ…</text><text x="842" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・小児の低濃度アトロピン点眼…</text></g>
  <rect x="848" y="478" width="280" height="44" rx="12" fill="#4f86b8"/>
  <text x="988" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">段階的に回復と安定を目指す</text>

  <text x="600" y="592" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>