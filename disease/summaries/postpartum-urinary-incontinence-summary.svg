  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">産後尿失禁（出産後の尿漏れ・骨盤底筋</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">訓練併用）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">出産後のくしゃみや抱っこによる尿漏れ（産後尿失禁）に対し、骨盤底筋訓練（</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">PFMT）と併用して回復を後押しする産後鍼灸ケア。</text>

