<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="オクシピタル・ホーン症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">オクシピタル・ホーン症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">銅代謝に関わる遺伝子異常で皮膚の伸びやすさや血管・骨・膀胱に変化が生じる</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">希少疾患です。専門医管理のもと安定期の体調維持を支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">皮膚が引っ張ると伸びやすい・結合組織</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">のもろさがある</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">筋力低下や関節の変形により転倒しやす</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くなっている</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膀胱憩室による尿路感染を繰り返しやす</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">い</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">オクシピタル・ホーン症候群は、ATP7A遺伝</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">子の異常により体内の銅を利用する酵素の働きが</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">低下し、皮膚や血管、骨などの結合組織に異常が</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">生じるX連鎖劣性遺伝の指定難病です。後頭骨…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 主治医の管理と定期検査を最優先とし、尿</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">路感染などの急性症状がある場合は医療機関での</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療を優先して施術を控えます / 2. 結合</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">組織や血管の脆弱性に十分配慮し、過度な圧迫…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>