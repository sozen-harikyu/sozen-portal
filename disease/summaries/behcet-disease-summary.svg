<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ベーチェット病の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ベーチェット病</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">口腔粘膜や皮膚・眼・外陰部などに慢性の炎症を繰り返す指定難病です。専門医</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">での診療・管理を最優先とし、保温とストレス緩和を補完的に支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">口の中に痛みを伴うアフタ性口内炎が何</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">度も繰り返しできる</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すねの結節性紅斑やニキビ様の皮疹など</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">皮膚症状が出やすい</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">目の充血やかすみ・視力低下など眼症状</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">（ぶどう膜炎）が心配</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ベーチェット病は、全身のさまざまな部位に慢性</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・再発性の炎症が生じる指定難病（全身性炎症性</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">疾患）で、20〜40代（特に30代前半）の発</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">症が多く見られます。明確な原因は解明されて…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 指定難病のため膠原病内科・眼科・皮膚科</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">など専門医での診断・薬物治療と定期受診を絶対</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">最優先とし、主治医の許可のもと補完的に対応し</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ます / 2. 過刺激を避けた穏やかな鍼灸…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>