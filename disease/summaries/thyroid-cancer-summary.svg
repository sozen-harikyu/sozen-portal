<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="甲状腺がんの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">甲状腺がん</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">気管前面の甲状腺に発生する悪性腫瘍。標準治療とホルモン補充を最優先に、主</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">治医許可のもと療養中の倦怠感・不眠・不安を緩和します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">甲状腺摘出後の体調変化やだるさ・むく</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">みが気になる</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療や長期経過観察への不安から眠りが</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">浅くなっている</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">薬物療法や放射線治療に伴う倦怠感・吐</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">き気がつらい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気管前面にある甲状腺に発生する悪性腫瘍で、乳</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭がん・濾胞がん・髄様がん等があります。原因</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は未解明ですが髄様がんや一部乳頭がんは遺伝性</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で若年発症しやすい特徴があります。多くは首…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による全摘・片葉切除・リンパ節郭</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">清や術後の甲状腺ホルモン補充療法、放射線・分</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">子標的薬などの標準がん治療を絶対最優先とし、</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">鍼灸はがんを治す治療ではなく主治医許可のも…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>