<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="がん関連抑うつ・不安（オンコロジー支持ケア）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">がん関連抑うつ・不安（オンコロジー支</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">持ケア）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">がん治療中の不安・気分の落ち込み・不眠に対し、標準治療に寄り添い心身の緊</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">張を鎮める解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がん治療の経過とともに不安感や気分の</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">落ち込みが強くなっている</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・夜になると悪いことばかり考えて眠れ</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ず体力が落ちている</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・抗うつ薬を増やさずに心身の緊張を和</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">らげる補完ケアを知りたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">治療に伴うサイトカイン変動・ホルモン変化・心</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">理的ストレス・疼痛と睡眠障害が相互に作用しま</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す。系統的レビュー・メタ解析（PubMed </text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">36578922）では、がん関連抑うつに対…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 腫瘍内科・緩和ケア・精神腫瘍科の専門治</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">療を前提に、百会・印堂・神門・内関で過覚醒を</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">穏やかに鎮静 / 2. 痛み・倦怠感・吐き気</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">など気分を落ち込ませる身体症状も一体的にケ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>