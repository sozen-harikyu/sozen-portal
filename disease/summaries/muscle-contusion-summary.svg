<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="筋挫傷の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">筋挫傷</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">打撲などの鈍い外力で筋肉や腱が傷つくケガ。病院受診と初期固定・冷却を優先</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">し、回復期の柔軟性回復を鍼灸で支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">スポーツ中の接触や蹴りなどで太ももな</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">どを強く打撲した</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">翌日以降に激しい痛みが出て、皮膚が光</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">沢を帯びて腫れている</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膝が90度以上曲がらないなど関節の曲</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">げ伸ばしが制限されている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">打撲などの鈍い外力によって筋肉や腱が損傷する</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">状態です（靭帯損傷である「捻挫」とは異なりま</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す）。格闘技・サッカー・ラグビーなどコンタク</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">トスポーツで相手の膝・肩・頭と衝突した際に…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 骨折や重度損傷の見落としを防ぐため自己</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">判断は避け、まず病院での診察と受傷後48時間</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">以内の安静・冷却・圧迫・挙上（膝は屈曲位保持</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）を優先します / 2. 強い腫れと急性炎…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>