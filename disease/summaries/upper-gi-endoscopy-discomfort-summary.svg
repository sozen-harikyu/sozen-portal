<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="胃内視鏡検査（胃カメラ）時の不快感・嘔吐反射軽減の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">胃内視鏡検査（胃カメラ）時の不快感・</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">嘔吐反射軽減</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">胃カメラ（上部消化管内視鏡）時の強い嘔吐反射や不安・不快感に対し、検査前</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">の自律神経調整と経穴刺激で負担を和らげるサポート。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胃カメラ検査のときの「オエッ」という</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い嘔吐反射（えづき）がトラウマに…</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">内視鏡の咽頭通過による舌咽・迷走神経反射と、</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">検査に対する予期不安による交感神経の亢進が、</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い嘔吐反射・悪心・咽頭不快感を引き起こしま</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す。23件のRCT（計3,349名）を統合…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">検査実施は必ず消化器内科医の判断（鎮静・経鼻</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">内視鏡の選択等）に従い、当院では検査前日〜当</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">日の自律神経鎮静ケア、および検査中にもご自身</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で押せる内関（PC6）・合谷（LI4）など…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>