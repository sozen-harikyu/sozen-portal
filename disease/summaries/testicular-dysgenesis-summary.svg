<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="精巣形成不全の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">精巣形成不全</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">精巣の発生・分化過程の障害による機能異常です。泌尿器科での精査・腫瘍化評</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">価やホルモン療法を最優先に、安定期の体調面を補完します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">思春期の遅れや体毛の少なさなど二次性</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">徴の変化が気になります</text><circle cx="76" cy="375" r="5" fill="#b58b45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">精巣の大きさの左右差や小ささ、停留精</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">巣の既往があります</text><circle cx="76" cy="441" r="5" fill="#b58b45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性欲の減退や勃起の不調、女性化乳房な</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">どに悩んでいます</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">精巣形成不全は、胎児期の精巣の発生・分化過程</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に障害が生じることで、男性ホルモン分泌障害や</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">精子形成障害をきたす希少な状態です。遺伝子変</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">異やクラインフェルター症候群などの染色体異…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 泌尿器科・内分泌科での正確な精査、腫瘍</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">化リスクの評価、手術適応（精巣固定術・尿道下</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">裂修正術等）やホルモン補充療法・不妊治療を最</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">優先とし、主治医の管理下にある安定期に補完…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>