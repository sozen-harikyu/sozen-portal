<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="汗疹の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">汗疹</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">大量の汗で汗の出口が詰まり、首元や脇・関節の裏などに赤く小さな強いかゆみ</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">のある発疹が急に現れる状態です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">首周りや脇の下、肘や膝の裏に赤い小さ</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な発疹が急にできた</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ベルトや下着で締め付けられる部分が蒸</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れて強くかゆい</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">汗をかきやすく夏場や運動後に毎年あせ</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">もを繰り返す</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">汗疹（あせも）は、高温多湿な環境や運動、通気</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性の悪い衣類、ギプス着用などで大量の汗をかい</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">た際、汗の成分やホコリによって汗を外へ出す管</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">（汗管）が詰まることで起こります。行き場を…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 皮膚と深い関係にある肺経のツボ太淵や、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">余分な水分（湿）を排出する承山を用い、蒸れや</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すくトラブルが起きやすい体質を整えます / </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">2. 表層の皮膚トラブルに用いられる肩髎な…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>