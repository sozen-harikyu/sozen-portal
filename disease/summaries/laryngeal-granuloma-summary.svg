<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="喉頭肉芽腫の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">喉頭肉芽腫</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">声帯後方に炎症性の腫瘤ができる喉頭肉芽腫に対し、専門医の精査を最優先に安</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">定期の発声負担・胃酸逆流・咳のケアを支援します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">喉の奥の違和感や痛み、声のかすれが長</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">く続いている</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">違和感を消そうとして咳払いを繰り返し</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">てしまい悪化が心配</text><circle cx="76" cy="441" r="5" fill="#c28b3b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">声の使い過ぎや逆流性食道炎があり喉へ</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の刺激が気になっている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">喉頭肉芽腫は、声帯後方の声帯突起部にできる良</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性の炎症性腫瘤です。逆流性食道炎による胃酸刺</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">激、大声の酷使や咳払いの習慣化（接触性肉芽腫</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）、気管内挿管などの手術による傷、喫煙など…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医の精査と安全管理の徹底：悪性腫瘍</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の除外や気道評価を耳鼻咽喉科で受けることを最</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">優先とし、安定期・主治医許可下で喉頭への過度</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な圧迫を避けて施術します。 / 2. 呼吸…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>