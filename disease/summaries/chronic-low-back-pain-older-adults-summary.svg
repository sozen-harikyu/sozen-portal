<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="高齢者の慢性腰痛症（歩行・生活機能維持）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">高齢者の慢性腰痛症（歩行・生活機能維</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">持）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">鎮痛薬の胃腸・腎臓負担が気になるシニア世代の慢性腰痛を、穏やかな刺激で支</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">長年続く腰痛のせいで散歩や買い物・旅</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">行がおっくうになっている</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・痛み止めを飲み続けることによる胃や</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腎臓への負担が心配</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・骨粗鬆症や高血圧があっても安全に受</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">けられるケアを探している</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">加齢に伴う椎間板変性・脊柱起立筋や殿筋の筋力</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">低下・微小循環低下・中枢疼痛過敏が複合します</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">。2025年の高齢者慢性腰痛研究（PMC12</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">432643）およびCochraneレビュ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 骨粗鬆症や服用薬（抗凝固薬等）を丁寧に</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">確認し、強い圧迫やボキボキ矯正を一切行わない</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">安全な低刺激施術 / 2. 腎兪・大腸兪・委</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">中・陽陵泉を中心に腰殿部の血流と歩行の安定…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>