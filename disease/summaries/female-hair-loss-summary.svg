<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="女性の薄毛の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="100%" stop-color="#6b3764"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c98b5b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">女性のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">女性の薄毛</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">加齢・ホルモン変動・免疫低下による女性の薄毛に対し、頭皮への多鍼と全身の</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">体質調整で血流と栄養循環を整える鍼灸ケアです。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c98b5b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">分け目や頭頂部の地肌が透けてきた</text><circle cx="76" cy="351" r="5" fill="#c98b5b"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">30代以降、髪が細くなりボリュームが</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">出ない</text><circle cx="76" cy="417" r="5" fill="#c98b5b"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">産後から急に抜け毛が増えて不安</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">女性の薄毛は、加齢による毛細血管の衰えで毛乳</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭や毛母細胞へ栄養が届きにくくなるびまん性脱</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">毛症のほか、出産やストレスによる女性ホルモン</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">減少、自己免疫疾患やアトピー性皮膚炎に伴う…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 舌診・脈診で体質を見極め、頭皮の血行を</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">促す百会・通天・天柱を中心に全身の巡りを整え</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ます / 2. 頭皮への多鍼（約50本）や電</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気鍼で浮腫と血流の滞りを和らげ、毛根へ栄養…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>