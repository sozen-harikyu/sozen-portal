<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="化学療法誘発性白血球減少症（骨髄抑制補助）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">化学療法誘発性白血球減少症（骨髄抑制</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">補助）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">主治医の血液管理・G-CSF治療を最優先に、抗がん剤治療中の体力と回復環</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">境を支える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">抗がん剤治療中に白血球や好中球が下が</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">りやすく、治療延期が不安</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・化学療法の合間の強い倦怠感や食欲低</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下を少しでも整えたい</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・感染予防を徹底しながら受けられる安</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">全な補完ケアを知りたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">抗がん剤による骨髄造血幹細胞の一時的抑制（骨</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">髄抑制）が原因です。10 RCTs（n=65</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">0）のメタ解析（PubMed 3493003</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">9）および2022年の系統的レビュー（Pu…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 腫瘍内科主治医の血液検査とG-CSF製</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">剤等の標準治療を絶対最優先とし、医師の許可の</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">もと併用 / 2. 好中球極度低下（発熱性好</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">中球減少リスク）や血小板減少時は刺鍼を控え…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>