<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="小脳梗塞の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#304373"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c48f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">脳神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">小脳梗塞</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">小脳の動脈閉塞で強いめまいやふらつきを起こす脳卒中。発症時は救急搬送を最</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">優先に、回復期後遺症の補完ケアを支えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c48f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">突然の強い回転性めまいや激しい吐き気</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・嘔吐がある</text><circle cx="76" cy="375" r="5" fill="#c48f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">筋力はあるのに体幹がふらつきスムーズ</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に動かせない</text><circle cx="76" cy="441" r="5" fill="#c48f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ろれつが回りにくい・強い後頭部や首の</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">痛みがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">後頭部の小脳を栄養する3本の動脈（上小脳動脈</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・前下小脳動脈・後下小脳動脈）が閉塞・血流低</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下することで発症します。高血圧によるラクナ梗</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">塞、動脈硬化、心房細動等の心原性塞栓、若年…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f6fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1e2a4a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 発症時はt-PA血栓溶解（4.5時間以</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">内）やカテーテル血栓回収（6時間以内）、抗浮</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腫薬・開頭減圧術が命と後遺症を左右するため救</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">急搬送が最優先であり、急性期および再発疑い…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>