<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="睡眠相前進症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">睡眠相前進症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">就寝・起床時刻が極端に早まり、夕方の強い眠気と早朝覚醒が続く状態です。専</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">門治療と並行し、自律神経のバランスを補完的に整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">夕方18〜20時頃に耐えがたい強い眠</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">気が襲ってくる</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">早朝3〜5時頃に目が覚めてしまい二度</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">寝ができない</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">夕方の仕事や会食、車の運転に支障が出</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">て困っている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">睡眠相前進症候群は、体内時計のリズムが通常よ</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">り前倒しになる概日リズム睡眠障害で、中高年層</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に多くみられます。主な要因は加齢に伴う体内時</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">計の周期短縮や必要な睡眠時間の減少ですが、…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 安眠・囟会・失眠などの経穴を用い昂った</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">神経を鎮め自律神経の切り替えを促す施術 / </text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">2. 頭重感や首肩のこりを和らげ、睡眠の質と</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">日中のコンディションを支える全身ケア / …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>