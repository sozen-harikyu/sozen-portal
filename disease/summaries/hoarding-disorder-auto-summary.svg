<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ためこみ症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ためこみ症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">物を手放す際の強い不安やストレスに対し、自律神経調整を通じて精神的な緊張</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">や心身の疲労を和らげる補完ケアを行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">価値に関わらず所有物を捨てられず部屋</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が物であふれている</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">物を手放そうとすると強い苦痛や不安を</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">感じる</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">寂しさやストレスを埋めるために物を集</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">めてしまう</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ためこみ症は、実際の価値とは無関係に物を手放</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すことに強い苦痛を感じ、生活空間が物で埋まっ</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">てしまう状態です。青年期に軽く始まり加齢とと</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">もに進行することが多く、強いストレスや心的…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 内関へのアプローチで精神の安定を促し、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">物を手放す際や日常の強い不安・緊張を緩和 /</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> 2. 合谷を用いて自律神経のバランスを整え</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、首から上の疲れやストレス反応をケア / …</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>