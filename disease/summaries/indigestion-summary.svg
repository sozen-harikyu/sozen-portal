<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="消化不良の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">消化不良</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">食べ過ぎやストレスによる上腹部の不快感や胃もたれ。自律神経と胃腸の働きを</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">鍼灸で整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食後に胃が重くもたれてスッキリしない</text><circle cx="76" cy="351" r="5" fill="#c49342"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">上腹部の不快感や焼けるような・差し込</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">むような痛みがある</text><circle cx="76" cy="417" r="5" fill="#c49342"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">お腹の張り（膨満感）やげっぷ・吐き気</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が続く</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">上腹部の痛みや不快感を指し、胃炎や潰瘍・逆流</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性食道炎などの器質的疾患による場合と、明確な</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">病変がない機能性の場合があります。暴飲暴食、</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">早食い、脂っこい物や刺激物、アルコール・カ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 長引く症状や強い痛みがある場合は医療機</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">関での検査を優先案内しつつ、食生活・睡眠・ス</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">トレス要因を詳しく確認 / 2. 中脘・足三</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">里・湧泉・天枢・梁丘などのツボへ鍼灸を施し…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>