<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="精巣上体炎の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223c4e"/>
      <stop offset="100%" stop-color="#345973"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b58b45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">泌尿器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">精巣上体炎</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">精巣上体に細菌感染が起こり強い痛みや腫れ・発熱を生じる疾患です。精巣捻転</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">との緊急鑑別と抗菌薬治療が必須で、急性期の鍼灸は禁忌です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b58b45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">片側の陰のうが急に強く痛み、赤く腫れ</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">て熱を持っています</text><circle cx="76" cy="375" r="5" fill="#b58b45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">陰のうの痛みや腫れに加えて発熱や鼠径</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">部の痛みがあります</text><circle cx="76" cy="441" r="5" fill="#b58b45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">排尿時の不快感や痛み、尿の濁りや血尿</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がみられます</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">精巣上体炎は、精巣の横から後ろに位置する精巣</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">上体に細菌が尿道口から逆行性に感染して炎症を</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">起こす病気です。若年者ではクラミジアや淋菌な</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">どの性感染症、高齢者では前立腺肥大症などの…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f7fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#223c4e">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 急激な痛み・腫れは精巣捻転との緊急鑑別</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が最優先であり、精巣上体炎は抗菌薬の完遂が必</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">須です。発熱や強い腫脹・熱感を伴う急性感染期</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の鍼灸施術は禁忌とし、直ちに泌尿器科受診を…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>