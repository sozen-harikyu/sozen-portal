<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="パーキンソン病に伴う便秘（PDC）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">パーキンソン病に伴う便秘（PDC）</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">パーキンソン病に伴う腸の動きの低下に対し、脳腸相関と自律神経から排便を支</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">える解説。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">パーキンソン病の経過とともに何日も排</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">便がなくお腹が張る</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・下剤を増やしてもスッキリ出ず、食事</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や外出がおっくうになる</text><circle cx="76" cy="441" r="5" fill="#c49342"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・抗PD薬の効き目を安定させるために</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">も腸の状態を整えたい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腸管神経叢の変性・ドパミン伝達低下・迷走神経</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">機能低下により大腸通過時間が遅延します。20</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">24年の系統的レビュー・メタ解析（PubMe</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">d 39029044）および複数のRCTで…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 脳神経内科の薬物治療と下剤管理を継続し</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">つつ、天枢・足三里・上巨虚・大腸兪で腸管蠕動</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を促進 / 2. 腹筋・骨盤周囲のこわばりや</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">冷えを優しく緩和 / 3. 体の動きやすい…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>