<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="花粉症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3c58"/>
      <stop offset="100%" stop-color="#2f577e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28b3b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">耳鼻咽喉のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">花粉症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">花粉に対する過剰な免疫反応で鼻水・くしゃみ・目のかゆみが生じる状態です。</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ツボ施術と自律神経調整で症状緩和を目指します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28b3b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">透明な鼻水やくしゃみが止まらず仕事に</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">集中できない</text><circle cx="76" cy="375" r="5" fill="#c28b3b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">鼻詰まりで夜ぐっすり眠れず頭が重い</text><circle cx="76" cy="417" r="5" fill="#c28b3b"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">目のかゆみや充血、涙目が毎日つらい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">花粉症は、スギやヒノキなどの花粉を体内の免疫</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">系が異物と認識し、IgE抗体を介して肥満細胞</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">からヒスタミンやロイコトリエンなどの化学物質</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が過剰に放出されることで起こります。これら…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3f8fc"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1f3c58">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 迎香・印堂で鼻水や鼻詰まりを、承泣で目</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">のかゆみや疲れをケアし、顔面部のうっ血と炎症</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">負担を和らげます / 2. 首肩の深層筋と自</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">律神経のバランスを整え、免疫反応が過剰に傾…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>