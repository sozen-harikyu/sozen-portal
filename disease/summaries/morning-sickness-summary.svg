<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="つわりの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="100%" stop-color="#6b3764"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c98b5b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">女性のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">つわり</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">妊娠に伴う吐き気や食欲不振、倦怠感に対し、産婦人科管理を最優先に安全なツ</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ボと自律神経ケアで寄り添います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c98b5b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">朝方や空腹時に強い吐き気・嘔吐がある</text><circle cx="76" cy="351" r="5" fill="#c98b5b"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">炊飯や洗剤などの匂いに敏感になった</text><circle cx="76" cy="393" r="5" fill="#c98b5b"/><text x="92" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">食べ続けないと気持ち悪い・食欲が湧か</text><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ない</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">妊娠5週頃から妊婦の約5〜8割にみられ、多く</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は12〜16週頃に落ち着きます。妊娠に伴う急</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">激なホルモンバランスの変化に加え、ビタミン不</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足や代謝の乱れ、血糖値の変動、生活環境の変…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 産婦人科管理を最優先とした安全設計：水</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">分が摂れない・尿量減少・急激な体重減少など妊</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">娠悪阻が疑われる場合は産婦人科での点滴等の医</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">療対応を最優先とします / 2. 妊娠中禁…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>