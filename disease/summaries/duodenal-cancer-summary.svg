<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="十二指腸がんの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">十二指腸がん</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">胃に続く十二指腸に発生するがん。標準治療を最優先とし、主治医許可のもと術</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">後・化学療法の吐き気や倦怠感・不安を緩和します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">大きな手術や入院後の体力低下・倦怠感</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が抜けない</text><circle cx="76" cy="375" r="5" fill="#b68d40"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">抗がん剤治療による吐き気・食欲低下・</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">しびれがつらい</text><circle cx="76" cy="441" r="5" fill="#b68d40"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">再発リスクや食事への不安から眠りが浅</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">くなっている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胃に続く小腸の最初の部位である十二指腸に発生</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">するがんで、胆管・膵管の開口部に生じるものは</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">十二指腸乳頭部がんと呼ばれます。内視鏡でも奥</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まで観察しないと発見が難しく、原因は未解明…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医によるリンパ節郭清を含む手術や抗</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">がん剤治療などの標準がん治療を絶対最優先とし</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、鍼灸はがんそのものを治す治療ではなく主治医</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">許可のもとでの支持療法・QOL向上として実…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>