<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="持続性知覚性姿勢誘発めまいの3ステップ要点図解">
  <defs>
    <linearGradient id="hdrA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="52" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip2"><rect x="440" y="330" width="320" height="140"/></clipPath>
    <clipPath id="clip3"><rect x="828" y="330" width="320" height="140"/></clipPath>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#faf8f4"/>
  <rect width="1200" height="148" rx="24" fill="url(#hdrA)"/>
  <rect y="120" width="1200" height="28" fill="url(#hdrA)"/>
  <rect x="48" y="28" width="248" height="28" rx="14" fill="#a9844f"/>
  <text x="172" y="47" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" font-weight="700" fill="#ffffff">自律神経のお悩み｜3ステップ図解</text>
  <text x="1152" y="47" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="48" y="106" font-family="Noto Serif JP, serif" font-size="30" font-weight="700" fill="#ffffff">持続性知覚性姿勢誘発めまいの整理と施術方針</text>

  <rect x="44" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="212" cy="242" r="34" fill="#faf5eb" stroke="#a9844f" stroke-width="2"/>
  <text x="212" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#a9844f">01</text>
  <text x="212" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#1d3557">よくあるサイン</text>
  <line x1="84" y1="322" x2="340" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip1)"><text x="66" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・雲の上を歩くようなふわふわ…</text><text x="66" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・立っている時や歩いている時…</text><text x="66" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・人混みやスーパーの陳列棚・…</text></g>
  <rect x="72" y="478" width="280" height="44" rx="12" fill="#f2f7fb"/>
  <text x="212" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#1d3557">まず原因部位を丁寧に見極め</text>

  <polygon points="392,365 416,350 416,380" fill="#a9844f" transform="rotate(180 404 365)"/>

  <rect x="432" y="182" width="336" height="366" rx="20" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <circle cx="600" cy="242" r="34" fill="#f2f7fb" stroke="#1d3557" stroke-width="2"/>
  <text x="600" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#1d3557">02</text>
  <text x="600" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#1d3557">体の中で起きていること</text>
  <line x1="472" y1="322" x2="728" y2="322" stroke="#efeae0" stroke-width="2"/>
  <g clip-path="url(#clip2)"><text x="454" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・持続性知覚性姿勢誘発めまい…</text><text x="454" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・前庭神経炎やメニエール病な…</text><text x="454" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・視覚情報や姿勢変化に対する…</text></g>
  <rect x="460" y="478" width="280" height="44" rx="12" fill="#faf5eb"/>
  <text x="600" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#8c6239">神経・血流・筋緊張から整理</text>

  <polygon points="780,365 804,350 804,380" fill="#a9844f" transform="rotate(180 792 365)"/>

  <rect x="820" y="182" width="336" height="366" rx="20" fill="#1d3557"/>
  <circle cx="988" cy="242" r="34" fill="#a9844f"/>
  <text x="988" y="251" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="22" font-weight="700" fill="#ffffff">03</text>
  <text x="988" y="304" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="20" font-weight="700" fill="#ffffff">当院の鍼灸アプローチ</text>
  <line x1="860" y1="322" x2="1116" y2="322" stroke="#ffffff33" stroke-width="2"/>
  <g clip-path="url(#clip3)"><text x="842" y="362" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・耳鼻咽喉科</text><text x="842" y="400" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・神経内科等での診断と標準治…</text><text x="842" y="438" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f1f5f9">・全身の血流とリンパ循環を整…</text></g>
  <rect x="848" y="478" width="280" height="44" rx="12" fill="#a9844f"/>
  <text x="988" y="505" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">段階的に回復と安定を目指す</text>

  <text x="600" y="592" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="13" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>