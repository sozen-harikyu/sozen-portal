<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="大腿神経痛の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272643"/>
      <stop offset="100%" stop-color="#3d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b88a44"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">大腿神経痛</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">腰から鼠径部・太もも前側へ伸びる大腿神経が圧迫・刺激され、太ももや下腿内</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">側の痛み・しびれ・感覚低下を引き起こす神経痛です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b88a44"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">太ももの前側や鼠径部（足の付け根）、</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">すねの内側に痛みやピリピリしたしび…</text><circle cx="76" cy="375" r="5" fill="#b88a44"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">うつ伏せに寝ると太ももや腰の痛み・し</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">びれが強くなる</text><circle cx="76" cy="441" r="5" fill="#b88a44"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">長時間の立ち仕事・デスクワーク・歩行</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や夜間に症状が悪化しやすい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腰椎から出て腹部・鼠径部を通り太もも前側や下</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腿内側へ伸びる大腿神経が、走行途中で圧迫や牽</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">引を受けることで生じます。大腰筋・腸骨筋の過</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">緊張や短縮、反り腰・骨盤の前傾や歪みのほか…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 腰部から股関節前面（大腰筋・腸骨筋・鼠</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">径部周囲）の深部筋の過緊張を鍼で的確に緩め、</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">大腿神経への圧迫負担を軽減します / 2. </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">骨盤の傾きや腰椎のバランスを整え、神経が引…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>