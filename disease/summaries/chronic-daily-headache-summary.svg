  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">慢性連日性頭痛（CDH・ほぼ毎日続く</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">頭痛）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ほぼ毎日続く慢性連日性頭痛（CDH）に対し、神経の過敏性と首肩の深層緊張</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">を整え、頭痛日数や鎮痛薬への依存軽減を支える鍼灸。</text>

