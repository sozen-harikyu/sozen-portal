<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="放射線誘発性口腔乾燥症（頭頸部がん放射線治療後）の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">がんの種類｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">放射線誘発性口腔乾燥症（頭頸部がん放</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">射線治療後）</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">頭頸部がんの放射線治療後に続くつらい口の渇き（放射線誘発性口腔乾燥症）に</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">対し、標準口腔ケアと併用して症状とQOL改善を支える鍼灸。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭頸部がんの放射線治療が終わった後も</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、強い口の渇きが続いている ・食事…</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">頭頸部への放射線照射により耳下腺・顎下腺など</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の唾液腺組織が障害されると、治療終了から1年</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">以上経過しても慢性的な口腔乾燥が持続すること</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">があります。米国33施設・258名を対象と…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">主治医・歯科口腔外科による標準的な口腔衛生管</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">理・保湿ケアと並行して行います。照射部位の皮</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膚状態を十分に確認したうえで、顔面周囲の安全</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な経穴や手足の遠隔経穴（合谷・太渓・三陰交…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>