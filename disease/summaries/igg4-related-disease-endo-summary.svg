<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="IgG4関連疾患の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16284c"/>
      <stop offset="100%" stop-color="#233d70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b68d40"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">内分泌のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">IgG4関連疾患</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">膵臓・唾液腺・涙腺・腎臓など複数臓器が腫れ硬くなる免疫関連疾患。ステロイ</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ド等の専門治療を最優先し、安定期の体調管理を補完します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b68d40"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">まぶたや顎の下・耳の下に腫れがある</text><circle cx="76" cy="351" r="5" fill="#b68d40"/><text x="92" y="357" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膵臓や胆管の影響で黄疸や血糖上昇が出</text><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">た</text><circle cx="76" cy="417" r="5" fill="#b68d40"/><text x="92" y="423" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腎機能低下や喘息様症状など複数臓器の</text><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">不調がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">明確な原因は未解明ですが、免疫異常が関与し遺</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">伝性はほとんどないとされています。血中IgG</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">4値の上昇とIgG4産生形質細胞の著しい浸潤</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、強い線維化を特徴とし、膵臓・胆管・唾液腺…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f6f4ef"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#16284c">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 専門医による診断（悪性腫瘍との鑑別含む</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">）とステロイド・免疫抑制薬の継続治療を最優先</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、自己判断での断薬を避けつつ急性増悪期や</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">黄疸・腎障害進行期は施術対象外とします /…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>