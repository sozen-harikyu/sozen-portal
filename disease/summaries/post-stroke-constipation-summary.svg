  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">脳卒中後に生じる頑固な便秘に対し、主治医の排便管理と併用して腸管運動と自</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">律神経を整え、自然な排便リズムを支える鍼灸。</text>

