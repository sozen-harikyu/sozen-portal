<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="脂肪肝の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">脂肪肝</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">肝臓に中性脂肪が過剰に蓄積した状態。生活習慣の改善とあわせ、肝経への鍼灸</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">で巡りと体調を整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">健康診断で脂肪肝や肝機能の数値異常を</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">指摘された</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">疲れやすさやだるさ・肩こりが抜けにく</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">い</text><circle cx="76" cy="441" r="5" fill="#c49342"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">飲酒習慣や脂質・糖質の多い食事が続い</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">肝細胞に中性脂肪が過剰に蓄積し、脂肪が肝細胞</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の30％以上を占める状態です。過剰な飲酒によ</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">るアルコール性脂肪肝と、脂質・糖質の摂り過ぎ</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や運動不足、肥満、糖尿病、脂質異常症、ステ…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 健康診断の結果や合併症（糖尿病・脂質異</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">常症など）の有無を確認し、医師の経過観察や治</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">療方針を最優先に整理 / 2. 太衝・中封・</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">蠡溝など肝経のツボを中心に鍼灸を行い、血流…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>