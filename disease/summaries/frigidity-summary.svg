<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="不感症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="100%" stop-color="#6b3764"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c98b5b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">女性のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">不感症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">精神的緊張や骨盤内の冷え・巡りの滞りが関わる不感症に対し、腎兪・次髎・肝</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">兪などへの鍼灸で心身のリラックスと血流改善を支援します。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c98b5b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">性行為の際に性的快感を全く感じない、</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">または反応が乏しい</text><circle cx="76" cy="375" r="5" fill="#c98b5b"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">過去の痛みや恐怖から性交時に強い不安</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や緊張が出てしまう</text><circle cx="76" cy="441" r="5" fill="#c98b5b"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腰や下肢のだるさ、骨盤周りの冷えや月</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">経不順がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">不感症は性感異常の一つで、性行為自体は可能で</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">も性的快感が全く得られない、または弱い状態を</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">指します（経験不足による未発達や性欲自体がな</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">い無性欲症とは区別されます）。原因として最…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 骨盤内血流と自律神経を整える鍼灸：腎兪</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・次髎・肝兪を中心に、胞肓・肓兪・関元・衝門</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・血海・陰陵泉・三陰交などから体質に合うツボ</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を選び、骨盤内の冷えと滞りをケアします /…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>