<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="非24時間睡眠覚醒症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#2c4e7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#a9844f"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">自律神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">非24時間睡眠覚醒症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">睡眠・覚醒時刻が毎日30〜60分ずつ後ろにずれる障害です。専門医療を前提</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">に、自律神経と緊張を整える補完的な鍼灸ケアを行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#a9844f"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">就寝・起床時刻が毎日少しずつ遅れて昼</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">夜が周期的に逆転する</text><circle cx="76" cy="375" r="5" fill="#a9844f"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">周期的な不眠と日中の強い眠気・強い疲</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">労感を繰り返す</text><circle cx="76" cy="441" r="5" fill="#a9844f"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">社会生活のリズムに合わず学業や就労の</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">継続が難しい</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">非24時間睡眠覚醒症候群は、体内時計の周期が</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">約25時間となり外界の24時間周期に同調でき</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">なくなる障害です。光による同調が得にくい重度</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の視覚障害の方に多くみられますが、晴眼者で…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f2f7fb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1d3557">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 合谷・失眠・労宮などの経穴を用い体内の</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">緊張や興奮を鎮め副交感神経を優位にする施術 </text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">/ 2. 睡眠リズムの乱れに伴う全身の疲労感</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や足の冷え・血行不良を和らげる調整 / 3…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>