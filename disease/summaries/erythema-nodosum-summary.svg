<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="結節性紅斑の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3c3a2a"/>
      <stop offset="100%" stop-color="#59563f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c28f45"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">皮膚のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">結節性紅斑</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">皮下脂肪に炎症が起き、すねの前面などに痛み・熱感のある赤紫色のしこりが複</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">数現れる疾患です。安静と原因精査を最優先とし、回復期の巡りを整えます。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c28f45"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">膝から足首にかけてのすね前面に赤や紫</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の膨らんだ斑点がいくつもある</text><circle cx="76" cy="375" r="5" fill="#c28f45"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">斑点の部分がしこりのように硬く触れる</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">と痛みや熱感がある</text><circle cx="76" cy="441" r="5" fill="#c28f45"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発熱やだるさ・喉の痛み・関節痛など風</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">邪のような全身症状を伴う</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">結節性紅斑は、皮下脂肪組織に炎症が生じること</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で直径1〜5cm程度の境界不明瞭な有痛性紅斑</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・結節が多発する疾患で、20〜30代の女性に</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">多く見られます。最も多い原因は溶連菌などの…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#faf8f2"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#3c3a2a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 横になって下肢を安静にすることと、医療</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">機関での原因疾患の精査・薬物治療（抗炎症薬・</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">原因感染症への抗菌薬等）を最優先にご案内しま</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">す / 2. 症状が落ち着いた回復期には、…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>