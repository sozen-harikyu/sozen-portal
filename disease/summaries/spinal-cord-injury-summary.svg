<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="脊髄損傷の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">脊髄損傷</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">外傷等で脊椎内の脊髄が傷つき運動・感覚・自律神経障害が生じる重篤な状態で</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">、専門医療が最優先です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">損傷部位より下の運動麻痺や筋力低下が</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ある</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手足のしびれや感覚鈍麻、温冷感の異常</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が続く</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">排尿・排便障害や血圧・体温調節の不調</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を伴う</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">交通事故、転倒・転落、激しいスポーツなどで脊</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">椎に強い外力が加わり、骨折や脱臼により内部の</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脊髄が損傷することで発症します。頚髄損傷は交</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">通事故やスポーツ、胸・腰・仙髄損傷は高所転…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 脊髄損傷は生命・神経予後に直結するため</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、受傷直後や悪化時は直ちに救急・専門医療機関</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">でのMRI/CT検査・手術・薬物療法を最優先</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">とし、安定期以降に主治医の許可を得たうえで…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>