<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="糖尿病神経障害の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272643"/>
      <stop offset="100%" stop-color="#3d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b88a44"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">糖尿病神経障害</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">高血糖による末梢神経・血流障害で足先のしびれや痛みが起こります。血糖管理</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">と足病変予防を最優先に、循環・自律神経を安全に補完ケアします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b88a44"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足裏で砂利を踏む・薄皮が張ったような</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">違和感やしびれがある</text><circle cx="76" cy="375" r="5" fill="#b88a44"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手足の先端に刺すような痛みや焼けつく</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">痛み、冷えを感じる</text><circle cx="76" cy="441" r="5" fill="#b88a44"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">温度や傷の感覚が鈍くなり小さな傷や乾</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">燥・ひび割れが心配</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">糖尿病神経障害は、長期間の高血糖により神経を</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">養う毛細血管の血流が低下し、糖化終産物の蓄積</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">や酸化ストレスによって末梢神経や自律神経が傷</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">つく糖尿病の代表的な合併症です。多発神経障…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 内科主治医による血糖コントロールと合併</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">症検査を最優先とし、感覚低下部位での火傷・感</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">染を防ぐため皮膚確認と衛生管理を徹底します </text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">/ 2. 潰瘍や傷のない安全な範囲を見極め…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>