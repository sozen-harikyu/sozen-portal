<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="アイカルディ症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">アイカルディ症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">脳梁欠損・網脈絡膜異常・スパズム発作を特徴とする希少疾患。専門医療と感染</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">予防を最優先に安定期のご家族支援を行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">短時間体を強直させるスパズム発作を繰</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">り返している</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脳梁の欠損や網脈絡膜の異常、眼・骨格</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">の異常を指摘された</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">歩行や発語など重度の精神運動発達遅滞</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">への長期ケアが必要</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脳梁欠損、網脈絡膜異常、短時間体を強直させる</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">スパズム発作（てんかん）を特徴とする希少疾患</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で、国内患者数は約100人前後、ほとんどが女</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">児に発症します。明確な原因は未解明ですがX…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 小児神経科等での抗てんかん薬・ACTH</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">注射などのてんかん管理と感染症予防を絶対最優</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">先とし、発作頻発期や体調不安定時は施術対象外</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">といたします / 2. 症状が安定した時期…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>