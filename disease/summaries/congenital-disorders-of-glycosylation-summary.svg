<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="先天性グリコシル化異常症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">先天性グリコシル化異常症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">糖タンパク質の糖鎖修飾異常による先天性代謝異常症。専門医での栄養・全身管</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">理を最優先に、安定期の穏やかな補完ケアとご家族支援を行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">乳児期からの哺乳不良や嘔吐、体重増加</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">不良・発育不全がある</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">筋緊張低下や精神運動発達の遅れ、てん</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">かん発作が見られる</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">心嚢液貯留や心筋症など臓器合併症の定</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">期検査を受けている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">タンパク質の働きを支える糖鎖の合成・修飾過程</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に遺伝子変異が生じる先天性代謝異常症の総称で</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">、PMM2-CDGが最も多く知られます。筋緊</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">張低下、発育不全、精神運動発達遅滞、内斜視…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 小児代謝・循環器・神経専門医での診断、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">病型に応じた糖補充療法や栄養・呼吸管理（経管</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">栄養・胃ろう含む）、抗てんかん薬等の標準医療</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を絶対最優先とし、急性期や心・呼吸不安定時…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>