<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="馬尾症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4b"/>
      <stop offset="100%" stop-color="#2a556c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c58b3c"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">筋肉、骨のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">馬尾症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">腰椎下部の馬尾神経が圧迫され排尿・排便障害や下肢麻痺を起こす重篤な病態で</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">、緊急医療が最優先です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c58b3c"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">尿が出にくい・尿漏れ・便失禁など排尿</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">排便の異常がある</text><circle cx="76" cy="375" r="5" fill="#c58b3c"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">強い腰痛とともに両足にしびれや神経痛</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">が広がっている</text><circle cx="76" cy="441" r="5" fill="#c58b3c"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">足に力が入りにくく階段の昇り降りが困</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">難になっている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脊髄下端（第1〜第2腰椎付近）から馬の尻尾状</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に分岐する神経束「馬尾」全体が圧迫されて発症</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">します。巨大な腰椎椎間板ヘルニア、高度の腰部</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">脊柱管狭窄症、脊髄・脊椎腫瘍、硬膜外血腫、…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4f7f9"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#1b3a4b">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 排尿・排便障害や進行性の下肢麻痺を伴う</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">急性症状は直ちに専門医療機関（整形外科・脳神</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">経外科）での緊急受診・手術を最優先とし、当院</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">では術後回復期や主治医管理下の慢性期におけ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>