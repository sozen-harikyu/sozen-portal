  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下剤を使わないと何日も排便がなく、お</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腹の張りが苦しい</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・食物繊維や水分を増やしてもなかなか</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">改善しない</text><circle cx="76" cy="441" r="5" fill="#c49342"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・刺激性下剤の量が増えてきて将来が不</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">安</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">大腸通過時間の遅延や骨盤底筋協調障害・自律神</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">経バランスの乱れが背景にあります。Annal</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">s of Internal Medicine</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> 2016年の15病院大規模RCT（n=1…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 天枢・腹結・大腸兪・上巨虚を中心に、大</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腸のぜん動運動と排便反射を穏やかに活性化 /</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155"> 2. 腰仙部と腹部の冷え・緊張を解き、自然</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">な排便リズムを育成 / 3. 下剤の急な自…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>