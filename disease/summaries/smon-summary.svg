<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="スモンの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21423a"/>
      <stop offset="100%" stop-color="#326155"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c49342"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">消化器のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">スモン</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">キノホルムによる薬害で生じた神経障害（新規発症なし）。専門医管理下で慢性</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">期のしびれや筋緊張を補完ケアします。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c49342"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">両足の異常なしびれや冷痛感・脱力感が</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">長く続いている</text><circle cx="76" cy="375" r="5" fill="#c49342"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下肢のこわばりや深部覚障害により立位</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">・歩行に負担がかかる</text><circle cx="76" cy="441" r="5" fill="#c49342"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">視力低下や白内障・高血圧・関節痛など</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">合併症の管理が続いている</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">亜急性脊髄視神経末梢神経障害の略称で、昭和3</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">0〜40年代に整腸剤として販売されていた有機</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">化合物キノホルムの服用により、ビタミンB12</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">欠乏などを介して発症した薬害疾患です。現在…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f3faf7"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#21423a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 神経内科等の専門医療機関での薬物療法や</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">合併症管理を最優先とし、現在の感覚障害や歩行</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">状態・主治医の方針を丁寧に確認します / 2</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">. 下肢や腰背部の深層筋のこわばり・冷えに…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>