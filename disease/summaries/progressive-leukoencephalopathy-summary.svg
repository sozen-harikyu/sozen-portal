<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="進行性白質脳症の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">進行性白質脳症</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">外傷や感染症を契機に階段状に進行し得る常染色体劣性遺伝の大脳白質障害。専</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">門医の定期管理と外傷・感染予防を最優先に安定期支援を行います。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">出生後しばらくは順調だったが徐々に運</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">動発達の遅れやふらつきが出てきた</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">乳児期からの大頭症や歩行障害、認知機</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">能低下、てんかんがある</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">卵巣機能障害を伴う型で月経機能障害が</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">みられる</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">出生後しばらく正常に発達した後、少しずつ運動</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発達の遅れが現れる常染色体劣性遺伝の大脳白質</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">障害群で、国内の発症数は年間約10〜20人と</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">推定されます（発症時期は乳幼児期〜成年期と…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 小児神経・神経内科専門医での定期受診・</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">対症療法および頭部外傷・感染症の徹底予防を絶</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">対最優先とし、感染時・発熱時・転倒後や進行期</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">は施術対象外です / 2. 感染症や発作の…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>