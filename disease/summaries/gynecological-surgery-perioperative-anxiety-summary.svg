<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="婦人科手術の周術期不安・術後回復サポートの要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2545"/>
      <stop offset="100%" stop-color="#6b3764"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#c98b5b"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">女性のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="96" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">婦人科手術の周術期不安・術後回復サポ</text><text x="56" y="140" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ート</text>
  <text x="56" y="176" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">婦人科手術前後の強い不安・緊張や術後の吐き気・体力回復に対し、標準医療と</text><text x="56" y="202" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">併用して心身の負担を和らげる周術期鍼灸ケア。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#c98b5b"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">子宮や卵巣の手術を控え、強い不安や緊</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">張で眠れない日が続いている ・術後…</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">婦人科手術では手術そのものへの心理的ストレス</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">に加え、麻酔・気腹・ホルモン動態の変化により</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">周術期不安や術後悪心嘔吐（PONV）、消化管</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">運動低下が生じやすくなります。20研究（計…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#fcf4f8"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#4a2545">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">産婦人科主治医の術前・術後指示を最優先とし、</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手術前は内関・神門・合谷・三陰交などの遠隔経</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">穴で不安と睡眠を整え、退院後は創部への直接刺</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">激を避けながら胃腸機能・自律神経・冷え・体…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>