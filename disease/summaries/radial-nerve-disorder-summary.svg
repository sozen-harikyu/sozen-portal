<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="橈骨神経障害の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272643"/>
      <stop offset="100%" stop-color="#3d3b66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#b88a44"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">神経のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">橈骨神経障害</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">上腕から前腕を通る橈骨神経が圧迫・損傷され、手首や指を反らせにくくなる下</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">垂手や手の甲側のしびれを生じる神経障害です。</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#b88a44"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手首が垂れ下がり、自力で反らせない（</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">下垂手）</text><circle cx="76" cy="375" r="5" fill="#b88a44"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">指の付け根を伸ばしにくく、物をつかみ</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">にくい</text><circle cx="76" cy="441" r="5" fill="#b88a44"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">親指・人差し指・中指の手の甲側にしび</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">れや感覚の鈍さがある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">腕神経叢から上腕の後面を通り前腕・手へ伸びる</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">橈骨神経が、外部からの圧迫や外傷を受けること</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">で生じます。代表的な原因は、横向きで上腕に頭</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">を乗せて眠る、飲酒後にそのまま寝込む、長時…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f5f4fa"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#272643">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 橈骨神経の走行に沿ったツボや前腕伸筋群</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">へ鍼を行い、圧迫で滞った局所の血流促進と神経</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">回復環境の改善を図ります / 2. お灸の温</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">熱刺激を組み合わせて筋肉のこわばりを和らげ…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>