<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ＡＴＲ－Ｘ症候群の要点まとめ図解">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244b5a"/>
      <stop offset="100%" stop-color="#356c80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#faf8f4"/>
  <rect x="0" y="0" width="1200" height="226" rx="28" fill="url(#hdr)"/>
  <rect x="0" y="196" width="1200" height="30" fill="url(#hdr)"/>
  <rect x="56" y="34" width="240" height="30" rx="15" fill="#d19344"/>
  <text x="176" y="54" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#ffffff">子供のお悩み｜要点まとめ</text>
  <text x="1144" y="54" text-anchor="end" font-family="Noto Serif JP, serif" font-size="14" fill="#cbd5e1">銀座そうぜん鍼灸院グループ</text>
  <text x="56" y="112" font-family="Noto Serif JP, serif" font-size="34" font-weight="700" fill="#ffffff">ＡＴＲ－Ｘ症候群</text>
  <text x="56" y="166" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">ATRX遺伝子変異により男児に重度知的発達遅滞や消化器症状を生じる非進行</text><text x="56" y="192" font-family="Noto Sans JP, sans-serif" font-size="18" fill="#e2e8f0">性の先天性疾患。専門医の定期管理を最優先に、安定期の穏やかな補完ケアと…</text>

  <rect x="44" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="44" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="64" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">1. 主な症状・お悩み</text>
  <circle cx="76" cy="309" r="5" fill="#d19344"/><text x="92" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">重度の精神運動・知的発達の遅れと特徴</text><text x="92" y="339" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">的な顔貌・骨格異常がある</text><circle cx="76" cy="375" r="5" fill="#d19344"/><text x="92" y="381" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">胃食道逆流症による嘔吐や便秘など消化</text><text x="92" y="405" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">器トラブルが起きやすい</text><circle cx="76" cy="441" r="5" fill="#d19344"/><text x="92" y="447" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">手のひらを上にして顎を上げ斜め上を見</text><text x="92" y="471" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">るなど特徴的な姿勢・行動がある</text>

  <rect x="422" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="422" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="442" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">2. 原因・メカニズム</text>
  <text x="444" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">ＡＴＲ－Ｘ症候群は、ATRX遺伝子の変異（母</text><text x="444" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">親からの保因遺伝または新生変異）により男児に</text><text x="444" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">発症するX連鎖知的障害症候群で、国内では約9</text><text x="444" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">0名の診断例があります。重度の精神運動・知…</text>

  <rect x="800" y="252" width="356" height="352" rx="20" fill="#ffffff" stroke="#e5dfd3" stroke-width="2"/>
  <rect x="800" y="252" width="356" height="42" rx="20" fill="#f4fafb"/>
  <text x="820" y="279" font-family="Noto Serif JP, serif" font-size="17" font-weight="700" fill="#244b5a">3. 当院の施術アプローチ</text>
  <text x="824" y="315" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">1. 小児科・小児神経科・消化器科など専門医</text><text x="824" y="343" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">での定期評価と胃食道逆流症・便秘等の合併症管</text><text x="824" y="371" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">理、発達療育を絶対最優先とし、急性期や嘔吐悪</text><text x="824" y="399" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#334155">化時は施術対象外です / 2. 体調が安定…</text>

  <text x="600" y="644" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#64748b">※標準治療・専門医の診察と併用し、お一人おひとりの体質と経過に合わせて施術内容を調整します</text>
</svg>