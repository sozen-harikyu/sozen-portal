<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>院長YouTube解説アップロード｜そうぜんポータル管理</title>
  <style>
    :root {
      --navy: #16284c;
      --gold: #b68d40;
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dce3ec;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 16px 12px 56px;
    }
    .wrap { max-width: 700px; margin: 0 auto; }
    header {
      background: var(--navy);
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 22px 20px;
    }
    header .badge {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    header h1 { margin: 0; font-size: 20px; line-height: 1.35; }
    header p { margin: 6px 0 0; font-size: 13px; color: #cbd5e1; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 22px 20px 28px;
      box-shadow: 0 4px 16px rgba(22, 40, 76, 0.06);
    }
    .token-box {
      background: #faf5eb;
      border: 1px solid #e5d5b5;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 22px;
    }
    .token-box summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--navy);
    }
    .token-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .token-row input { flex: 1; min-width: 200px; }
    .btn-sm {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sm.sub {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .req { color: #dc2626; margin-left: 4px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    input[type="text"],
    input[type="url"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--text);
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--navy);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 110px; }
    .disease-results {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 6px;
      background: #fff;
      display: none;
    }
    .disease-item {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      font-size: 14px;
    }
    .disease-item:last-child { border-bottom: none; }
    .disease-item:hover { background: #faf5eb; }
    .disease-item small { display: block; color: var(--muted); font-size: 11.5px; }
    .selected-pill {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eef7fc;
      border: 1px solid #cde6f5;
      font-size: 13.5px;
      color: var(--navy);
      font-weight: 700;
    }
    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #f8fafc;
    }
    .preview-img {
      display: none;
      max-width: 100%;
      max-height: 260px;
      margin: 12px auto 0;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.75;
      word-break: break-word;
    }
    .status.ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .status.err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .status a { color: var(--navy); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">SOZEN PORTAL DIRECT UPLOAD</span>
      <h1>🎥 院長YouTube解説アップロード</h1>
      <p>Google認証不要・ブラウザから直接 sozen-portal の /disease/ へ自動反映します。</p>
    </header>

    <div class="card">
      <details id="tokenDetails" class="token-box" open>
        <summary id="tokenSummary">🔑 初回のみ：GitHubトークンを設定してください</summary>
        <div class="hint">
          トークンはこの端末のブラウザ内（localStorage）にのみ保存され、GitHubリポジトリには一切保存されません。
        </div>
        <div class="token-row">
          <input id="ghToken" type="password" placeholder="github_pat_... を貼り付け" />
          <button type="button" id="saveTokenBtn" class="btn-sm">この端末に保存</button>
          <button type="button" id="clearTokenBtn" class="btn-sm sub">消去</button>
        </div>
      </details>

      <form id="ytForm">
        <div class="field">
          <label for="diseaseSearch">1. 対象疾患を検索して選択<span class="req">*</span></label>
          <input id="diseaseSearch" type="text" placeholder="例：頭鳴り、脳過敏、梨状筋、耳鳴り..." autocomplete="off" />
          <div id="diseaseResults" class="disease-results"></div>
          <div id="selectedPill" class="selected-pill"></div>
          <input id="slug" type="hidden" required />
          <input id="diseaseName" type="hidden" />
        </div>

        <div class="field">
          <label for="insertMode">追加位置</label>
          <select id="insertMode">
            <option value="append">既存のYouTube解説の「下」に追加する（おすすめ）</option>
            <option value="prepend">既存のYouTube解説の「上」に追加する</option>
            <option value="replace">この内容で上書き（既存を置き換える）</option>
          </select>
        </div>

        <div class="field">
          <label for="heading">2. 見出し（＼ 〇〇 ／ になります）</label>
          <input id="heading" type="text" placeholder="例：頭鳴りとは頭の中から音が聞こえること" />
        </div>

        <div class="field">
          <label for="imageFile">3. YouTube切り抜き画像</label>
          <div class="upload-box">
            <input id="imageFile" type="file" accept="image/*" />
            <div class="hint">自動で軽量リサイズ（横最大1280px）して GitHub へ保存します</div>
            <img id="previewImg" class="preview-img" alt="プレビュー" />
          </div>
        </div>

        <div class="field">
          <label for="caption">画像のキャプション（任意）</label>
          <input id="caption" type="text" placeholder="例：頭鳴りって本当に不思議（YouTube解説より）" />
        </div>

        <div class="field">
          <label for="points">4. ポイント箇条書き（水色枠・1行1項目）</label>
          <textarea id="points" rows="3" placeholder="頭鳴りを見続けてきて11年&#10;鍼灸臨床数10万人を超えました。（2024年現在）"></textarea>
        </div>

        <div class="field">
          <label for="body">5. 文字起こし・解説本文</label>
          <textarea id="body" rows="6" placeholder="この症状でやっかいなのは、MRIやCTなどでは問題が見られず「様子見」されることが多くあります。"></textarea>
        </div>

        <div class="field">
          <label for="youtubeUrl">6. YouTube動画URL（任意・埋め込み表示）</label>
          <input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." />
        </div>

        <button id="submitBtn" type="submit">ポータルへアップロード＆自動反映する</button>
        <div id="statusBox" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    const OWNER = "sozen-harikyu";
    const REPO = "sozen-portal";
    const BRANCH = "main";
    const TOKEN_KEY = "sozen_portal_github_token";

    let allDiseases = [];
    let resizedImageBase64 = "";

    const tokenInput = document.getElementById("ghToken");
    const tokenDetails = document.getElementById("tokenDetails");
    const tokenSummary = document.getElementById("tokenSummary");
    const searchInput = document.getElementById("diseaseSearch");
    const resultsBox = document.getElementById("diseaseResults");
    const selectedPill = document.getElementById("selectedPill");
    const slugInput = document.getElementById("slug");
    const nameInput = document.getElementById("diseaseName");
    const fileInput = document.getElementById("imageFile");
    const previewImg = document.getElementById("previewImg");
    const statusBox = document.getElementById("statusBox");
    const submitBtn = document.getElementById("submitBtn");

    function refreshTokenUi() {
      const saved = localStorage.getItem(TOKEN_KEY) || "";
      if (saved) {
        tokenInput.value = saved;
        tokenSummary.textContent = "✅ GitHubトークン設定済み（クリックで変更）";
        tokenDetails.open = false;
      } else {
        tokenSummary.textContent = "🔑 初回のみ：GitHubトークンを設定してください";
        tokenDetails.open = true;
      }
    }

    document.getElementById("saveTokenBtn").addEventListener("click", () => {
      const v = tokenInput.value.trim();
      if (!v) return alert("トークンを入力してください。");
      localStorage.setItem(TOKEN_KEY, v);
      refreshTokenUi();
      showStatus("トークンをこの端末に保存しました。", true);
    });

    document.getElementById("clearTokenBtn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      tokenInput.value = "";
      refreshTokenUi();
    });

    refreshTokenUi();

    async function loadDiseases() {
      const urls = [
        "./disease/diseases.json",
        "https://sozen-harikyu.github.io/sozen-portal/disease/diseases.json"
      ];
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (res.ok) {
            allDiseases = await res.json();
            return;
          }
        } catch (e) {}
      }
      showStatus("疾患リスト（diseases.json）の読み込みに失敗しました。公開URLから開いてください。", false);
    }
    loadDiseases();

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { resultsBox.style.display = "none"; return; }
      const matches = allDiseases.filter((d) =>
        [d.name, d.keywords, d.slug, d.id].join(" ").toLowerCase().includes(q)
      ).slice(0, 30);

      resultsBox.innerHTML = matches.length
        ? matches.map((d) =>
            `<div class="disease-item" data-slug="${esc(d.slug)}" data-name="${esc(d.name)}">` +
            `<strong>${esc(d.name)}</strong>` +
            `<small>${esc(d.id)} / ${esc(d.category)} / slug: ${esc(d.slug)}</small></div>`
          ).join("")
        : '<div class="disease-item">該当する疾患が見つかりません</div>';
      resultsBox.style.display = "block";
    });

    resultsBox.addEventListener("click", (e) => {
      const item = e.target.closest(".disease-item[data-slug]");
      if (!item) return;
      slugInput.value = item.dataset.slug;
      nameInput.value = item.dataset.name;
      searchInput.value = item.dataset.name;
      selectedPill.textContent = `選択中：${item.dataset.name}（/disease/${item.dataset.slug}.html）`;
      selectedPill.style.display = "block";
      resultsBox.style.display = "none";
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        resizedImageBase64 = "";
        previewImg.style.display = "none";
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1280;
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.86);
          resizedImageBase64 = dataUrl.split(",")[1];
          previewImg.src = dataUrl;
          previewImg.style.display = "block";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin);
    }

    function fromBase64Utf8(b64) {
      const bin = atob(b64.replace(/\s/g, ""));
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    async function ghFetch(path, token, opts = {}) {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
        ...opts,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          ...(opts.headers || {})
        }
      });
      return res;
    }

    async function getFileIfExists(repoPath, token) {
      const res = await ghFetch(`/contents/${repoPath}?ref=${encodeURIComponent(BRANCH)}`, token);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`ファイル取得エラー (${res.status}): ${await res.text()}`);
      return await res.json();
    }

    async function putFile(repoPath, base64Content, message, token, sha = "") {
      const payload = { message, content: base64Content, branch: BRANCH };
      if (sha) payload.sha = sha;
      const res = await ghFetch(`/contents/${repoPath}`, token, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(`GitHub保存エラー (${res.status}): ${await res.text()}`);
      return await res.json();
    }

    document.getElementById("ytForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = (localStorage.getItem(TOKEN_KEY) || tokenInput.value || "").trim();
      if (!token) {
        tokenDetails.open = true;
        showStatus("先に上部の「GitHubトークン」を入力して保存してください。", false);
        return;
      }
      const slug = slugInput.value.trim();
      const diseaseName = nameInput.value.trim();
      if (!slug) {
        showStatus("先に「1. 対象疾患」を検索して一覧からタップして選択してください。", false);
        return;
      }

      const heading = document.getElementById("heading").value.trim();
      const caption = document.getElementById("caption").value.trim();
      const points = document.getElementById("points").value.trim();
      const body = document.getElementById("body").value.trim();
      const youtubeUrl = document.getElementById("youtubeUrl").value.trim();
      const insertMode = document.getElementById("insertMode").value;

      if (!heading && !body && !resizedImageBase64 && !youtubeUrl) {
        showStatus("見出し・画像・本文・YouTube URLのいずれかを入力してください。", false);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "GitHubへアップロード中...";
      statusBox.style.display = "none";

      try {
        // 1. 画像アップロード
        let savedImg = "";
        if (resizedImageBase64) {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
          savedImg = `yt_${stamp}.jpg`;
          await putFile(
            `images/youtube/${slug}/${savedImg}`,
            resizedImageBase64,
            `admin: ${diseaseName} のYouTube切り抜き画像を追加 (${savedImg})`,
            token
          );
        }

        // 2. Markdownブロック作成
        const parts = [];
        if (heading) parts.push(`## ${heading}`);
        if (savedImg) parts.push(caption ? `[画像: ${savedImg} | ${caption}]` : `[画像: ${savedImg}]`);
        if (points) {
          const pLines = points.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
          if (pLines.length) {
            parts.push(["[ポイント]", ...pLines.map((l) => l.replace(/^[・•\-*]\s*/, "・")), "[/ポイント]"].join("\n"));
          }
        }
        if (body) parts.push(body);
        if (youtubeUrl) parts.push(`[YouTube: ${youtubeUrl}]`);
        const newBlock = parts.join("\n\n");

        // 3. articles/<slug>_youtube.md を取得・結合・保存
        const mdPath = `articles/${slug}_youtube.md`;
        const existing = await getFileIfExists(mdPath, token);
        const existingText = existing ? fromBase64Utf8(existing.content).trim() : "";
        let finalText = newBlock;
        if (existingText && insertMode === "append") {
          finalText = `${existingText}\n\n${newBlock}`;
        } else if (existingText && insertMode === "prepend") {
          finalText = `${newBlock}\n\n${existingText}`;
        }

        await putFile(
          mdPath,
          toBase64Utf8(finalText + "\n"),
          `admin: ${diseaseName} のYouTube解説を更新`,
          token,
          existing ? existing.sha : ""
        );

        // 4. GitHub Actions を自動起動
        const disp = await ghFetch("/dispatches", token, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event_type: "sheet-updated" })
        });

        const pageUrl = `https://${OWNER}.github.io/${REPO}/disease/${slug}.html`;
        if (disp.status === 204 || disp.status === 200) {
          showStatus(
            `✅ アップロード完了！GitHub Actionsが自動でページを更新しています（約30〜60秒後に反映）。<br>` +
            `反映先：<a href="${esc(pageUrl)}" target="_blank" rel="noopener">${esc(pageUrl)}</a>`,
            true
          );
        } else {
          showStatus(
            `✅ 画像と解説はGitHubへ保存できました！（自動起動のみ権限不足のため、GitHubの <a href="https://github.com/${OWNER}/${REPO}/actions" target="_blank" rel="noopener">Actions</a> から Run workflow を押すと反映されます）`,
            true
          );
        }

        document.getElementById("heading").value = "";
        document.getElementById("caption").value = "";
        document.getElementById("points").value = "";
        document.getElementById("body").value = "";
        document.getElementById("youtubeUrl").value = "";
        fileInput.value = "";
        resizedImageBase64 = "";
        previewImg.style.display = "none";
      } catch (err) {
        showStatus(`❌ エラー：${esc(err.message)}`, false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ポータルへアップロード＆自動反映する";
      }
    });

    function showStatus(htmlMsg, isOk) {
      statusBox.className = "status " + (isOk ? "ok" : "err");
      statusBox.innerHTML = htmlMsg;
      statusBox.style.display = "block";
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
